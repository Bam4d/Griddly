name: build

on:
  push:
    branches: [master, vibe_main, vibe/studio-demo-app, vibe/wasm-npm-pkg]
  pull_request:
    branches: [master, vibe_main]

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          pip install conan==2.34.0 ninja "cmake<4"
          sudo apt-get update
          sudo apt-get install -y libudev-dev libgl1-mesa-dev \
            libx11-dev libx11-xcb-dev libfontenc-dev libice-dev libsm-dev libxau-dev libxaw7-dev \
            libxcomposite-dev libxcursor-dev libxdamage-dev libxext-dev libxfixes-dev libxi-dev \
            libxinerama-dev libxkbfile-dev libxmu-dev libxmuu-dev libxpm-dev libxrandr-dev \
            libxrender-dev libxres-dev libxss-dev libxt-dev libxtst-dev libxv-dev libxxf86vm-dev \
            libxcb-glx0-dev libxcb-render0-dev libxcb-render-util0-dev libxcb-xkb-dev \
            libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-dri3-dev uuid-dev \
            libxcb-cursor-dev libxcb-dri2-0-dev libxcb-present-dev libxcb-composite0-dev libxcb-ewmh-dev libxcb-res0-dev \
            libxcb-util-dev libxcb-util0-dev libxdmcp-dev
          conan profile detect --force

      - name: Conan install
        run: conan install deps/conanfile.txt -pr:h=default -pr:b=default -s build_type=Release --build=missing -of build

      - name: Configure
        run: |
          cmake -S . -B build -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_PYTHON_BINDINGS=ON -DENABLE_TESTING=ON \
            -DPython_ROOT_DIR="$(python -c 'import sys; print(sys.prefix)')" \
            -DPython_EXECUTABLE="$(which python)"

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Run C++ tests (headless, SDL software renderer)
        run: env SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software ./Release/bin/Griddly_Test
        working-directory: ${{ github.workspace }}

      - name: Tiled renderer parity (python bindings)
        run: |
          pip install numpy
          PYTHONPATH=Release/bin python tests/python_tiled_parity.py

      - name: Python smoke test
        run: |
          pip install numpy gymnasium pyyaml pillow
          PYTHONPATH=Release/bin:python python - <<'PY'
          import numpy as np
          from griddly import GriddlyLoader
          loader = GriddlyLoader()
          gdy = loader.load("Single-Player/Mini-Grid/minigrid-spiders.yaml")
          game = gdy.create_game("Sprite2D")
          game.register_player("p1", "Sprite2D")
          game.init(False)
          game.reset()
          obs = game.observe().to_numpy()
          assert obs.shape[0] == 3 and obs.shape[1] > 0
          for _ in range(50):
              game.step_parallel(np.array([[1]], dtype=np.int32))
          img = game.observe().to_image()
          assert img.shape[2] == 4
          print("python smoke test OK, obs", obs.shape, "img", img.shape)
          PY

  # Renderer parity on a GPU machine: SDL GPU and CUDA must match the SDL CPU
  # reference (TiledRendererTest + tests/python_tiled_parity.py). Requires a
  # self-hosted runner labelled `gpu` with the NVIDIA driver, CUDA toolkit
  # and EGL; enable it by setting the repository variable GPU_RUNNER=true.
  # GRIDDLY_REQUIRE_TILED_BACKENDS turns "backend unavailable" skips into
  # failures so a broken driver or build cannot hide a rendering regression.
  gpu-render-parity:
    if: vars.GPU_RUNNER == 'true'
    runs-on: [self-hosted, gpu]
    timeout-minutes: 60
    env:
      GRIDDLY_REQUIRE_TILED_BACKENDS: cuda,sdl_gpu,sdl_gpu_cuda
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Conan install
        run: |
          pip install conan==2.34.0
          conan profile detect --force
          conan install deps/conanfile.txt -pr:h=default -pr:b=default -s build_type=Release --build=missing -of build

      - name: Configure (CUDA on)
        run: |
          cmake -S . -B build -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
            -DGRIDDLY_ENABLE_CUDA=ON \
            -DENABLE_PYTHON_BINDINGS=ON -DENABLE_TESTING=ON \
            -DPython_EXECUTABLE="$(which python3)"

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Tiled renderer parity (C++)
        run: env -u SDL_VIDEODRIVER ./Release/bin/Griddly_Test --gtest_filter='TiledRendererTest.*'

      - name: Tiled renderer parity (python bindings)
        run: env -u SDL_VIDEODRIVER PYTHONPATH=Release/bin python3 tests/python_tiled_parity.py

  # WASM build: no conan needed, deps come from CMake FetchContent and SDL3
  # from the emscripten port (-sUSE_SDL=3). Mirrors js/build.sh.
  build-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install emsdk 4.0.4+ (first release with the SDL3 port, -sUSE_SDL=3)
        run: |
          git clone https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install 4.0.23
          /tmp/emsdk/emsdk activate 4.0.23

      - name: Fetch the SDL3 emscripten port into the sysroot
        run: |
          source /tmp/emsdk/emsdk_env.sh > /dev/null
          printf '#include <SDL3/SDL.h>\nint main(){return 0;}\n' > /tmp/port_probe.c
          emcc -sUSE_SDL=3 /tmp/port_probe.c -o /tmp/port_probe.js
          ls /tmp/emsdk/upstream/emscripten/cache/sysroot/include/SDL3/SDL.h

      - name: Configure
        run: |
          source /tmp/emsdk/emsdk_env.sh > /dev/null
          mkdir -p build_wasm
          emcmake cmake -S . -B build_wasm -GNinja \
            -DWASM=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: |
          source /tmp/emsdk/emsdk_env.sh > /dev/null
          cmake --build build_wasm -j "$(nproc)"

      - name: Verify artifacts
        run: |
          ls -la build_wasm/bin/griddlyjs.js build_wasm/bin/griddlyjs.wasm build_wasm/bin/griddlyjs.data
          test -s build_wasm/bin/griddlyjs.wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: griddlyjs-wasm
          path: |
            build_wasm/bin/griddlyjs.js
            build_wasm/bin/griddlyjs.wasm
            build_wasm/bin/griddlyjs.data

  js-griddly-wasm-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Typecheck + build the package
        working-directory: js/griddly-wasm
        run: |
          npm ci
          npm run build
          npm run typecheck

      - name: Smoke test the WASM module in Node
        working-directory: js/griddly-wasm
        run: |
          node --input-type=module -e "
          import { createGriddly } from './dist/index.js';
          const g = await createGriddly();
          g.loadGDYFile('/resources/games/Single-Player/Mini-Grid/minigrid-doggo.yaml');
          if (g.playerCount !== 1) throw new Error('expected 1 player');
          g.createGame('Vector');
          g.loadLevel(0); g.seed(1); g.reset();
          const r = g.step([2]);
          if (typeof r.reward?.[0] !== 'number') throw new Error('expected numeric reward');
          g.unload();
          console.log('griddly-wasm smoke test OK');
          " 
