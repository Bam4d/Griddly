Version: "0.1"
# Fixture for TiledRendererTest: exercises every feature the tiled renderers
# must agree on (WALL_2 / WALL_16 tiling, all four sprite rotations,
# translucent sprites over a background tile, render
# tile ids, five objects stacked in one cell). Level 0 is deterministic (only
# the avatar and the key's tile change); level 1 adds randomly moving bats.
Environment:
  Name: TiledParity
  Observers:
    Sprite2D:
      TileSize: 24
      BackgroundTile: gvgai/oryx/floor2.png
    Block2D:
      TileSize: 24
    Sprite2DNoRotate:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: gvgai/oryx/floor2.png
      RotateAvatarImage: false
  Player:
    AvatarObject: avatar
  Levels:
    - |
      w  w  w  w  w  w  w  w  w  w
      w  .  .  W  W  W  .  .  .  w
      w  A  .  W  .  W  .  g[R]  .  w
      w  .  .  W  W  W  .  g[D]  .  w
      w  k  .  .  .  .  .  g[L]  .  w
      w  k/g  .  w  w  .  W  g[U]  .  w
      w  k/g/s  .  w  .  .  W  .  o  w
      w  k/g/s/o/m  .  .  .  W  W  W  .  w
      w  w  w  w  w  w  w  w  w  w
    - |
      w  w  w  w  w  w  w  w
      w  A  .  .  b  .  .  w
      w  .  W  W  .  g  .  w
      w  b  W  .  .  .  k  w
      w  .  .  .  b  .  .  w
      w  w  w  w  w  w  w  w

Actions:
  - Name: move
    InputMapping:
      Inputs:
        1:
          Description: Rotate left
          OrientationVector: [-1, 0]
        2:
          Description: Move forwards
          OrientationVector: [0, -1]
          VectorToDest: [0, -1]
        3:
          Description: Rotate right
          OrientationVector: [1, 0]
      Relative: true
    Behaviours:
      - Src:
          Object: avatar
          Commands:
            - mov: _dest
        Dst:
          Object: _empty
      - Src:
          Object: avatar
          Commands:
            - rot: _dir
        Dst:
          Object: avatar

  - Name: wander
    InputMapping:
      Internal: true
      Inputs:
        1:
          OrientationVector: [-1, 0]
          VectorToDest: [-1, 0]
        2:
          OrientationVector: [0, -1]
          VectorToDest: [0, -1]
        3:
          OrientationVector: [1, 0]
          VectorToDest: [1, 0]
        4:
          OrientationVector: [0, 1]
          VectorToDest: [0, 1]
    Behaviours:
      - Src:
          Object: bat
          Commands:
            - mov: _dest
            - exec:
                Action: wander
                Delay: 1
                Randomize: true
        Dst:
          Object: [_empty, key]
      - Src:
          Object: bat
          Commands:
            - exec:
                Action: wander
                Delay: 1
                Randomize: true
        Dst:
          Object: [wall, wall16, ghost, avatar, bat]

  - Name: flip_tile
    InputMapping:
      Internal: true
    Behaviours:
      - Src:
          Object: key
          Commands:
            - set_tile: 1
            - exec:
                Action: flip_back
                Delay: 2
        Dst:
          Object: key
  - Name: flip_back
    InputMapping:
      Internal: true
    Behaviours:
      - Src:
          Object: key
          Commands:
            - set_tile: 0
            - exec:
                Action: flip_tile
                Delay: 2
        Dst:
          Object: key

Objects:
  - Name: wall
    MapCharacter: w
    Observers:
      Sprite2D: &wall_sprite
        - TilingMode: WALL_2
          Image:
            - gvgai/newset/chamber_wall.png
            - gvgai/newset/chamber_wall2.png
      Sprite2DNoRotate: *wall_sprite
      Block2D:
        - Shape: square
          Color: [0.5, 0.5, 0.5]

  - Name: wall16
    MapCharacter: W
    Observers:
      Sprite2D: &wall16_sprite
        - TilingMode: WALL_16
          Image:
            - gvgai/oryx/wall3_0.png
            - gvgai/oryx/wall3_1.png
            - gvgai/oryx/wall3_2.png
            - gvgai/oryx/wall3_3.png
            - gvgai/oryx/wall3_4.png
            - gvgai/oryx/wall3_5.png
            - gvgai/oryx/wall3_6.png
            - gvgai/oryx/wall3_7.png
            - gvgai/oryx/wall3_8.png
            - gvgai/oryx/wall3_9.png
            - gvgai/oryx/wall3_10.png
            - gvgai/oryx/wall3_11.png
            - gvgai/oryx/wall3_12.png
            - gvgai/oryx/wall3_13.png
            - gvgai/oryx/wall3_14.png
            - gvgai/oryx/wall3_15.png
      Sprite2DNoRotate: *wall16_sprite
      Block2D:
        - Shape: square
          Color: [0.3, 0.3, 0.6]

  - Name: key
    MapCharacter: k
    Z: 1
    InitialActions:
      - Action: flip_tile
        Delay: 1
    Observers:
      Sprite2D: &key_sprite
        - Image: gvgai/oryx/key2.png
        - Image: gvgai/oryx/fire1.png
      Sprite2DNoRotate: *key_sprite
      Block2D:
        - Shape: triangle
          Color: [0.9, 0.9, 0.1]
        - Shape: square
          Color: [0.9, 0.3, 0.1]

  - Name: ghost
    MapCharacter: g
    Z: 2
    Observers:
      Sprite2D: &ghost_sprite
        - Image: gvgai/oryx/ghost1.png
      Sprite2DNoRotate: *ghost_sprite
      Block2D:
        - Shape: triangle
          Color: [0.8, 0.8, 0.8]

  - Name: spider
    MapCharacter: s
    Z: 3
    Observers:
      Sprite2D: &spider_sprite
        - Image: oryx/oryx_fantasy/avatars/spider1.png
      Sprite2DNoRotate: *spider_sprite
      Block2D:
        - Shape: triangle
          Color: [0.6, 0.1, 0.1]

  - Name: orb
    MapCharacter: o
    Z: 4
    Observers:
      Sprite2D: &orb_sprite
        - Image: gvgai/oryx/orb1.png
      Sprite2DNoRotate: *orb_sprite
      Block2D:
        - Shape: square
          Color: [0.1, 0.6, 0.9]
          Scale: 0.5

  # fifth object in one cell: grows the CUDA renderer's per-cell layer count
  - Name: mushroom
    MapCharacter: m
    Z: 5
    Observers:
      Sprite2D: &mushroom_sprite
        - Image: gvgai/oryx/mushroom1.png
      Sprite2DNoRotate: *mushroom_sprite
      Block2D:
        - Shape: triangle
          Color: [0.9, 0.5, 0.9]
          Scale: 0.4

  - Name: avatar
    MapCharacter: A
    Z: 6
    Observers:
      Sprite2D: &avatar_sprite
        - Image: gvgai/oryx/cyclop1.png
      Sprite2DNoRotate: *avatar_sprite
      Block2D:
        - Shape: triangle
          Color: [0.2, 0.8, 0.2]

  - Name: bat
    MapCharacter: b
    Z: 7
    InitialActions:
      - Action: wander
        Randomize: true
    Observers:
      Sprite2D: &bat_sprite
        - Image: gvgai/oryx/bat1.png
      Sprite2DNoRotate: *bat_sprite
      Block2D:
        - Shape: triangle
          Color: [0.4, 0.2, 0.6]
