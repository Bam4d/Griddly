    Z: 0
    InitialActions:
      - Action: belt_s_anim
        ActionId: 1
    Observers:
      Sprite2D: &belt_s_sprite
        - Image: memes/rackpacker-belt-down-0.png
        - Image: memes/rackpacker-belt-down-1.png
