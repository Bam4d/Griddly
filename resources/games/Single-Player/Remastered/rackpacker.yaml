  - Name: installed
    Z: 1
    InitialActions:
      - Action: installed_anim
        ActionId: 1
    Observers:
      Sprite2D: &installed_sprite
        - Image: memes/rack-busy-0.png
        - Image: memes/rack-busy-1.png
      FollowCam: *installed_sprite
      CloseUp: *installed_sprite
      Block2D:
        - Shape: square
          Color: [0.2, 0.8, 0.3]
          Scale: 0.95
        - Shape: square
          Color: [0.2, 0.8, 0.3]
          Scale: 0.95
  - Name: slotfire
    Z: 1
    Observers:
      Sprite2D: &slotfire_sprite
        - Image: memes/rackpacker-slotfire.png
      FollowCam: *slotfire_sprite
      CloseUp: *slotfire_sprite
      Block2D:
        - Shape: square
          Color: [1.0, 0.2, 0.0]
          Scale: 0.95
