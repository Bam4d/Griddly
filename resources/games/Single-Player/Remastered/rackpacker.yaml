    Z: 0
    Observers:
      Sprite2D: &cable_sprite
        - Image: memes/cable.png
      FollowCam: *cable_sprite
      CloseUp: *cable_sprite
      Block2D:
        - Shape: square
          Color: [0.2, 0.4, 0.9]
