Version: "0.1"
Environment:
  Name: Rack Packer
  Description: |
    Sokoban in the datacenter. Bufo pushes GPU cards into empty rack slots. Hot cards must slide over
    a coolant puddle first (a hot card in a rack sets it on fire). Mistral-logo conveyor belts carry
    cards one cell per tick until they leave the belt or bump into something. Fill every slot.
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Sprite2D   whole level (global observer)
  #   FollowCam  15x11 window that follows the avatar
  #   CloseUp    9x9 window that follows the avatar (also the agent's default view)
  Observers:
    Sprite2D:
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      TrackAvatar: false
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 15
      Height: 11
    CloseUp:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 9
      Height: 9
    Block2D:
      TileSize: 24
  Variables:
    - Name: open
      InitialValue: 0
    - Name: melted
      InitialValue: 0
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: false
      Width: 9
      Height: 9
    AvatarObject: bufo
  Termination:
    Win:
      - eq: [open, 0]
    Lose:
      - gt: [melted, 0]
  Levels:
    # Day One | Push the three GPU cards into the empty rack slots.
    - |
      W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W
      W   .   .   .   .   .   .   .   W   .   .   .   .   .   .   .   W
      W   .   .   g   .   .   .   .   W   .   .   R   o   R   .   .   W
      W   .   .   .   .   .   .   .   .   .   .   .   x   .   .   .   W
      W   .   .   A   .   .   g   .   .   .   .   .   x   .   .   .   W
      W   .   .   .   .   .   .   W   W   .   .   .   x   x   .   .   W
      W   .   .   g   .   .   .   W   .   .   .   .   .   x   .   .   W
      W   .   .   .   .   .   .   W   .   .   .   .   R   o   R   R   W
      W   R   o   R   W   W   W   W   W   W   W   W   W   W   W   W   W
      W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W
    # Hot Swap | Hot cards set racks on fire. Slide them over a coolant puddle first.
    - |
      W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W
      W   .   .   .   .   .   .   .   .   W   .   .   .   .   .   .   .   W
      W   .   .   h   .   .   .   .   .   W   .   .   .   h   .   .   .   W
      W   .   .   .   .   .   k   .   .   .   .   .   .   k   .   .   .   W
      W   .   .   A   .   .   .   .   .   .   .   .   .   g   .   .   .   W
      W   .   .   .   .   W   W   W   .   .   .   .   .   .   .   .   .   W
      W   .   .   .   .   W   .   .   .   .   .   .   .   .   .   .   .   W
      W   R   R   o   R   R   R   R   R   R   o   R   R   R   o   R   R   W
      W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W
    # Conveyor | Mistral belts carry cards one cell per tick - even round corners you can't push them.
    - |
      W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W
      W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   o   W
      W   .   .   g   .   .   .   .   >   >   >   >   >   >   >   >   >   n   W
      W   .   .   .   .   .   .   .   n   W   W   W   W   W   W   W   W   W   W
      W   .   .   A   .   .   .   .   n   .   .   .   .   .   .   .   .   .   W
      W   .   .   .   .   .   .   .   n   .   .   .   .   .   .   .   .   .   W
      W   .   .   g   .   .   .   .   n   .   .   .   .   .   .   .   .   .   W
      W   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   W
      W   R   R   R   o   R   R   R   R   R   R   R   R   R   R   R   R   R   W
      W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W
    # Supply Chain | A hot card rides the belt over a coolant puddle. Mind where it stops.
    - |
      W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W
      W   .   .   .   .   .   .   .   .   W   W   W   W   W   W   W   W   R   o   W
      W   .   .   g   .   .   .   .   .   W   .   .   >   >   k   >   >   v   .   W
      W   .   .   .   .   .   .   .   .   W   .   .   n   .   W   W   .   v   .   W
      W   .   .   A   .   .   h   .   .   .   .   .   n   .   W   W   .   v   .   W
      W   .   .   .   .   .   .   .   .   .   .   .   n   .   .   .   .   v   .   W
      W   .   .   .   .   .   k   .   .   W   .   .   h   .   .   .   .   .   .   W
      W   .   .   .   .   .   .   .   .   W   .   .   .   .   .   .   .   .   .   W
      W   R   R   o   R   R   R   R   R   W   R   R   R   R   R   o   R   R   R   W
      W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W
    # Rack Packer | Everything at once: belts, coolant, hot cards and a long rack row.
    - |
      W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W
      W   .   .   .   .   .   .   .   .   .   W   W   W   W   W   W   W   W   W   W   o   W
      W   .   .   h   .   .   .   .   .   .   W   .   .   >   >   >   >   k   >   >   n   W
      W   .   .   .   .   .   k   .   .   .   .   .   .   n   .   W   W   W   W   W   W   W
      W   .   .   A   .   .   .   .   .   .   .   .   .   n   .   .   .   .   .   .   .   W
      W   .   .   g   .   .   .   .   .   .   W   .   .   n   .   .   .   h   .   .   .   W
      W   .   .   .   .   .   .   .   .   .   W   .   .   n   .   .   .   .   .   .   .   W
      W   .   .   g   .   .   .   .   .   .   W   .   .   .   .   .   .   .   .   .   .   W
      W   R   R   o   R   R   R   R   o   R   W   R   R   R   R   R   o   R   R   R   R   W
      W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W

Actions:
  - Name: face
    InputMapping:
      Internal: true
      Inputs:
        2: {Description: Face down, VectorToDest: [0, 0], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: bufo}

  # Bufo walks (floor, coolant, belts: sticky toad feet) and pushes a card that isn't riding a belt.
  - Name: move
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}, {mov: _dest}]}
        Dst: {Object: [_empty, cable, coolant, belt_w, belt_n, belt_e, belt_s]}
      - Src:
          Object: bufo
          Preconditions: [{eq: [dst.riding, 0]}]
          Commands: [{set_tile: meta.facing}, {mov: _dest}]
        Dst: {Object: [gpu, hotgpu], Commands: [{cascade: _dest}]}
      - Src:
          Object: bufo
          Preconditions: [{eq: [dst.riding, 1]}]
          Commands: [{set_tile: meta.facing}]
        Dst: {Object: [gpu, hotgpu]}
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [wall, rack, installed, slotfire, slot]}
      - Src: {Object: gpu, Commands: [{mov: _dest}, {set: [riding, 0]}]}
        Dst: {Object: [_empty, cable, coolant]}
      - Src: {Object: gpu, Commands: [{mov: _dest}, {set: [riding, 1]}, {exec: {Action: ride, ActionId: 1, Delay: 1}}]}
        Dst: {Object: belt_w}
      - Src: {Object: gpu, Commands: [{mov: _dest}, {set: [riding, 1]}, {exec: {Action: ride, ActionId: 2, Delay: 1}}]}
        Dst: {Object: belt_n}
      - Src: {Object: gpu, Commands: [{mov: _dest}, {set: [riding, 1]}, {exec: {Action: ride, ActionId: 3, Delay: 1}}]}
        Dst: {Object: belt_e}
      - Src: {Object: gpu, Commands: [{mov: _dest}, {set: [riding, 1]}, {exec: {Action: ride, ActionId: 4, Delay: 1}}]}
        Dst: {Object: belt_s}
      - Src: {Object: gpu, Commands: [{remove: true}]}
        Dst: {Object: slot, Commands: [{decr: open}, {change_to: installed}]}
      - Src: {Object: gpu, Commands: [{set: [riding, 0]}]}
        Dst: {Object: [wall, rack, installed, slotfire, gpu, hotgpu, bufo]}
      - Src: {Object: hotgpu, Commands: [{mov: _dest}, {set: [riding, 0]}]}
        Dst: {Object: [_empty, cable]}
      - Src: {Object: hotgpu, Commands: [{mov: _dest}, {change_to: gpu}]}
        Dst: {Object: coolant}
      - Src: {Object: hotgpu, Commands: [{mov: _dest}, {set: [riding, 1]}, {exec: {Action: ride, ActionId: 1, Delay: 1}}]}
        Dst: {Object: belt_w}
      - Src: {Object: hotgpu, Commands: [{mov: _dest}, {set: [riding, 1]}, {exec: {Action: ride, ActionId: 2, Delay: 1}}]}
        Dst: {Object: belt_n}
      - Src: {Object: hotgpu, Commands: [{mov: _dest}, {set: [riding, 1]}, {exec: {Action: ride, ActionId: 3, Delay: 1}}]}
        Dst: {Object: belt_e}
      - Src: {Object: hotgpu, Commands: [{mov: _dest}, {set: [riding, 1]}, {exec: {Action: ride, ActionId: 4, Delay: 1}}]}
        Dst: {Object: belt_s}
      - Src: {Object: hotgpu, Commands: [{remove: true}]}
        Dst: {Object: slot, Commands: [{incr: melted}, {change_to: slotfire}]}
      - Src: {Object: hotgpu, Commands: [{set: [riding, 0]}]}
        Dst: {Object: [wall, rack, installed, slotfire, gpu, hotgpu, bufo]}

  # A belt carries the card on it one cell per tick (the card schedules its next ride when it lands on a
  # belt; it stops when it leaves the belts or bumps into something).
  - Name: ride
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: West, VectorToDest: [-1, 0]}
        2: {Description: North, VectorToDest: [0, -1]}
        3: {Description: East, VectorToDest: [1, 0]}
        4: {Description: South, VectorToDest: [0, 1]}
    Behaviours:
      - Src: {Object: gpu, Commands: [{mov: _dest}, {set: [riding, 0]}]}
        Dst: {Object: [_empty, cable, coolant]}
      - Src: {Object: gpu, Commands: [{mov: _dest}, {set: [riding, 1]}, {exec: {Action: ride, ActionId: 1, Delay: 1}}]}
        Dst: {Object: belt_w}
      - Src: {Object: gpu, Commands: [{mov: _dest}, {set: [riding, 1]}, {exec: {Action: ride, ActionId: 2, Delay: 1}}]}
        Dst: {Object: belt_n}
      - Src: {Object: gpu, Commands: [{mov: _dest}, {set: [riding, 1]}, {exec: {Action: ride, ActionId: 3, Delay: 1}}]}
        Dst: {Object: belt_e}
      - Src: {Object: gpu, Commands: [{mov: _dest}, {set: [riding, 1]}, {exec: {Action: ride, ActionId: 4, Delay: 1}}]}
        Dst: {Object: belt_s}
      - Src: {Object: gpu, Commands: [{remove: true}]}
        Dst: {Object: slot, Commands: [{decr: open}, {change_to: installed}]}
      - Src: {Object: gpu, Commands: [{set: [riding, 0]}]}
        Dst: {Object: [wall, rack, installed, slotfire, gpu, hotgpu, bufo]}
      - Src: {Object: hotgpu, Commands: [{mov: _dest}, {set: [riding, 0]}]}
        Dst: {Object: [_empty, cable]}
      - Src: {Object: hotgpu, Commands: [{mov: _dest}, {change_to: gpu}]}
        Dst: {Object: coolant}
      - Src: {Object: hotgpu, Commands: [{mov: _dest}, {set: [riding, 1]}, {exec: {Action: ride, ActionId: 1, Delay: 1}}]}
        Dst: {Object: belt_w}
      - Src: {Object: hotgpu, Commands: [{mov: _dest}, {set: [riding, 1]}, {exec: {Action: ride, ActionId: 2, Delay: 1}}]}
        Dst: {Object: belt_n}
      - Src: {Object: hotgpu, Commands: [{mov: _dest}, {set: [riding, 1]}, {exec: {Action: ride, ActionId: 3, Delay: 1}}]}
        Dst: {Object: belt_e}
      - Src: {Object: hotgpu, Commands: [{mov: _dest}, {set: [riding, 1]}, {exec: {Action: ride, ActionId: 4, Delay: 1}}]}
        Dst: {Object: belt_s}
      - Src: {Object: hotgpu, Commands: [{remove: true}]}
        Dst: {Object: slot, Commands: [{incr: melted}, {change_to: slotfire}]}
      - Src: {Object: hotgpu, Commands: [{set: [riding, 0]}]}
        Dst: {Object: [wall, rack, installed, slotfire, gpu, hotgpu, bufo]}

  # Count the empty slots at reset (win: open == 0).
  - Name: count_slot
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Count, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: slot, Commands: [{incr: open}]}
        Dst: {Object: slot}

  # Wait one tick (let the belts do the work).
  - Name: nap
    InputMapping:
      Inputs:
        1: {Description: Nap, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: bufo, Commands: [{nop: true}]}
        Dst: {Object: bufo}
  - Name: belt_w_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 1}}
    Behaviours:
      - Src:
          Object: belt_w
          Commands:
            - set_tile: meta.tile
            - exec: {Action: belt_w_anim, ActionId: meta.next, Delay: 2}
        Dst: {Object: [belt_w, gpu, hotgpu, bufo]}
  - Name: belt_n_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 1}}
    Behaviours:
      - Src:
          Object: belt_n
          Commands:
            - set_tile: meta.tile
            - exec: {Action: belt_n_anim, ActionId: meta.next, Delay: 2}
        Dst: {Object: [belt_n, gpu, hotgpu, bufo]}
  - Name: belt_e_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 1}}
    Behaviours:
      - Src:
          Object: belt_e
          Commands:
            - set_tile: meta.tile
            - exec: {Action: belt_e_anim, ActionId: meta.next, Delay: 2}
        Dst: {Object: [belt_e, gpu, hotgpu, bufo]}
  - Name: belt_s_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 1}}
    Behaviours:
      - Src:
          Object: belt_s
          Commands:
            - set_tile: meta.tile
            - exec: {Action: belt_s_anim, ActionId: meta.next, Delay: 2}
        Dst: {Object: [belt_s, gpu, hotgpu, bufo]}
  - Name: installed_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 1}}
    Behaviours:
      - Src:
          Object: installed
          Commands:
            - set_tile: meta.tile
            - exec: {Action: installed_anim, ActionId: meta.next, Delay: 4}
        Dst: {Object: [installed]}

