      Sprite2D: &belt_w_sprite
        - Image: memes/rackpacker-belt-left-0.png
        - Image: memes/rackpacker-belt-left-1.png
      FollowCam: *belt_w_sprite
      CloseUp: *belt_w_sprite
      Block2D:
        - Shape: triangle
          Color: [1.0, 0.55, 0.0]
          Scale: 0.6
        - Shape: triangle
          Color: [1.0, 0.55, 0.0]
          Scale: 0.6
  - Name: belt_n
    MapCharacter: "n"
    Z: 0
    InitialActions:
      - Action: belt_n_anim
        ActionId: 1
    Observers:
      Sprite2D: &belt_n_sprite
        - Image: memes/rackpacker-belt-up-0.png
        - Image: memes/rackpacker-belt-up-1.png
      FollowCam: *belt_n_sprite
      CloseUp: *belt_n_sprite
      Block2D:
        - Shape: triangle
          Color: [1.0, 0.55, 0.0]
          Scale: 0.6
        - Shape: triangle
          Color: [1.0, 0.55, 0.0]
          Scale: 0.6
  - Name: belt_e
    MapCharacter: ">"
    Z: 0
    InitialActions:
      - Action: belt_e_anim
        ActionId: 1
    Observers:
      Sprite2D: &belt_e_sprite
        - Image: memes/rackpacker-belt-right-0.png
        - Image: memes/rackpacker-belt-right-1.png
      FollowCam: *belt_e_sprite
      CloseUp: *belt_e_sprite
      Block2D:
        - Shape: triangle
          Color: [1.0, 0.55, 0.0]
          Scale: 0.6
        - Shape: triangle
