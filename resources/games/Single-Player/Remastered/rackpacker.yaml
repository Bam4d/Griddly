    Z: 0
    Observers:
      Sprite2D: &coolant_sprite
        - Image: memes/rackpacker-coolant.png
      FollowCam: *coolant_sprite
      CloseUp: *coolant_sprite
      Block2D:
        - Shape: circle
          Color: [0.2, 0.7, 0.9]
          Scale: 0.8
  - Name: belt_w
