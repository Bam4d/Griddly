  - Name: wall
    MapCharacter: "W"
    Z: 1
    Observers:
      Sprite2D: &wall_sprite
        - TilingMode: WALL_16
          Image:
            - memes/dcwall-0.png
            - memes/dcwall-1.png
            - memes/dcwall-2.png
            - memes/dcwall-3.png
            - memes/dcwall-4.png
            - memes/dcwall-5.png
            - memes/dcwall-6.png
            - memes/dcwall-7.png
            - memes/dcwall-8.png
            - memes/dcwall-9.png
