Actions:
  - Name: face
    InputMapping:
      Internal: true
      Inputs:
        2: {Description: Face down, VectorToDest: [0, 0], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: avatar}

  # Counts the boxes at reset (every box runs it once): the win condition is box_count == 0.
  - Name: box_counter
    InputMapping:
      Internal: true
      Inputs:
        1:
          Description: "The only action here is to increment the box count"
    Behaviours:
      - Src: {Object: [red_box, green_box, blue_box], Commands: [{incr: box_count}]}
        Dst: {Object: [red_box, green_box, blue_box]}

  # Absolute 4-way movement. Walking into a box pushes it. A box pushed against a block of its own
  # colour becomes part of it; a box pushed onto spikes breaks; walking onto spikes is fatal.
  - Name: move
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}, {mov: _dest}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}, {mov: _dest}]}
        Dst: {Object: [red_box, green_box, blue_box], Commands: [{cascade: _dest}]}
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [wall, water, tree, bush, rock, hedge, stone, tombstone, torch, red_block, green_block, blue_block, broken_box]}
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}, {remove: true}, {reward: -1}]}
        Dst: {Object: spike}
      - Src: {Object: [red_box, green_box, blue_box], Commands: [{mov: _dest}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: red_box, Commands: [{change_to: red_block}, {reward: 1}, {decr: box_count}]}
        Dst: {Object: red_block}
      - Src: {Object: green_box, Commands: [{change_to: green_block}, {reward: 1}, {decr: box_count}]}
        Dst: {Object: green_block}
      - Src: {Object: blue_box, Commands: [{change_to: blue_block}, {reward: 1}, {decr: box_count}]}
        Dst: {Object: blue_block}
      - Src: {Object: [red_box, green_box, blue_box], Commands: [{change_to: broken_box}, {reward: -1}]}
        Dst: {Object: spike}

