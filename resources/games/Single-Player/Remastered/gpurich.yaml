Version: "0.1"
Environment:
  Name: GPU Rich
  Description: |
    An isometric datacenter economy. Bufo collects mayo, pays 2 mayo to install a GPU on a server pad
    (build), GPUs mint tokens over time, and bufo carries the tokens to the Mistral HQ. A GPU placed
    next to 3 live GPUs overheats and burns; hot GPUs mint slowly. Reach the investors' token target
    before the runway runs out. Le chaton fat eats tokens.
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Isometric  whole level, isometric (the main view of this game)
  #   IsoFollow  11x11 isometric window that follows the avatar
  #   Sprite2D   whole level, top-down
  #   FollowCam  15x11 top-down window that follows the avatar
  #   CloseUp    9x9 top-down window that follows the avatar (also the agent's default view)
  Observers:
    Isometric:
      TileSize: [32, 48]
      IsoTileHeight: 16
      IsoTileDepth: 4
      BackgroundTile: remastered/gpurich-iso-floor.png
    IsoFollow:
      Type: ISOMETRIC
      TileSize: [32, 48]
      IsoTileHeight: 16
      IsoTileDepth: 4
      BackgroundTile: remastered/gpurich-iso-floor.png
      TrackAvatar: true
      RotateWithAvatar: false
      Width: 11
      Height: 11
    Sprite2D:
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      TrackAvatar: false
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 15
      Height: 11
    CloseUp:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 9
      Height: 9
    Block2D:
      TileSize: 24
  Variables:
    - Name: tokens
      InitialValue: 0
    - Name: target
      InitialValue: 0
    - Name: runway
      InitialValue: 0
    - Name: gpus
      InitialValue: 0
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: false
      Width: 9
      Height: 9
    AvatarObject: bufo
  Termination:
    Win:
      - gte: [tokens, target]
    Lose:
      - lte: [runway, 0]
  Levels:
    # Seed Round | Grab mayo, install GPUs on the pads, bring 10 tokens to HQ.
    - |
      W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W
      W   .   .   .   .   .   U   .   .   .   .   .   .   .   .   U   .   .   .   .   .   W
      W   .   F   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   W
      W   .   .   .   .   .   P   .   .   .   P   .   .   .   P   .   .   .   .   .   .   W
      W   .   j   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   W
      W   .   .   .   .   .   P   .   .   .   P   .   .   .   P   .   .   .   .   .   .   W
      W   .   j   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   W
      W   .   A   .   .   .   .   .   .   .   H   .   .   .   .   .   .   V   .   .   .   W
      W   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   W
      W   .   R   R   .   R   R   .   R   R   .   R   R   .   R   R   .   R   R   .   .   W
