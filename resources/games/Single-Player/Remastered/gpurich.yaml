Actions:
  - Name: face
    InputMapping:
      Internal: true
      Inputs:
        2: {Description: Face down, VectorToDest: [0, 0], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: bufo}

  # Investors and calendars set the level's token target and runway at reset.
  - Name: setup
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Setup, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: investor, Commands: [{add: [target, 10]}]}
        Dst: {Object: [investor, bufo, cat]}
      - Src: {Object: calendar, Commands: [{add: [runway, 10]}]}
        Dst: {Object: [calendar, bufo, cat]}

  # The HQ burns one unit of runway every 10 ticks.
  - Name: clock
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Tick, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: hq, Commands: [{decr: runway}, {exec: {Action: clock, ActionId: 1, Delay: 10}}]}
        Dst: {Object: [hq, bufo, cat]}

  # A new GPU probes its 4 neighbours once: each live GPU neighbour heats both by 1.
  - Name: probe
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: West, VectorToDest: [-1, 0]}
        2: {Description: North, VectorToDest: [0, -1]}
        3: {Description: East, VectorToDest: [1, 0]}
        4: {Description: South, VectorToDest: [0, 1]}
    Behaviours:
      - Src: {Object: gpu, Commands: [{incr: heat}]}
        Dst: {Object: gpu, Commands: [{incr: heat}, {if: {Conditions: {lte: [heat, 1]}, OnTrue: [{set_tile: 0}]}}, {if: {Conditions: {eq: [heat, 2]}, OnTrue: [{set_tile: 1}]}}, {if: {Conditions: {gte: [heat, 3]}, OnTrue: [{set_tile: 2}]}}]}

  # One tick after placement: 3+ live neighbours = meltdown, else show the heat level.
  - Name: settle
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Settle, VectorToDest: [0, 0]}
    Behaviours:
      - Src:
          Object: gpu
          Commands:
            - if: {Conditions: {lte: [heat, 1]}, OnTrue: [{set_tile: 0}]}
            - if: {Conditions: {eq: [heat, 2]}, OnTrue: [{set_tile: 1}]}
            - if: {Conditions: {gte: [heat, 3]}, OnTrue: [{decr: gpus}, {change_to: gpu_fire}]}
        Dst: {Object: [gpu, bufo, cat]}

  # A burning GPU cools its neighbours back down, then leaves an empty pad.
  - Name: unprobe
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: West, VectorToDest: [-1, 0]}
        2: {Description: North, VectorToDest: [0, -1]}
        3: {Description: East, VectorToDest: [1, 0]}
        4: {Description: South, VectorToDest: [0, 1]}
    Behaviours:
      - Src: {Object: gpu_fire}
        Dst: {Object: gpu, Commands: [{decr: heat}, {if: {Conditions: {lte: [heat, 1]}, OnTrue: [{set_tile: 0}]}}, {if: {Conditions: {eq: [heat, 2]}, OnTrue: [{set_tile: 1}]}}, {if: {Conditions: {gte: [heat, 3]}, OnTrue: [{set_tile: 2}]}}]}
  - Name: burnout
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Burn out, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: gpu_fire, Commands: [{change_to: pad}]}
        Dst: {Object: [gpu_fire, bufo, cat]}

  # GPUs mint a token into a random free neighbour every 14 + 7*heat ticks.
  - Name: mint
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: West, VectorToDest: [-1, 0]}
        2: {Description: North, VectorToDest: [0, -1]}
        3: {Description: East, VectorToDest: [1, 0]}
        4: {Description: South, VectorToDest: [0, 1]}
    Behaviours:
      - Src: {Object: gpu, Commands: [{spawn: token}, {set: [rate, 14]}, {add: [rate, heat]}, {add: [rate, heat]}, {add: [rate, heat]}, {add: [rate, heat]}, {add: [rate, heat]}, {add: [rate, heat]}, {add: [rate, heat]}, {exec: {Action: mint, Delay: rate, Randomize: true}}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: gpu, Commands: [{exec: {Action: mint, Delay: 3, Randomize: true}}]}
        Dst: {Object: [wall, rack, hq, fridge, investor, calendar, pad, gpu, gpu_fire, token, jar, cat, bufo]}

  # Fridges drop a mayo jar into a random free neighbour every ~28 ticks.
  - Name: chill
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: West, VectorToDest: [-1, 0]}
        2: {Description: North, VectorToDest: [0, -1]}
        3: {Description: East, VectorToDest: [1, 0]}
        4: {Description: South, VectorToDest: [0, 1]}
    Behaviours:
      - Src: {Object: fridge, Commands: [{spawn: jar}, {exec: {Action: chill, Delay: 28, Randomize: true}}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: fridge, Commands: [{exec: {Action: chill, Delay: 5, Randomize: true}}]}
        Dst: {Object: [wall, rack, hq, fridge, investor, calendar, pad, gpu, gpu_fire, token, jar, cat, bufo]}

  # Le chaton fat wanders and eats any token it walks into.
  - Name: prowl
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: West, VectorToDest: [-1, 0]}
        2: {Description: North, VectorToDest: [0, -1]}
        3: {Description: East, VectorToDest: [1, 0]}
        4: {Description: South, VectorToDest: [0, 1]}
    Behaviours:
      - Src: {Object: cat, Commands: [{mov: _dest}, {exec: {Action: prowl, Delay: 3, Randomize: true}}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: cat, Commands: [{mov: _dest}, {exec: {Action: prowl, Delay: 3, Randomize: true}}]}
        Dst: {Object: token, Commands: [{remove: true}]}
      - Src: {Object: cat, Commands: [{exec: {Action: prowl, Delay: 3, Randomize: true}}]}
        Dst: {Object: [wall, rack, hq, fridge, investor, calendar, pad, gpu, gpu_fire, jar, cat, bufo]}

  # Bufo walks up / down / left / right. Into a jar: +1 mayo; into a token: +1 carried; into the HQ:
  # deliver every carried token.
  - Name: move
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}, {mov: _dest}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src:
          Object: bufo
          Preconditions: [{lt: [src.mayo, 6]}]
          Commands: [{set_tile: meta.facing}, {mov: _dest}, {incr: mayo}]
        Dst: {Object: jar, Commands: [{remove: true}]}
      - Src:
          Object: bufo
          Preconditions: [{lt: [src.carry, 12]}]
          Commands: [{set_tile: meta.facing}, {mov: _dest}, {incr: carry}, {reward: 1}]
        Dst: {Object: token, Commands: [{remove: true}]}
      - Src:
          Object: bufo
          Commands: [{set_tile: meta.facing}, {add: [tokens, carry]}, {reward: carry}, {set: [carry, 0]}]
        Dst: {Object: hq}
      - Src:
          Object: bufo
          Preconditions: [{gte: [src.mayo, 6]}]
          Commands: [{set_tile: meta.facing}]
        Dst: {Object: jar}
      - Src:
          Object: bufo
          Preconditions: [{gte: [src.carry, 12]}]
          Commands: [{set_tile: meta.facing}]
        Dst: {Object: token}
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [wall, rack, fridge, investor, calendar, pad, gpu, gpu_fire, cat]}

  # Install a GPU on the server pad in front (directional; the UI sends the last move direction).
  - Name: build
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src:
          Object: bufo
          Preconditions: [{gte: [src.mayo, 2]}]
