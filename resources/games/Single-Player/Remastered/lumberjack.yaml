      CloseUp: *grass_sprite
      Block2D:
        - Shape: square
          Color: [0.25, 0.55, 0.25]
          Scale: 0.9
  - Name: moss
    MapCharacter: ";"
    Z: 0
    Observers:
      Sprite2D: &moss_sprite
        - Image: oryx/oryx_tiny_galaxy/tg_sliced/tg_world/tg_world_floor_moss_a.png
      FollowCam: *moss_sprite
      CloseUp: *moss_sprite
      Block2D:
        - Shape: square
          Color: [0.25, 0.4, 0.2]
          Scale: 0.9
  - Name: dirt
    MapCharacter: ":"
    Z: 0
    Observers:
      Sprite2D: &dirt_sprite
        - Image: oryx/oryx_tiny_galaxy/tg_sliced/tg_world/tg_world_floor_dirt_a.png
      FollowCam: *dirt_sprite
      CloseUp: *dirt_sprite
      Block2D:
        - Shape: square
          Color: [0.3, 0.22, 0.15]
          Scale: 0.9
  - Name: sand
    MapCharacter: "_"
    Z: 0
    Observers:
      Sprite2D: &sand_sprite
        - Image: oryx/oryx_tiny_galaxy/tg_sliced/tg_world/tg_world_floor_sand_a.png
      FollowCam: *sand_sprite
      CloseUp: *sand_sprite
      Block2D:
        - Shape: square
          Color: [0.7, 0.55, 0.3]
