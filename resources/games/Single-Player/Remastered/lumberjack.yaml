      $   .   &   &   &   ;   ;   ;   :   ~   ~   ~   ,   ,   .   ,   ,   .   .   .   .   h   ,   ,   ,   $
      $   .   .   &   ,   .   ;   ,   ,   .   ~   ~   ,   ,   ,   ,   .   ,   ,   .   .   .   ,   ,   ,   $
      $   .   .   ,   .   ;   ,   ,   ,   ,   ~   ~   ~   .   ,   ,   ,   %   %   .   ;   ;   ,   ,   ,   $
      $   .   .   .   A   .   ,   .   ,   ,   ,   ~   ~   .   .   .   .   ,   .   .   .   .   .   .   .   $
