Actions:
  - Name: face
    InputMapping:
      Internal: true
      Inputs:
        2: {Description: Face down, VectorToDest: [0, 0], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: avatar}

  # Fire: every fire tries each neighbour every 3 ticks (one timer per direction).
  - Name: spread
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: West, VectorToDest: [-1, 0]}
        2: {Description: North, VectorToDest: [0, -1]}
        3: {Description: East, VectorToDest: [1, 0]}
        4: {Description: South, VectorToDest: [0, 1]}
    Behaviours:
      - Src: {Object: [fire, bridgefire, campfire]}
        Dst: {Object: [tree, oak, oakcut, bramble, logpile, bush], Commands: [{change_to: fire}]}
      - Src: {Object: [fire, bridgefire, campfire]}
        Dst: {Object: bridge, Commands: [{change_to: bridgefire}]}
      - Src: {Object: [fire, bridgefire, campfire], Commands: [{exec: {Action: spread, Delay: 3}}]}
        Dst: {Object: [grass, moss, dirt, sand, bones, mushroom, skull, water, rock, hedge, stone, tombstone, torch, stump, deep, campfire, fire, bridgefire, well, hen, avatar, _empty]}

  # A fire burns out 7 ticks after it was lit; a burning bridge collapses into the river.
  - Name: burnout
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Burn out, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: fire, Commands: [{remove: true}]}
        Dst: {Object: fire}
      - Src: {Object: bridgefire, Commands: [{change_to: water}]}
        Dst: {Object: bridgefire}

  # The lumberjack walks up / down / left / right (absolute).
  - Name: move
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}, {mov: _dest}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, stump]}
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}, {mov: _dest}, {reward: 5}]}
        Dst: {Object: hen, Commands: [{remove: true}]}
      - Src: {Object: avatar, Commands: [{remove: true}, {reward: -5}]}
        Dst: {Object: [fire, bridgefire, campfire]}
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, oak, oakcut, deep, bramble, well, logpile, avatar]}

  # Swing the axe at the cell in the given direction.
  - Name: chop
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src:
          Object: avatar
          Preconditions: [{lt: [src.logs, 3]}]
          Commands: [{set_tile: meta.facing}, {incr: logs}, {reward: 1}]
        Dst: {Object: [tree, oakcut], Commands: [{change_to: stump}]}
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: oak, Commands: [{change_to: oakcut}]}
      - Src:
          Object: avatar
          Preconditions: [{lt: [src.logs, 3]}]
          Commands: [{set_tile: meta.facing}, {incr: logs}]
        Dst: {Object: logpile, Commands: [{remove: true}]}
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: bush, Commands: [{remove: true}]}
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [grass, moss, dirt, sand, bones, mushroom, skull, bridge, water, rock, hedge, stone, tombstone, torch, stump, deep, bramble, campfire, fire, bridgefire, well, hen, avatar]}

  # Build with logs: a bridge over water (deep water takes 2 logs), or a log pile on open ground.
  - Name: build
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src:
          Object: avatar
          Preconditions: [{gte: [src.logs, 1]}]
          Commands: [{set_tile: meta.facing}, {decr: logs}, {reward: 1}]
        Dst: {Object: water, Commands: [{change_to: bridge}]}
      - Src:
          Object: avatar
          Preconditions: [{gte: [src.logs, 2]}]
          Commands: [{set_tile: meta.facing}, {sub: [logs, 2]}, {reward: 1}]
        Dst: {Object: deep, Commands: [{change_to: bridge}]}
      - Src:
          Object: avatar
          Preconditions: [{gte: [src.logs, 1]}]
          Commands: [{set_tile: meta.facing}, {decr: logs}, {spawn: logpile}]
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, stump]}
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [tree, bush, rock, hedge, stone, tombstone, torch, oak, oakcut, bramble, campfire, fire, bridgefire, well, hen, logpile, avatar]}

  # Fill the bucket at water or a well; pour it on a fire.
  - Name: bucket
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src:
          Object: avatar
          Preconditions: [{eq: [src.bucket, 0]}]
          Commands: [{set_tile: meta.facing}, {set: [bucket, 1]}]
        Dst: {Object: [water, deep, well]}
      - Src:
          Object: avatar
          Preconditions: [{eq: [src.bucket, 1]}]
          Commands: [{set_tile: meta.facing}, {set: [bucket, 0]}, {reward: 1}]
        Dst: {Object: [fire, campfire], Commands: [{remove: true}]}
      - Src:
          Object: avatar
          Preconditions: [{eq: [src.bucket, 1]}]
          Commands: [{set_tile: meta.facing}, {set: [bucket, 0]}, {reward: 1}]
        Dst: {Object: bridgefire, Commands: [{change_to: bridge}]}
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [grass, moss, dirt, sand, bones, mushroom, skull, bridge, tree, bush, rock, hedge, stone, tombstone, torch, stump, oak, oakcut, bramble, hen, logpile, avatar]}

Objects:
  - Name: grass
    MapCharacter: ","
    Z: 0
    Observers:
      Sprite2D: &grass_sprite
        - TilingMode: WALL_16
          Image:
            - gvgai/oryx/grass_0.png
            - gvgai/oryx/grass_1.png
            - gvgai/oryx/grass_2.png
            - gvgai/oryx/grass_3.png
            - gvgai/oryx/grass_4.png
            - gvgai/oryx/grass_5.png
            - gvgai/oryx/grass_6.png
            - gvgai/oryx/grass_7.png
