Version: "0.1"
Environment:
  Name: Timber and Tide
  Description: |
    A lumberjack must rescue the lost hens. Chop trees for logs (carry 3; old oaks take two chops),
    build log bridges over rivers (deep water takes 2 logs) or drop log piles on the ground, and
    carry water in a bucket. Fire spreads to trees, brambles, log piles and bridges every few
    ticks; brambles only burn. Walking into fire is fatal.
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Sprite2D   whole level (global observer)
  #   FollowCam  15x11 window that follows the avatar
  #   CloseUp    9x9 window that follows the avatar (also the agent's default view)
  Observers:
    Sprite2D:
      TileSize: 24
      BackgroundTile: gvgai/newset/floor6.png
      RotateAvatarImage: false
      TrackAvatar: false
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: gvgai/newset/floor6.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 15
      Height: 11
    CloseUp:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: gvgai/newset/floor6.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 9
      Height: 9
    Block2D:
      TileSize: 24
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: false
      Width: 9
      Height: 9
    AvatarObject: avatar
  Termination:
    Win:
      - eq: [hen:count, 0]
    Lose:
      - eq: [avatar:count, 0]
  Levels:
