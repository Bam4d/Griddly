Actions:
  - Name: face
    InputMapping:
      Internal: true
      Inputs:
        2: {Description: Face down, VectorToDest: [0, 0], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: avatar}

  # Spiders wander slowly, bats quickly (absolute random steps). Touching the hero kills it; walking
  # into a sword flash kills them. Anything else blocks them and they try again.
  - Name: spider_move
    InputMapping:
      Internal: true
    Behaviours:
      - Src: {Object: spider, Commands: [{mov: _dest}, {exec: {Action: spider_move, Delay: 5, Randomize: true}}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: spider, Commands: [{exec: {Action: spider_move, Delay: 5, Randomize: true}}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, wall, key, door, exit, nest, spider, bat]}
      - Src: {Object: spider}
        Dst: {Object: avatar, Commands: [{remove: true}, {reward: -1}]}
      - Src: {Object: spider, Commands: [{remove: true}]}
        Dst: {Object: attack_fire}

  - Name: bat_move
    InputMapping:
      Internal: true
    Behaviours:
      - Src: {Object: bat, Commands: [{mov: _dest}, {exec: {Action: bat_move, Delay: 2, Randomize: true}}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: bat, Commands: [{exec: {Action: bat_move, Delay: 2, Randomize: true}}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, wall, key, door, exit, nest, spider, bat]}
      - Src: {Object: bat}
        Dst: {Object: avatar, Commands: [{remove: true}, {reward: -1}]}
      - Src: {Object: bat, Commands: [{remove: true}]}
        Dst: {Object: attack_fire}

  # Nests hatch up to 3 spiders, one every ~60 ticks, into a free neighbouring cell.
  - Name: hatch
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: West, VectorToDest: [-1, 0]}
        2: {Description: North, VectorToDest: [0, -1]}
        3: {Description: East, VectorToDest: [1, 0]}
        4: {Description: South, VectorToDest: [0, 1]}
    Behaviours:
      - Src:
          Object: nest
          Preconditions: [{lt: [src.hatched, 3]}]
          Commands: [{spawn: spider}, {incr: hatched}, {exec: {Action: hatch, Delay: 60, Randomize: true}}]
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src:
          Object: nest
          Preconditions: [{lt: [src.hatched, 3]}]
          Commands: [{exec: {Action: hatch, Delay: 15, Randomize: true}}]
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, wall, key, door, exit, nest, spider, bat, avatar, attack_fire]}

  # The sword flash fades after a few ticks.
  - Name: fade
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Fade, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: attack_fire, Commands: [{remove: true}]}
        Dst: {Object: attack_fire}

  # The hero walks up / down / left / right (absolute; it never rotates).
  - Name: move
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}, {mov: _dest}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}, {mov: _dest}, {incr: keys}, {reward: 1}]}
        Dst: {Object: key, Commands: [{remove: true}]}
      - Src:
          Object: avatar
          Preconditions: [{gte: [src.keys, 1]}]
          Commands: [{set_tile: meta.facing}, {decr: keys}]
        Dst: {Object: door, Commands: [{remove: true}]}
      - Src:
          Object: avatar
          Preconditions: [{gte: [src.keys, 1]}]
          Commands: [{set_tile: meta.facing}, {decr: keys}, {reward: 5}]
        Dst: {Object: exit, Commands: [{remove: true}]}
      - Src: {Object: avatar, Commands: [{remove: true}, {reward: -1}]}
        Dst: {Object: [spider, bat]}
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, wall, nest, attack_fire]}

  # Swing the sword at the cell in the given direction (the UI sends the last move direction).
  - Name: attack
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}, {spawn: attack_fire}, {reward: 1}]}
        Dst: {Object: [spider, bat], Commands: [{remove: true}]}
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}, {spawn: attack_fire}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, wall, nest, key, door, exit, attack_fire]}

