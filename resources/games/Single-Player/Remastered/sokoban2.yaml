Actions:
  - Name: face
    InputMapping:
      Internal: true
      Inputs:
        2: {Description: Face down, VectorToDest: [0, 0], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: avatar}

  # Absolute 4-way movement. Walking into a crate pushes it. A crate pushed onto a target becomes a
  # placed crate; pushing a placed crate off its target turns it back into a plain crate. Crates only
  # slide over floor, ground decoration and targets; scenery blocks them.
  - Name: move
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}, {mov: _dest}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, target]}
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}, {mov: _dest}]}
        Dst: {Object: [box, box_in_place], Commands: [{cascade: _dest}]}
      - Src: {Object: avatar, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [wall, water, tree, bush, rock, hedge, stone, tombstone, torch]}
      - Src: {Object: box, Commands: [{mov: _dest}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: [box, box_in_place], Commands: [{mov: _dest}, {change_to: box_in_place}, {reward: 1}]}
        Dst: {Object: target}
      - Src: {Object: box_in_place, Commands: [{mov: _dest}, {change_to: box}, {reward: -1}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}

