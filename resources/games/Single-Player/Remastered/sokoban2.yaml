Version: "0.1"
Environment:
  Name: Sokoban II Remastered
  Description: |
    Push every crate onto a marked target. Placed crates light up, but they can still be pushed off
    again. A storeroom, an orchard, ice floes, catacombs and a hedge court - walls, water, hedges,
    trees, rocks and tombstones block crates; grass, sand, moss and dirt don't. Win when every crate
    is on a target.
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Sprite2D   whole level (global observer)
  #   FollowCam  15x11 window that follows the avatar
  #   CloseUp    9x9 window that follows the avatar (also the agent's default view)
  Observers:
    Sprite2D:
      TileSize: 24
      BackgroundTile: gvgai/newset/floor2.png
      RotateAvatarImage: false
      TrackAvatar: false
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: gvgai/newset/floor2.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 15
      Height: 11
    CloseUp:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: gvgai/newset/floor2.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 9
      Height: 9
    Block2D:
      TileSize: 24
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: false
      Width: 9
      Height: 9
    AvatarObject: avatar
  Termination:
    Win:
      - eq: [box:count, 0]
