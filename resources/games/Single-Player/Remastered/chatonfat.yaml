Version: "0.1"
Environment:
  Name: Le Chaton Fat
  Description: |
    Le chaton fat runs the datacenter. GPUs heat up over time (cool, warm, hot, ON FIRE) and fire
    spreads to neighbouring GPUs and server racks. Splash coolant on a GPU to cool it back down
    (or put out a fire); refill at a chiller. The cat is fat: she can only walk every other tick.
    Keep the GPUs alive until the training run reaches 100 %; lose if more GPUs die than you have
    spares.
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Sprite2D   whole level (global observer)
  #   FollowCam  15x11 window that follows the avatar
  #   CloseUp    9x9 window that follows the avatar (also the agent's default view)
  Observers:
    Sprite2D:
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      TrackAvatar: false
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 15
      Height: 11
    CloseUp:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 9
      Height: 9
    Block2D:
      TileSize: 24
  Variables:
    - Name: progress
      InitialValue: 0
    - Name: dead
      InitialValue: 0
    - Name: allow
      InitialValue: 0
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: false
      Width: 9
      Height: 9
    AvatarObject: cat
  Termination:
    Win:
      - gte: [progress, 100]
    Lose:
      - gt: [dead, allow]
  Levels:
