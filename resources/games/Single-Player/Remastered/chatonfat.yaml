Actions:
  - Name: face
    InputMapping:
      Internal: true
      Inputs:
        2: {Description: Face down, VectorToDest: [0, 0], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: cat, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: cat}

  # Heat: every GPU climbs cool -> warm -> hot -> fire on its own timer (started by InitialActions).
  - Name: heat
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Heat up, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: gpu_cool, Commands: [{change_to: gpu_warm}]}
        Dst: {Object: gpu_cool}
      - Src: {Object: gpu_warm, Commands: [{change_to: gpu_hot}]}
        Dst: {Object: gpu_warm}
      - Src: {Object: gpu_hot, Commands: [{change_to: gpu_fire}]}
        Dst: {Object: gpu_hot}

  # Fire: each burning GPU / rack tries every neighbour every 4 ticks (one timer per direction,
  # always re-armed, so the order of same-tick events never matters).
  - Name: spread
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: West, VectorToDest: [-1, 0]}
        2: {Description: North, VectorToDest: [0, -1]}
        3: {Description: East, VectorToDest: [1, 0]}
        4: {Description: South, VectorToDest: [0, 1]}
    Behaviours:
      - Src: {Object: [gpu_fire, rack_fire], Commands: [{exec: {Action: spread, Delay: 4}}]}
        Dst: {Object: [gpu_cool, gpu_warm, gpu_hot], Commands: [{change_to: gpu_fire}]}
      - Src: {Object: [gpu_fire, rack_fire], Commands: [{exec: {Action: spread, Delay: 4}}]}
        Dst: {Object: rack, Commands: [{change_to: rack_fire}]}
      - Src: {Object: [gpu_fire, rack_fire], Commands: [{exec: {Action: spread, Delay: 4}}]}
        Dst: {Object: [wall, gpu_fire, gpu_dead, rack_fire, rack_dead, chiller, spare, run1, run2, run3, cable, cat, _empty]}

  # A fire burns out 14 ticks (6 for a rack) after it started: the GPU is dead, the rack a charred shell.
  - Name: burnout
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Burn out, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: gpu_fire, Commands: [{incr: dead}, {change_to: gpu_dead}]}
        Dst: {Object: gpu_fire}
      - Src: {Object: rack_fire, Commands: [{change_to: rack_dead}]}
        Dst: {Object: rack_fire}

  # The training run: +1 % every 1 / 2 / 3 ticks depending on the logo variant.
  - Name: train
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Train, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: run1, Commands: [{incr: progress}, {exec: {Action: train, ActionId: 1, Delay: 1}}]}
        Dst: {Object: run1}
      - Src: {Object: run2, Commands: [{incr: progress}, {exec: {Action: train, ActionId: 1, Delay: 2}}]}
        Dst: {Object: run2}
      - Src: {Object: run3, Commands: [{incr: progress}, {exec: {Action: train, ActionId: 1, Delay: 3}}]}
        Dst: {Object: run3}

  # Every spare GPU in the storeroom lets you lose one GPU.
  - Name: count_spare
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Count, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: spare, Commands: [{incr: allow}]}
        Dst: {Object: spare}

  # Le chaton fat walks (at most every 2 ticks: she is fat), bumps a chiller to refill coolant.
  - Name: move
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src:
          Object: cat
          Preconditions: [{gte: [_steps, src.ready]}]
          Commands: [{set_tile: meta.facing}, {mov: _dest}, {set: [ready, _steps]}, {add: [ready, 2]}]
        Dst: {Object: [_empty, cable]}
      - Src:
          Object: cat
          Preconditions: [{lt: [_steps, src.ready]}]
          Commands: [{set_tile: meta.facing}]
        Dst: {Object: [_empty, cable]}
      - Src: {Object: cat, Commands: [{set_tile: meta.facing}, {set: [coolant, 6]}]}
        Dst: {Object: chiller}
      - Src: {Object: cat, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [wall, gpu_cool, gpu_warm, gpu_hot, gpu_fire, gpu_dead, rack, rack_fire, rack_dead, spare, run1, run2, run3, cat]}

  # Splash one coolant on the cell in the given direction.
  - Name: splash
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src:
          Object: cat
          Preconditions: [{gt: [src.coolant, 0]}]
          Commands: [{set_tile: meta.facing}, {decr: coolant}, {reward: 1}]
        Dst: {Object: [gpu_cool, gpu_warm, gpu_hot, gpu_fire], Commands: [{change_to: gpu_cool}]}
      - Src:
          Object: cat
          Preconditions: [{gt: [src.coolant, 0]}]
          Commands: [{set_tile: meta.facing}, {decr: coolant}, {reward: 1}]
        Dst: {Object: rack_fire, Commands: [{change_to: rack}]}
      - Src: {Object: cat, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [wall, gpu_dead, rack, rack_dead, chiller, spare, run1, run2, run3, cable, cat, _empty]}

  # Wait a tick (cats nap).
  - Name: nap
    InputMapping:
      Inputs:
        1: {Description: Nap, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: cat, Commands: [{nop: true}]}
        Dst: {Object: cat}
  - Name: gpu_fire_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 3}}
        3: {Description: frame 2, VectorToDest: [0, 0], MetaData: {tile: 2, next: 1}}
    Behaviours:
      - Src:
          Object: gpu_fire
          Commands:
            - set_tile: meta.tile
            - exec: {Action: gpu_fire_anim, ActionId: meta.next, Delay: 2}
        Dst: {Object: [gpu_fire]}
  - Name: rack_fire_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 3}}
        3: {Description: frame 2, VectorToDest: [0, 0], MetaData: {tile: 2, next: 1}}
    Behaviours:
      - Src:
          Object: rack_fire
          Commands:
            - set_tile: meta.tile
            - exec: {Action: rack_fire_anim, ActionId: meta.next, Delay: 2}
        Dst: {Object: [rack_fire]}
  - Name: rack_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 1}}
    Behaviours:
      - Src:
          Object: rack
          Commands:
            - set_tile: meta.tile
            - exec: {Action: rack_anim, ActionId: meta.next, Delay: 4}
        Dst: {Object: [rack]}
  - Name: run1_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 3}}
        3: {Description: frame 2, VectorToDest: [0, 0], MetaData: {tile: 2, next: 4}}
        4: {Description: frame 3, VectorToDest: [0, 0], MetaData: {tile: 3, next: 1}}
    Behaviours:
      - Src:
          Object: run1
          Commands:
            - set_tile: meta.tile
            - exec: {Action: run1_anim, ActionId: meta.next, Delay: 3}
        Dst: {Object: [run1]}
  - Name: run2_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 3}}
        3: {Description: frame 2, VectorToDest: [0, 0], MetaData: {tile: 2, next: 4}}
        4: {Description: frame 3, VectorToDest: [0, 0], MetaData: {tile: 3, next: 1}}
    Behaviours:
      - Src:
          Object: run2
          Commands:
            - set_tile: meta.tile
            - exec: {Action: run2_anim, ActionId: meta.next, Delay: 3}
        Dst: {Object: [run2]}
  - Name: run3_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 3}}
        3: {Description: frame 2, VectorToDest: [0, 0], MetaData: {tile: 2, next: 4}}
        4: {Description: frame 3, VectorToDest: [0, 0], MetaData: {tile: 3, next: 1}}
    Behaviours:
      - Src:
          Object: run3
          Commands:
            - set_tile: meta.tile
            - exec: {Action: run3_anim, ActionId: meta.next, Delay: 3}
        Dst: {Object: [run3]}

