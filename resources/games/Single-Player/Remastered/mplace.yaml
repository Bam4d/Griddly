Version: "0.1"
Environment:
  Name: m-place
  Description: |
    m/place: one mayo = one pixel. Walk onto a paint bucket to pick up its colour, then paint the
    pixel in front of you (Space) to match the ghost image on the canvas. Each pixel costs 1 mayo;
    mayo jars refill you. Troll bufos walk straight lanes and scribble over every pixel they step on:
    throw mayo at one (paint it) to ban it. Win when the canvas matches the ghost image; lose when
    your mayo (held + in jars) can't cover the pixels still wrong.
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Sprite2D   whole level (global observer)
  #   FollowCam  15x11 window that follows the avatar
  #   CloseUp    9x9 window that follows the avatar (also the agent's default view)
  Observers:
    Sprite2D:
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      TrackAvatar: false
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 15
      Height: 11
    CloseUp:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 9
      Height: 9
    Block2D:
      TileSize: 24
  Variables:
    - Name: mayo
      InitialValue: 0
    - Name: supply
      InitialValue: 0
    - Name: wrong
      InitialValue: 0
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: false
      Width: 9
      Height: 9
    AvatarObject: bufo
  Termination:
    Win:
      - eq: [wrong, 0]
    Lose:
      - lt: [supply, wrong]
  Levels:
    # Heart of the Office | Pick up red at the bucket, grab mayo, paint the ghost heart. 1 mayo = 1 pixel.
    - |
      w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w
      w   R   .   .   Q   Q   Q   .   .   .   L   .   .   .   .   P   w
