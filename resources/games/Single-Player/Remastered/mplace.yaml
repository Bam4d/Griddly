Actions:
  - Name: face
    InputMapping:
      Internal: true
      Inputs:
        2: {Description: Face down, VectorToDest: [0, 0], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: bufo}
  # Absolute 4-way walk. Buckets give their colour; jars give mayo.
  - Name: move
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}, {set: [fc, meta.facing]}, {set: [ft, fc]}, {add: [ft, tb]}, {set_tile: ft}, {mov: _dest}]}
        Dst: {Object: [_empty, blank, px_red, px_redorange, px_orange, px_amber, px_yellow, px_black, px_green, px_white]}
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}, {set: [fc, meta.facing]}, {set: [ft, fc]}, {add: [ft, tb]}, {set_tile: ft}, {mov: _dest}, {add: [mayo, 6]}, {reward: 1}]}
        Dst: {Object: jar, Commands: [{remove: true}]}
      - Src: {Object: bufo, Commands: [{set: [col, dst.col]}, {set: [tb, dst.tb]}, {set_tile: meta.facing}, {set: [fc, meta.facing]}, {set: [ft, fc]}, {add: [ft, tb]}, {set_tile: ft}, {mov: _dest}]}
        Dst: {Object: [bucket_red, bucket_redorange, bucket_orange, bucket_amber, bucket_yellow, bucket_black, bucket_green, bucket_white]}
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}, {set: [fc, meta.facing]}, {set: [ft, fc]}, {add: [ft, tb]}, {set_tile: ft}]}
        Dst: {Object: [wall, rack, logo, plant, troll_black_h, troll_black_v, troll_green_h, troll_green_v]}
  # Paint the pixel in front of you with your colour (1 mayo), or splat a troll with mayo (ban).
  - Name: paint
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src:
          Object: bufo
          Preconditions: [{gte: [mayo, 1]}]
          Commands: [{set_tile: meta.facing}, {set: [fc, meta.facing]}, {set: [ft, fc]}, {add: [ft, tb]}, {set_tile: ft}, {decr: mayo}, {decr: supply}, {reward: 2}]
        Dst: {Object: [troll_black_h, troll_black_v, troll_green_h, troll_green_v], Commands: [{remove: true}]}
      - Src:
          Object: bufo
          Preconditions: [{gte: [mayo, 1]}, {gte: [src.col, 1]}, {neq: [src.col, dst.paint]}]
          Commands: [{set_tile: meta.facing}, {set: [fc, meta.facing]}, {set: [ft, fc]}, {add: [ft, tb]}, {set_tile: ft}, {decr: mayo}, {decr: supply}, {if: {Conditions: {eq: [dst.paint, dst.tgt]}, OnTrue: [{reward: 1}]}}]
        Dst: {Object: [px_red, px_redorange, px_orange, px_amber, px_yellow, px_black, px_green, px_white], Commands: [{if: {Conditions: {eq: [paint, tgt]}, OnTrue: [{incr: wrong}]}}, {set: [paint, src.col]}, {if: {Conditions: {eq: [paint, tgt]}, OnTrue: [{decr: wrong}]}}, {set_tile: paint}]}
  # Trolls walk a straight lane every few ticks, turn back at anything solid (you included) and
  # paint every canvas pixel they step on in their own colour.
  - Name: troll
    InputMapping:
      Internal: true
      Inputs:
        1: {VectorToDest: [-1, 0], MetaData: {d: 1}}
        2: {VectorToDest: [0, -1], MetaData: {d: 2}}
        3: {VectorToDest: [1, 0], MetaData: {d: 3}}
        4: {VectorToDest: [0, 1], MetaData: {d: 4}}
    Behaviours:
      - Src: {Object: [troll_black_h, troll_black_v, troll_green_h, troll_green_v], Commands: [{set: [dir, meta.d]}, {mov: _dest}, {exec: {Action: troll, ActionId: dir, Delay: 2}}]}
        Dst: {Object: [_empty, blank]}
      - Src: {Object: [troll_black_h, troll_black_v, troll_green_h, troll_green_v], Commands: [{set: [dir, meta.d]}, {mov: _dest}, {exec: {Action: troll, ActionId: dir, Delay: 2}}]}
        Dst: {Object: [px_red, px_redorange, px_orange, px_amber, px_yellow, px_black, px_green, px_white], Commands: [{if: {Conditions: {eq: [paint, tgt]}, OnTrue: [{incr: wrong}]}}, {set: [paint, src.col]}, {if: {Conditions: {eq: [paint, tgt]}, OnTrue: [{decr: wrong}]}}, {set_tile: paint}]}
      - Src: {Object: [troll_black_h, troll_black_v, troll_green_h, troll_green_v], Commands: [{set: [dir, meta.d]}, {set: [nd, 0]}, {if: {Conditions: {eq: [dir, 1]}, OnTrue: [{set: [nd, 3]}]}}, {if: {Conditions: {eq: [dir, 2]}, OnTrue: [{set: [nd, 4]}]}}, {if: {Conditions: {eq: [dir, 3]}, OnTrue: [{set: [nd, 1]}]}}, {if: {Conditions: {eq: [dir, 4]}, OnTrue: [{set: [nd, 2]}]}}, {set: [dir, nd]}, {exec: {Action: troll, ActionId: dir, Delay: 2}}]}
        Dst: {Object: [_boundary, wall, rack, logo, plant, jar, bufo, bucket_red, bucket_redorange, bucket_orange, bucket_amber, bucket_yellow, bucket_black, bucket_green, bucket_white, troll_black_h, troll_black_v, troll_green_h, troll_green_v]}
  - Name: count_wrong
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: count, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: [px_red, px_redorange, px_orange, px_amber, px_yellow, px_black, px_green, px_white], Commands: [{incr: wrong}]}
        Dst: {Object: [px_red, px_redorange, px_orange, px_amber, px_yellow, px_black, px_green, px_white]}
  - Name: count_jar
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: count, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: jar, Commands: [{add: [supply, 6]}]}
        Dst: {Object: jar}
  - Name: rack_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 1, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 2, next: 1}}
    Behaviours:
      - Src:
          Object: rack
          Commands:
            - set_tile: meta.tile
            - exec: {Action: rack_anim, ActionId: meta.next, Delay: 3}
        Dst: {Object: [rack]}
  - Name: logo_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 3}}
        3: {Description: frame 2, VectorToDest: [0, 0], MetaData: {tile: 2, next: 4}}
        4: {Description: frame 3, VectorToDest: [0, 0], MetaData: {tile: 3, next: 1}}
    Behaviours:
      - Src:
          Object: logo
          Commands:
            - set_tile: meta.tile
            - exec: {Action: logo_anim, ActionId: meta.next, Delay: 2}
        Dst: {Object: [logo]}
  - Name: jar_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 1}}
    Behaviours:
      - Src:
          Object: jar
          Commands:
            - set_tile: meta.tile
            - exec: {Action: jar_anim, ActionId: meta.next, Delay: 4}
        Dst: {Object: [jar]}

