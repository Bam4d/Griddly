Version: "0.1"
Environment:
  Name: Bufos GPU Heist
  Description: |
    Stealth in a Mistral datacenter. Bufo sneaks between the server racks stealing GPUs: walk into a
    blinking rack to grab its GPU (carry up to 2), walk into the bufo burrow to deliver. Deliver every
    GPU to win. Sysadmin cats patrol the taped routes and see 3 tiles ahead - if one sees you, you're
    caught. Security cats (caps) see 4 tiles and, when they spot you, chase you with A* for 12 ticks
    before walking back to their cat bed. Cable bundles hide you and cats can't follow you in.
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Sprite2D   whole level (global observer)
  #   FollowCam  17x11 window that follows the avatar
  #   CloseUp    9x9 window that follows the avatar (also the agent's default view)
  Observers:
    Sprite2D:
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      TrackAvatar: false
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 17
      Height: 11
    CloseUp:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 9
      Height: 9
    Block2D:
      TileSize: 24
  Variables:
    - Name: need
      InitialValue: 0
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: false
      Width: 9
      Height: 9
    AvatarObject: bufo
  Termination:
    Win:
      - eq: [need, 0]
    Lose:
      - eq: [bufo:count, 0]
