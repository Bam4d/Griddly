Actions:
  - Name: face
    InputMapping:
      Internal: true
      Inputs:
        2: {Description: Face down, VectorToDest: [0, 0], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: bufo}

  # Stand still for one tick (Space).
  - Name: wait
    InputMapping:
      Inputs:
        1: {Description: Wait, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: bufo, Commands: [{nop: []}]}
        Dst: {Object: bufo}

  # Bufo: absolute 4-way move. Walk into a blinking rack to steal its GPU (max 2), into the burrow to
  # deliver. Render tiles 0..3 = facing, 4..7 = facing while carrying.
  - Name: move
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3, gfacing: 7}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0, gfacing: 4}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1, gfacing: 5}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2, gfacing: 6}}
    Behaviours:
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}, {if: {Conditions: {gt: [carry, 0]}, OnTrue: [{set_tile: meta.gfacing}]}}, {mov: _dest}, {set: [hidden, 0]}]}
        Dst: {Object: [_empty, tape, mark_l, mark_u, mark_r, mark_d, logo_floor, vent, bed1, bed2, bed3]}
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}, {if: {Conditions: {gt: [carry, 0]}, OnTrue: [{set_tile: meta.gfacing}]}}, {mov: _dest}, {set: [hidden, 1]}]}
        Dst: {Object: cable}
      - Src: {Object: bufo, Preconditions: [{lt: [src.carry, 2]}], Commands: [{incr: carry}, {set_tile: meta.gfacing}, {reward: 1}]}
        Dst: {Object: rack_gpu, Commands: [{change_to: rack_empty}]}
      - Src: {Object: bufo, Preconditions: [{gte: [src.carry, 2]}], Commands: [{set_tile: meta.facing}, {if: {Conditions: {gt: [carry, 0]}, OnTrue: [{set_tile: meta.gfacing}]}}]}
        Dst: {Object: rack_gpu}
      - Src: {Object: bufo, Preconditions: [{gt: [src.carry, 0]}], Commands: [{sub: [need, carry]}, {reward: 3}, {set: [carry, 0]}, {set_tile: meta.facing}]}
        Dst: {Object: burrow}
      - Src: {Object: bufo, Preconditions: [{eq: [src.carry, 0]}], Commands: [{set_tile: meta.facing}]}
        Dst: {Object: burrow}
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}, {if: {Conditions: {gt: [carry, 0]}, OnTrue: [{set_tile: meta.gfacing}]}}]}
        Dst: {Object: [wall, rack, rack_empty, coolant, plant, logo_sign]}
      - Src: {Object: bufo, Commands: [{remove: true}]}
        Dst: {Object: [cat, hcat1, hcat2, hcat3]}

  # Every GPU rack adds itself to `need` when the level starts.
  - Name: count_gpu
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Count, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: rack_gpu, Commands: [{incr: need}, {exec: {Action: rack_gpu_anim, ActionId: 1}}]}
        Dst: {Object: rack_gpu}

  # Cats start from their level orientation (C[R]): dir = 1 left, 2 up, 3 right, 4 down.
  - Name: cat_init
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Init, VectorToDest: [0, 0]}
    Behaviours:
      - Src:
          Object: [cat, hcat1, hcat2, hcat3]
          Commands:
            - if: {Conditions: {eq: [_dx, -1]}, OnTrue: [{set: [dir, 1]}]}
            - if: {Conditions: {eq: [_dy, -1]}, OnTrue: [{set: [dir, 2]}]}
            - if: {Conditions: {eq: [_dx, 1]}, OnTrue: [{set: [dir, 3]}]}
            - if: {Conditions: {eq: [_dy, 1]}, OnTrue: [{set: [dir, 4]}]}
            - exec: {Action: retile, ActionId: 1}
            - exec: {Action: patrol, ActionId: 1, Delay: 1}
        Dst: {Object: [cat, hcat1, hcat2, hcat3]}

  - Name: retile
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Retile, VectorToDest: [0, 0]}
    Behaviours:
      - Src:
          Object: [cat, hcat1, hcat2, hcat3]
          Commands:
            - if: {Conditions: {eq: [dir, 1]}, OnTrue: [{set_tile: 3}]}
            - if: {Conditions: {eq: [dir, 2]}, OnTrue: [{set_tile: 0}]}
            - if: {Conditions: {eq: [dir, 3]}, OnTrue: [{set_tile: 1}]}
            - if: {Conditions: {eq: [dir, 4]}, OnTrue: [{set_tile: 2}]}
        Dst: {Object: [cat, hcat1, hcat2, hcat3]}

  # Cat brain, every tick. Sysadmin: step every 2nd tick, look 3 ahead (seeing bufo = caught).
  # Security cats: mode 0 patrol / 1 chase bufo with A* every tick (alert countdown) / 2 walk home (A*).
  - Name: patrol
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Think, VectorToDest: [0, 0]}
    Behaviours:
      - Src:
          Object: cat
          Commands:
            - {if: {Conditions: {eq: [mv, 1]}, OnTrue: [{set: [mv, 0]}, {exec: {Action: gstep, ActionId: dir}}], OnFalse: [{set: [mv, 1]}]}}
            - set: [clear, 1]
            - exec: {Action: look1, ActionId: dir}
            - if: {Conditions: {eq: [clear, 1]}, OnTrue: [{exec: {Action: look2, ActionId: dir}}]}
            - if: {Conditions: {eq: [clear, 1]}, OnTrue: [{exec: {Action: look3, ActionId: dir}}]}
            - exec: {Action: patrol, ActionId: 1, Delay: 1}
        Dst: {Object: cat}
      - Src:
          Object: hcat1
          Commands:
            - if: {Conditions: {eq: [mode, 0]}, OnTrue: [{if: {Conditions: {eq: [mv, 1]}, OnTrue: [{set: [mv, 0]}, {exec: {Action: gstep, ActionId: dir}}], OnFalse: [{set: [mv, 1]}]}}]}
            - if:
                Conditions: {eq: [mode, 2]}
                OnTrue:
                  - if: {Conditions: {eq: [mv, 1]}, OnTrue: [{set: [mv, 0]}, {exec: {Action: hstep, Search: {TargetObjectName: bed1, ImpassableObjects: [wall, rack, rack_gpu, rack_empty, burrow, coolant, plant, logo_sign, cable, cat, hcat2, hcat3]}}}], OnFalse: [{set: [mv, 1]}]}
            - if:
                Conditions: {eq: [mode, 1]}
                OnTrue:
                  - decr: alert
                  - exec: {Action: hstep, Search: {TargetObjectName: bufo, ImpassableObjects: [wall, rack, rack_gpu, rack_empty, burrow, coolant, plant, logo_sign, cable, cat, hcat2, hcat3]}}
                  - if: {Conditions: {lte: [alert, 0]}, OnTrue: [{set: [mode, 2]}, {set: [mv, 0]}]}
            - set: [clear, 1]
            - exec: {Action: look1, ActionId: dir}
            - if: {Conditions: {eq: [clear, 1]}, OnTrue: [{exec: {Action: look2, ActionId: dir}}]}
            - if: {Conditions: {eq: [clear, 1]}, OnTrue: [{exec: {Action: look3, ActionId: dir}}]}
            - if: {Conditions: {eq: [clear, 1]}, OnTrue: [{exec: {Action: look4, ActionId: dir}}]}
            - exec: {Action: patrol, ActionId: 1, Delay: 1}
        Dst: {Object: hcat1}
      - Src:
          Object: hcat2
          Commands:
            - if: {Conditions: {eq: [mode, 0]}, OnTrue: [{if: {Conditions: {eq: [mv, 1]}, OnTrue: [{set: [mv, 0]}, {exec: {Action: gstep, ActionId: dir}}], OnFalse: [{set: [mv, 1]}]}}]}
            - if:
                Conditions: {eq: [mode, 2]}
                OnTrue:
                  - if: {Conditions: {eq: [mv, 1]}, OnTrue: [{set: [mv, 0]}, {exec: {Action: hstep, Search: {TargetObjectName: bed2, ImpassableObjects: [wall, rack, rack_gpu, rack_empty, burrow, coolant, plant, logo_sign, cable, cat, hcat1, hcat3]}}}], OnFalse: [{set: [mv, 1]}]}
            - if:
                Conditions: {eq: [mode, 1]}
                OnTrue:
                  - decr: alert
                  - exec: {Action: hstep, Search: {TargetObjectName: bufo, ImpassableObjects: [wall, rack, rack_gpu, rack_empty, burrow, coolant, plant, logo_sign, cable, cat, hcat1, hcat3]}}
                  - if: {Conditions: {lte: [alert, 0]}, OnTrue: [{set: [mode, 2]}, {set: [mv, 0]}]}
            - set: [clear, 1]
            - exec: {Action: look1, ActionId: dir}
            - if: {Conditions: {eq: [clear, 1]}, OnTrue: [{exec: {Action: look2, ActionId: dir}}]}
            - if: {Conditions: {eq: [clear, 1]}, OnTrue: [{exec: {Action: look3, ActionId: dir}}]}
            - if: {Conditions: {eq: [clear, 1]}, OnTrue: [{exec: {Action: look4, ActionId: dir}}]}
            - exec: {Action: patrol, ActionId: 1, Delay: 1}
        Dst: {Object: hcat2}
      - Src:
          Object: hcat3
          Commands:
            - if: {Conditions: {eq: [mode, 0]}, OnTrue: [{if: {Conditions: {eq: [mv, 1]}, OnTrue: [{set: [mv, 0]}, {exec: {Action: gstep, ActionId: dir}}], OnFalse: [{set: [mv, 1]}]}}]}
            - if:
                Conditions: {eq: [mode, 2]}
                OnTrue:
                  - if: {Conditions: {eq: [mv, 1]}, OnTrue: [{set: [mv, 0]}, {exec: {Action: hstep, Search: {TargetObjectName: bed3, ImpassableObjects: [wall, rack, rack_gpu, rack_empty, burrow, coolant, plant, logo_sign, cable, cat, hcat1, hcat2]}}}], OnFalse: [{set: [mv, 1]}]}
            - if:
                Conditions: {eq: [mode, 1]}
                OnTrue:
                  - decr: alert
                  - exec: {Action: hstep, Search: {TargetObjectName: bufo, ImpassableObjects: [wall, rack, rack_gpu, rack_empty, burrow, coolant, plant, logo_sign, cable, cat, hcat1, hcat2]}}
                  - if: {Conditions: {lte: [alert, 0]}, OnTrue: [{set: [mode, 2]}, {set: [mv, 0]}]}
            - set: [clear, 1]
            - exec: {Action: look1, ActionId: dir}
            - if: {Conditions: {eq: [clear, 1]}, OnTrue: [{exec: {Action: look2, ActionId: dir}}]}
            - if: {Conditions: {eq: [clear, 1]}, OnTrue: [{exec: {Action: look3, ActionId: dir}}]}
            - if: {Conditions: {eq: [clear, 1]}, OnTrue: [{exec: {Action: look4, ActionId: dir}}]}
            - exec: {Action: patrol, ActionId: 1, Delay: 1}
        Dst: {Object: hcat3}

  # One patrol step along the tape; chevrons turn the cat, beds point it along its route.
  - Name: gstep
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {d: 1, tile: 3, atile: 7}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {d: 2, tile: 0, atile: 4}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {d: 3, tile: 1, atile: 5}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {d: 4, tile: 2, atile: 6}}
    Behaviours:
      - Src: {Object: [cat, hcat1, hcat2, hcat3], Commands: [{mov: _dest}]}
        Dst: {Object: [_empty, tape, logo_floor, vent]}
      - Src: {Object: [cat, hcat1, hcat2, hcat3], Commands: [{mov: _dest}, {set: [dir, 1]}, {set_tile: 3}]}
        Dst: {Object: mark_l}
      - Src: {Object: [cat, hcat1, hcat2, hcat3], Commands: [{mov: _dest}, {set: [dir, 2]}, {set_tile: 0}]}
        Dst: {Object: mark_u}
      - Src: {Object: [cat, hcat1, hcat2, hcat3], Commands: [{mov: _dest}, {set: [dir, 3]}, {set_tile: 1}]}
        Dst: {Object: mark_r}
      - Src: {Object: [cat, hcat1, hcat2, hcat3], Commands: [{mov: _dest}, {set: [dir, 4]}, {set_tile: 2}]}
        Dst: {Object: mark_d}
      - Src: {Object: [cat, hcat1, hcat2, hcat3], Commands: [{mov: _dest}, {set: [dir, 3]}, {set_tile: 1}]}
        Dst: {Object: bed1}
      - Src: {Object: [cat, hcat1, hcat2, hcat3], Commands: [{mov: _dest}, {set: [dir, 3]}, {set_tile: 1}]}
        Dst: {Object: bed2}
      - Src: {Object: [cat, hcat1, hcat2, hcat3], Commands: [{mov: _dest}, {set: [dir, 3]}, {set_tile: 1}]}
        Dst: {Object: bed3}
      - Src: {Object: [cat, hcat1, hcat2, hcat3], Commands: [{nop: []}]}
        Dst: {Object: bufo, Commands: [{remove: true}]}

  # A security cat's A* step (chasing bufo or heading home); bufo hiding in cables can't be caught.
  - Name: hstep
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {d: 1, tile: 3, atile: 7}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {d: 2, tile: 0, atile: 4}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {d: 3, tile: 1, atile: 5}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {d: 4, tile: 2, atile: 6}}
    Behaviours:
      - Src:
          Object: hcat1
          Commands:
            - mov: _dest
            - set: [dir, meta.d]
            - set_tile: meta.tile
            - if: {Conditions: {eq: [mode, 1]}, OnTrue: [{set_tile: meta.atile}]}
        Dst: {Object: [_empty, tape, mark_l, mark_u, mark_r, mark_d, logo_floor, vent, bed2, bed3]}
      - Src:
          Object: hcat1
          Commands:
            - mov: _dest
            - set: [dir, meta.d]
            - set_tile: meta.tile
            - if: {Conditions: {eq: [mode, 1]}, OnTrue: [{set_tile: meta.atile}]}
            - if: {Conditions: {eq: [mode, 2]}, OnTrue: [{set: [mode, 0]}, {set: [mv, 0]}, {set: [dir, 3]}, {set_tile: 1}]}
        Dst: {Object: bed1}
      - Src: {Object: hcat1, Preconditions: [{eq: [dst.hidden, 0]}], Commands: [{set: [dir, meta.d]}]}
        Dst: {Object: bufo, Commands: [{remove: true}]}
      - Src:
          Object: hcat2
          Commands:
            - mov: _dest
            - set: [dir, meta.d]
            - set_tile: meta.tile
            - if: {Conditions: {eq: [mode, 1]}, OnTrue: [{set_tile: meta.atile}]}
        Dst: {Object: [_empty, tape, mark_l, mark_u, mark_r, mark_d, logo_floor, vent, bed1, bed3]}
      - Src:
          Object: hcat2
          Commands:
            - mov: _dest
            - set: [dir, meta.d]
            - set_tile: meta.tile
            - if: {Conditions: {eq: [mode, 1]}, OnTrue: [{set_tile: meta.atile}]}
            - if: {Conditions: {eq: [mode, 2]}, OnTrue: [{set: [mode, 0]}, {set: [mv, 0]}, {set: [dir, 3]}, {set_tile: 1}]}
        Dst: {Object: bed2}
      - Src: {Object: hcat2, Preconditions: [{eq: [dst.hidden, 0]}], Commands: [{set: [dir, meta.d]}]}
        Dst: {Object: bufo, Commands: [{remove: true}]}
      - Src:
          Object: hcat3
          Commands:
            - mov: _dest
            - set: [dir, meta.d]
            - set_tile: meta.tile
            - if: {Conditions: {eq: [mode, 1]}, OnTrue: [{set_tile: meta.atile}]}
        Dst: {Object: [_empty, tape, mark_l, mark_u, mark_r, mark_d, logo_floor, vent, bed1, bed2]}
      - Src:
          Object: hcat3
          Commands:
            - mov: _dest
            - set: [dir, meta.d]
            - set_tile: meta.tile
            - if: {Conditions: {eq: [mode, 1]}, OnTrue: [{set_tile: meta.atile}]}
            - if: {Conditions: {eq: [mode, 2]}, OnTrue: [{set: [mode, 0]}, {set: [mv, 0]}, {set: [dir, 3]}, {set_tile: 1}]}
        Dst: {Object: bed3}
      - Src: {Object: hcat3, Preconditions: [{eq: [dst.hidden, 0]}], Commands: [{set: [dir, meta.d]}]}
        Dst: {Object: bufo, Commands: [{remove: true}]}

  - Name: look1
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {d: 1, tile: 3, atile: 7}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {d: 2, tile: 0, atile: 4}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {d: 3, tile: 1, atile: 5}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {d: 4, tile: 2, atile: 6}}
    Behaviours:
      - Src: {Object: [cat, hcat1, hcat2, hcat3], Commands: [{set: [clear, 0]}]}
        Dst: {Object: [wall, rack, rack_gpu, rack_empty, burrow, coolant, plant, logo_sign, cat, hcat1, hcat2, hcat3]}
      - Src: {Object: cat, Preconditions: [{eq: [dst.hidden, 0]}], Commands: [{set: [clear, 0]}]}
        Dst: {Object: bufo, Commands: [{remove: true}]}
      - Src: {Object: hcat1, Preconditions: [{eq: [dst.hidden, 0]}], Commands: [{set: [clear, 0]}, {set: [mode, 1]}, {set: [alert, 12]}, {set: [mv, 0]}]}
        Dst: {Object: bufo}
      - Src: {Object: hcat2, Preconditions: [{eq: [dst.hidden, 0]}], Commands: [{set: [clear, 0]}, {set: [mode, 1]}, {set: [alert, 12]}, {set: [mv, 0]}]}
        Dst: {Object: bufo}
      - Src: {Object: hcat3, Preconditions: [{eq: [dst.hidden, 0]}], Commands: [{set: [clear, 0]}, {set: [mode, 1]}, {set: [alert, 12]}, {set: [mv, 0]}]}
        Dst: {Object: bufo}
  - Name: look2
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Left, VectorToDest: [-2, 0], MetaData: {d: 1, tile: 3, atile: 7}}
        2: {Description: Up, VectorToDest: [0, -2], MetaData: {d: 2, tile: 0, atile: 4}}
        3: {Description: Right, VectorToDest: [2, 0], MetaData: {d: 3, tile: 1, atile: 5}}
        4: {Description: Down, VectorToDest: [0, 2], MetaData: {d: 4, tile: 2, atile: 6}}
    Behaviours:
      - Src: {Object: [cat, hcat1, hcat2, hcat3], Commands: [{set: [clear, 0]}]}
        Dst: {Object: [wall, rack, rack_gpu, rack_empty, burrow, coolant, plant, logo_sign, cat, hcat1, hcat2, hcat3]}
      - Src: {Object: cat, Preconditions: [{eq: [dst.hidden, 0]}], Commands: [{set: [clear, 0]}]}
        Dst: {Object: bufo, Commands: [{remove: true}]}
      - Src: {Object: hcat1, Preconditions: [{eq: [dst.hidden, 0]}], Commands: [{set: [clear, 0]}, {set: [mode, 1]}, {set: [alert, 12]}, {set: [mv, 0]}]}
        Dst: {Object: bufo}
      - Src: {Object: hcat2, Preconditions: [{eq: [dst.hidden, 0]}], Commands: [{set: [clear, 0]}, {set: [mode, 1]}, {set: [alert, 12]}, {set: [mv, 0]}]}
        Dst: {Object: bufo}
      - Src: {Object: hcat3, Preconditions: [{eq: [dst.hidden, 0]}], Commands: [{set: [clear, 0]}, {set: [mode, 1]}, {set: [alert, 12]}, {set: [mv, 0]}]}
        Dst: {Object: bufo}
  - Name: look3
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Left, VectorToDest: [-3, 0], MetaData: {d: 1, tile: 3, atile: 7}}
        2: {Description: Up, VectorToDest: [0, -3], MetaData: {d: 2, tile: 0, atile: 4}}
        3: {Description: Right, VectorToDest: [3, 0], MetaData: {d: 3, tile: 1, atile: 5}}
        4: {Description: Down, VectorToDest: [0, 3], MetaData: {d: 4, tile: 2, atile: 6}}
    Behaviours:
      - Src: {Object: [cat, hcat1, hcat2, hcat3], Commands: [{set: [clear, 0]}]}
        Dst: {Object: [wall, rack, rack_gpu, rack_empty, burrow, coolant, plant, logo_sign, cat, hcat1, hcat2, hcat3]}
      - Src: {Object: cat, Preconditions: [{eq: [dst.hidden, 0]}], Commands: [{set: [clear, 0]}]}
        Dst: {Object: bufo, Commands: [{remove: true}]}
      - Src: {Object: hcat1, Preconditions: [{eq: [dst.hidden, 0]}], Commands: [{set: [clear, 0]}, {set: [mode, 1]}, {set: [alert, 12]}, {set: [mv, 0]}]}
        Dst: {Object: bufo}
      - Src: {Object: hcat2, Preconditions: [{eq: [dst.hidden, 0]}], Commands: [{set: [clear, 0]}, {set: [mode, 1]}, {set: [alert, 12]}, {set: [mv, 0]}]}
        Dst: {Object: bufo}
      - Src: {Object: hcat3, Preconditions: [{eq: [dst.hidden, 0]}], Commands: [{set: [clear, 0]}, {set: [mode, 1]}, {set: [alert, 12]}, {set: [mv, 0]}]}
        Dst: {Object: bufo}
  - Name: look4
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Left, VectorToDest: [-4, 0], MetaData: {d: 1, tile: 3, atile: 7}}
        2: {Description: Up, VectorToDest: [0, -4], MetaData: {d: 2, tile: 0, atile: 4}}
        3: {Description: Right, VectorToDest: [4, 0], MetaData: {d: 3, tile: 1, atile: 5}}
        4: {Description: Down, VectorToDest: [0, 4], MetaData: {d: 4, tile: 2, atile: 6}}
    Behaviours:
      - Src: {Object: [cat, hcat1, hcat2, hcat3], Commands: [{set: [clear, 0]}]}
        Dst: {Object: [wall, rack, rack_gpu, rack_empty, burrow, coolant, plant, logo_sign, cat, hcat1, hcat2, hcat3]}
      - Src: {Object: cat, Preconditions: [{eq: [dst.hidden, 0]}], Commands: [{set: [clear, 0]}]}
        Dst: {Object: bufo, Commands: [{remove: true}]}
      - Src: {Object: hcat1, Preconditions: [{eq: [dst.hidden, 0]}], Commands: [{set: [clear, 0]}, {set: [mode, 1]}, {set: [alert, 12]}, {set: [mv, 0]}]}
        Dst: {Object: bufo}
      - Src: {Object: hcat2, Preconditions: [{eq: [dst.hidden, 0]}], Commands: [{set: [clear, 0]}, {set: [mode, 1]}, {set: [alert, 12]}, {set: [mv, 0]}]}
        Dst: {Object: bufo}
      - Src: {Object: hcat3, Preconditions: [{eq: [dst.hidden, 0]}], Commands: [{set: [clear, 0]}, {set: [mode, 1]}, {set: [alert, 12]}, {set: [mv, 0]}]}
        Dst: {Object: bufo}
  - Name: logo_sign_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 3}}
        3: {Description: frame 2, VectorToDest: [0, 0], MetaData: {tile: 2, next: 4}}
        4: {Description: frame 3, VectorToDest: [0, 0], MetaData: {tile: 3, next: 1}}
    Behaviours:
      - Src:
          Object: logo_sign
          Commands:
            - set_tile: meta.tile
            - exec: {Action: logo_sign_anim, ActionId: meta.next, Delay: 3}
        Dst: {Object: [logo_sign]}
  - Name: rack_gpu_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 1}}
    Behaviours:
      - Src:
          Object: rack_gpu
          Commands:
            - set_tile: meta.tile
            - exec: {Action: rack_gpu_anim, ActionId: meta.next, Delay: 3}
        Dst: {Object: [rack_gpu]}

