Version: "0.1"
Environment:
  Name: Night Garden
  Description: |
    Sneak through a hedge garden at night, seen over your shoulder (egocentric, rotating view).
    Collect every lantern and slip out through the gate. Guards patrol fixed routes and see 3 tiles
    straight ahead; tall grass hides you.
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Sprite2D   whole level (global observer); oriented objects are drawn rotated
  #   EgoView    9x9 first-person window: follows AND rotates with the avatar (forward = up), avatar 2 rows below centre
  #   EgoClose   7x7 first-person window
  #   FollowCam  15x11 window that follows the avatar without rotating
  # The agent's default observation (Player.Observer) is the 9x9 egocentric window.
  Observers:
    Sprite2D:
      TileSize: 24
      BackgroundTile: gvgai/oryx/floor3.png
      RotateAvatarImage: true
      TrackAvatar: false
    EgoView:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: gvgai/oryx/floor3.png
      TrackAvatar: true
      RotateWithAvatar: true
      RotateAvatarImage: true
      Width: 9
      Height: 9
      OffsetY: 2
    EgoClose:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: gvgai/oryx/floor3.png
      TrackAvatar: true
      RotateWithAvatar: true
      RotateAvatarImage: true
      Width: 7
      Height: 7
      OffsetY: 0
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: gvgai/oryx/floor3.png
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: true
      Width: 15
      Height: 11
      OffsetY: 0
    Block2D:
      TileSize: 24
  Variables:
    - Name: ax
      InitialValue: 0
    - Name: ay
      InitialValue: 0
    - Name: adx
      InitialValue: 0
    - Name: ady
      InitialValue: 0
    - Name: need
      InitialValue: 0
    - Name: escaped
      InitialValue: 0
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: true
      RotateAvatarImage: true
      Width: 9
      Height: 9
      OffsetY: 2
    AvatarObject: avatar
  Termination:
    Win:
      - eq: [escaped, 1]
    Lose:
      - eq: [avatar:count, 0]
