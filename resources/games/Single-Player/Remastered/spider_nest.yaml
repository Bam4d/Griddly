Actions:
  - Name: face
    InputMapping:
      Internal: true
      Inputs:
        2: {Description: Face down, VectorToDest: [0, 0], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: gnome, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: gnome}

  # Spiders wander (rotate or step forwards at random), burn up in lava and kill the gnome.
  - Name: random_movement
    InputMapping:
      Inputs:
        1: {Description: Rotate left, OrientationVector: [-1, 0]}
        2: {Description: Move forwards, OrientationVector: [0, -1], VectorToDest: [0, -1]}
        3: {Description: Rotate right, OrientationVector: [1, 0]}
      Relative: true
      Internal: true
    Behaviours:
      - Src: {Object: spider, Commands: [{rot: _dir}, {exec: {Action: random_movement, Delay: 3, Randomize: true}}]}
        Dst: {Object: spider}
      - Src: {Object: spider, Commands: [{mov: _dest}, {exec: {Action: random_movement, Delay: 3, Randomize: true}}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: spider, Commands: [{exec: {Action: random_movement, Delay: 3, Randomize: true}}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, wall, gem, nest, brood, hunter]}
      - Src: {Object: spider, Commands: [{remove: true}]}
        Dst: {Object: lava}
      - Src: {Object: spider}
        Dst: {Object: gnome, Commands: [{remove: true}, {reward: -1}]}

  # Nests hatch up to 3 spiders each into a free neighbouring cell.
  - Name: spawn_spider
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: West, VectorToDest: [-1, 0]}
        2: {Description: North, VectorToDest: [0, -1]}
        3: {Description: East, VectorToDest: [1, 0]}
        4: {Description: South, VectorToDest: [0, 1]}
    Behaviours:
      - Src:
          Object: nest
          Preconditions: [{lt: [src.hatched, 3]}]
          Commands: [{spawn: spider}, {incr: hatched}, {exec: {Action: spawn_spider, Delay: 60, Randomize: true}}]
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src:
          Object: nest
          Preconditions: [{lt: [src.hatched, 3]}]
          Commands: [{exec: {Action: spawn_spider, Delay: 15, Randomize: true}}]
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, wall, lava, gem, nest, brood, spider, hunter, gnome]}

  # Brood nests hatch up to 2 hunters each.
  - Name: spawn_hunter
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: West, VectorToDest: [-1, 0]}
        2: {Description: North, VectorToDest: [0, -1]}
        3: {Description: East, VectorToDest: [1, 0]}
        4: {Description: South, VectorToDest: [0, 1]}
    Behaviours:
      - Src:
          Object: brood
          Preconditions: [{lt: [src.hatched, 2]}]
          Commands: [{spawn: hunter}, {incr: hatched}, {exec: {Action: spawn_hunter, Delay: 90, Randomize: true}}]
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src:
          Object: brood
          Preconditions: [{lt: [src.hatched, 2]}]
          Commands: [{exec: {Action: spawn_hunter, Delay: 15, Randomize: true}}]
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, wall, lava, gem, nest, brood, spider, hunter, gnome]}

  # Publishes the avatar's position in globals ax / ay (read by the hunters' stalk logic).
  - Name: sync
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Sync, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: gnome, Commands: [{set: [ax, _x]}, {set: [ay, _y]}]}
        Dst: {Object: gnome}

  # Hunters (red-eyed) track the gnome with A* once within 9 tiles and lose it beyond 14; one step
  # every 3 ticks (2 once the gnome has taken 4+ gems). They never walk into lava.
  # Hunter think: every `pace` ticks decide - chase the gnome (A*) when alert, else roam.
  - Name: stalk
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Think, VectorToDest: [0, 0]}
    Behaviours:
      - Src:
          Object: hunter
          Commands:
            - set: [rx, _x]
            - sub: [rx, ax]
            - set: [arx, rx]
            - if: {Conditions: {lt: [rx, 0]}, OnTrue: [{set: [arx, 0]}, {sub: [arx, rx]}]}
            - set: [ry, _y]
            - sub: [ry, ay]
            - set: [ary, ry]
            - if: {Conditions: {lt: [ry, 0]}, OnTrue: [{set: [ary, 0]}, {sub: [ary, ry]}]}
            - set: [d, arx]
            - add: [d, ary]
            - if: {Conditions: {lte: [d, 9]}, OnTrue: [{set: [alert, 1]}]}
            - if: {Conditions: {gt: [d, 14]}, OnTrue: [{set: [alert, 0]}]}
            - set: [pace, 3]
            - if: {Conditions: {gte: [taken, 4]}, OnTrue: [{set: [pace, 2]}]}
            - set: [due, _steps]
            - add: [due, pace]
            - exec: {Action: stalk, ActionId: 1, Delay: pace}
            - if:
                Conditions: {eq: [alert, 1]}
                OnTrue: [{set_tile: 1}, {exec: {Action: hunt, Search: {TargetObjectName: gnome, ImpassableObjects: [water, tree, bush, rock, hedge, stone, tombstone, torch, wall, lava, gem, nest, brood, spider, hunter]}}}]
                OnFalse: [{set_tile: 0}, {exec: {Action: hunt, Randomize: true}}]
        Dst: {Object: hunter}

  # One hunter step (absolute 1 W, 2 N, 3 E, 4 S); chosen by A* or at random by stalk.
  - Name: hunt
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: West, VectorToDest: [-1, 0]}
        2: {Description: North, VectorToDest: [0, -1]}
        3: {Description: East, VectorToDest: [1, 0]}
        4: {Description: South, VectorToDest: [0, 1]}
    Behaviours:
      - Src: {Object: hunter, Commands: [{mov: _dest}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: hunter}
        Dst: {Object: gnome, Commands: [{remove: true}, {reward: -1}]}

  # The gnome walks up / down / left / right; bumping a gem collects it.
  - Name: move
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: gnome, Commands: [{set_tile: meta.facing}, {mov: _dest}, {exec: {Action: sync, ActionId: 1}}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: gnome, Commands: [{set_tile: meta.facing}, {reward: 1}, {incr: taken}]}
        Dst: {Object: gem, Commands: [{remove: true}]}
      - Src: {Object: gnome, Commands: [{remove: true}, {reward: -1}]}
        Dst: {Object: [spider, hunter, lava]}
      - Src: {Object: gnome, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, wall, nest, brood]}

