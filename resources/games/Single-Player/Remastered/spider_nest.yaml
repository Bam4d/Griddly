Version: "0.1"
Environment:
  Name: Spider Nest Remastered
  Description: |
    Collect every gem in the volcanic caves. Spiders wander at random and nests hatch more of them.
    Red-eyed hunters chase you with A* pathfinding once you come within 9 tiles (one step every 3 ticks,
    every 2 once you hold 4 gems; they lose you beyond 14) and brood nests hatch hunters;
    touching a spider or stepping into lava is fatal (spiders burn in lava too). Cave walls, rocks
    and torches block the way; log bridges cross the lava.
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Sprite2D   whole level (global observer)
  #   FollowCam  15x11 window that follows the avatar
  #   CloseUp    9x9 window that follows the avatar (also the agent's default view)
  Observers:
    Sprite2D:
      TileSize: 24
      BackgroundTile: oryx/oryx_fantasy/floor2-2.png
      RotateAvatarImage: false
      TrackAvatar: false
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: oryx/oryx_fantasy/floor2-2.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 15
      Height: 11
    CloseUp:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: oryx/oryx_fantasy/floor2-2.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 9
      Height: 9
    Block2D:
      TileSize: 24
  Variables:
    - Name: ax
      InitialValue: 0
    - Name: ay
      InitialValue: 0
    - Name: taken
      InitialValue: 0
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: false
      Width: 9
      Height: 9
    AvatarObject: gnome
  Termination:
    Win:
      - eq: [gem:count, 0]
    Lose:
      - eq: [gnome:count, 0]
