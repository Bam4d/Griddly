[install]
# Pin the default registry to public npm, as the registry repo itself does, so a developer's global
# registry (for example a proxy in ~/.bunfig.toml) cannot leak its tarball URLs into the committed
# bun.lock. The app's own capability scope resolves from its index, mapped at the end of this file;
# a capability that pins private packages ships the `.npmrc` mapping their scopes.
registry = "https://registry.npmjs.org"
# The workspace members capabilities ship for apps/web (`packages/ts/<capability>`) reach it only by
# being hoisted to the root node_modules. The CLI adds this line when it is missing, but only in
# Git mode: in package mode it writes its own bunfig.toml before vendoring core, whose copy of this
# file then replaces it.
linker = "hoisted"
# A `minimumReleaseAge` quarantine (commonly set in ~/.bunfig.toml) guards against a hostile upload
# landing before anyone notices; it does not apply to packages Mistral publishes itself, and a
# freshly tagged first-party pin would otherwise fail `bun install` for days. Bun matches exact
# package names only (no `@scope/*` globs), and a local list REPLACES the global one rather than
# extending it. So this lists every first-party package a capability template pins from the index;
# the CLI appends the app's own `@mistralai-capabilities/*` packages when it installs them from one.
# A registry test keeps the list in sync with the templates' pins.
minimumReleaseAgeExcludes = []

# Generated by app-registry-pins.ts from this app's package index. The CLI rewrites this entry
# at the end of the file when it installs capability packages, so the table stays last.
[install.scopes]
"@mistralai-capabilities" = "https://registry.npmjs.org/"

# @mistral/* are installed from http://127.0.0.1:0/ (nowhere: no Mistral registry serves them to this app, and public npm must not).
"@mistral" = { url = "http://127.0.0.1:0/" }
