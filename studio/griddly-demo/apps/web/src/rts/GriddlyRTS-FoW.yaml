Version: "0.1"
Environment:
  Name: GriddlyRTS-FoW
  Description: |
    Griddly RTS: Frontiers. Two players, large maps in many styles, a camera per player and a
    global mini-map. Generated by make_fow_gdy.py (rules) and fow_maps.py (maps): edit those, not
    this file.

    The GDY holds all of the game logic; players (human UI or the scripted AI in fow_policy.py)
    only issue the external actions below, one per unit per tick, and advance time.

    Economy   workers mine minerals (1 per trip, 2 with Mining), gems (3 per trip) or chop forest
              (1 per trip; clears the tile). One load at a time; deposit at your base.
    Relays    stand next to a relay to capture it (enemy relays too); each relay you own pays 1
              resource every 6 ticks.
    Buildings base, barracks, lab (research), tower (auto-fires at enemies within 3 cells), wall.
    Units     worker, scout (fast + cheap), trooper, gunner (shoots 2 cells, over water/walls),
              medic (heals), tank (heavy, moves every other tick).
    Research  Mining, Weapons, Armour, Gunnery (needs Weapons), Vehicles (needs Armour),
              Fortify (needs Armour): stronger towers.
    Victory   destroy the enemy base.
  # Game clock: real-time play runs this many ticks per second. Players record their actions
  # between ticks (queue_actions / queueActions); each tick runs every player's recorded actions
  # together, then time advances once.
  TickRate: 4
  # Every view is rendered by the engine. Colours are egocentric in a player's views (their objects
  # use Colors[0], green; the enemy Colors[1], red); the global views use player 1 / player 2.
  Observers:
    Block2D:
      TileSize: 6
      BackgroundColor: [ 0.12, 0.13, 0.11 ]
    Sprite2D:
      TileSize: 16
      BackgroundTile: oryx/oryx_tiny_galaxy/tg_sliced/tg_world/tg_world_floor_regolith_a.png
      HighlightPlayers: true
      HighlightStyle: SHADOW
      HighlightScale: 1.6
      HealthBars: true
    # a player's main view: a 24x15 cell window on their camera (cam_x, cam_y), under fog of war
    PlayerView:
      Type: SPRITE_2D
      TileSize: 16
      Width: 24
      Height: 15
      BackgroundTile: oryx/oryx_tiny_galaxy/tg_sliced/tg_world/tg_world_floor_regolith_a.png
      HighlightPlayers: true
      HighlightStyle: SHADOW
      HighlightScale: 1.6
      HealthBars: true
      Camera: { X: cam_x, Y: cam_y }
      FogOfWar:
        SightVariable: sight
        ExploredOpacity: 0.55
    # the same camera window without fog (spectating, or playing with fog off)
    CameraView:
      Type: SPRITE_2D
      TileSize: 16
      Width: 24
      Height: 15
      BackgroundTile: oryx/oryx_tiny_galaxy/tg_sliced/tg_world/tg_world_floor_regolith_a.png
      HighlightPlayers: true
      HighlightStyle: SHADOW
      HighlightScale: 1.6
      HealthBars: true
      Camera: { X: cam_x, Y: cam_y }
    # a player's mini-map: the whole map under their fog of war, with their camera window outlined
    MiniMap:
      Type: BLOCK_2D
      TileSize: 4
      BackgroundColor: [ 0.12, 0.13, 0.11 ]
      FogOfWar:
        SightVariable: sight
        ExploredOpacity: 0.5
      CameraFrame: { X: cam_x, Y: cam_y, Width: 24, Height: 15 }
    # spectators: the whole map without fog
    Overview:
      Type: SPRITE_2D
      TileSize: 16
      BackgroundTile: oryx/oryx_tiny_galaxy/tg_sliced/tg_world/tg_world_floor_regolith_a.png
      HighlightPlayers: true
      HighlightStyle: SHADOW
      HighlightScale: 1.6
      HealthBars: true
    GlobalMap:
      Type: BLOCK_2D
      TileSize: 6
      BackgroundColor: [ 0.12, 0.13, 0.11 ]
      CameraFrame: { X: cam_x, Y: cam_y, Width: 24, Height: 15 }
    Vector:
      IncludePlayerId: true
      IncludeVariables: true
  Variables:
    - Name: player_resources
      InitialValue: 12
      PerPlayer: true
    # per-player camera centre (moved with move_camera); bounds come from the map_size marker
    - Name: cam_x
      InitialValue: 0
      PerPlayer: true
    - Name: cam_y
      InitialValue: 0
      PerPlayer: true
    - Name: map_w
      InitialValue: 0
    - Name: map_h
      InitialValue: 0
    # research state per player: 0 = not researched, 1 = in progress, 2 = done
    - Name: res_mining
      InitialValue: 0
      PerPlayer: true
    - Name: res_weapons
      InitialValue: 0
      PerPlayer: true
    - Name: res_armor
      InitialValue: 0
      PerPlayer: true
    - Name: res_gunnery
      InitialValue: 0
      PerPlayer: true
    - Name: res_vehicles
      InitialValue: 0
      PerPlayer: true
    - Name: res_fortify
      InitialValue: 0
      PerPlayer: true
  Player:
    Count: 2
    # each player only knows what their objects can see: the engine filters every player's state
    # query (get_player_state / getPlayerState) and their fog-of-war views with this
    FogOfWar:
      SightVariable: sight
    # egocentric player colours: each player sees itself as the first colour (green) and the
    # enemy as the second. The global mini-map uses player 1 / player 2 directly.
    Colors:
      - [ 0.2, 0.9, 0.3 ]
      - [ 0.95, 0.3, 0.25 ]
  Termination:
    Lose:
      - Conditions:
          - eq: [ base:count, 0 ]
        Reward: -10
        OpposingReward: 10
