Actions:
  # Camera: pan the player's view. Issued on the player's base; does not move any object.
  - Name: move_camera
    InputMapping:
      Inputs:
        1: { Description: Pan camera left, VectorToDest: [ 0, 0 ], MetaData: { dx: -2, dy: 0 }, KeyBinding: ArrowLeft }
        2: { Description: Pan camera up, VectorToDest: [ 0, 0 ], MetaData: { dx: 0, dy: -2 }, KeyBinding: ArrowUp }
        3: { Description: Pan camera right, VectorToDest: [ 0, 0 ], MetaData: { dx: 2, dy: 0 }, KeyBinding: ArrowRight }
        4: { Description: Pan camera down, VectorToDest: [ 0, 0 ], MetaData: { dx: 0, dy: 2 }, KeyBinding: ArrowDown }
    Behaviours:
      - Src:
          ObjectRules: base
          Commands:
            - add: [ cam_x, meta.dx ]
            - add: [ cam_y, meta.dy ]
            - lt: { Arguments: [ cam_x, 0 ], Commands: [ { set: [ cam_x, 0 ] } ] }
            - lt: { Arguments: [ cam_y, 0 ], Commands: [ { set: [ cam_y, 0 ] } ] }
            - gte: { Arguments: [ cam_x, map_w ], Commands: [ { set: [ cam_x, map_w ] }, { decr: cam_x } ] }
            - gte: { Arguments: [ cam_y, map_h ], Commands: [ { set: [ cam_y, map_h ] }, { decr: cam_y } ] }
        Dst:
          ObjectRules: base

  - Name: move
    InputMapping:
      Inputs:
        1: { Description: "Move left", VectorToDest: [ -1, 0 ], KeyBinding: "a" }
        2: { Description: "Move up", VectorToDest: [ 0, -1 ], KeyBinding: "w" }
        3: { Description: "Move right", VectorToDest: [ 1, 0 ], KeyBinding: "d" }
        4: { Description: "Move down", VectorToDest: [ 0, 1 ], KeyBinding: "s" }
    Behaviours:
      - Src:
          ObjectRules: [ worker, combat, marine, medic ]
          Commands:
            - mov: _dest
        Dst:
          ObjectRules: [ _empty, bridge ]
      # scouts are fast: each move order takes them two cells when the second cell is free
      - Src:
          ObjectRules: scout
          Commands:
            - mov: _dest
            # no ActionId: the follow-up step reuses this move's direction
            - exec:
                Action: dash
        Dst:
          ObjectRules: [ _empty, bridge ]
      # tanks are slow: after moving they wait for tank_ready before moving again
      - Src:
          ObjectRules: tank
          Preconditions:
            - eq: [ src.cooldown, 0 ]
          Commands:
            - set: [ src.cooldown, 1 ]
            - mov: _dest
            - exec:
                Action: tank_ready
                Delay: 2
                ActionId: 1
        Dst:
          ObjectRules: [ _empty, bridge ]

  # Internal: the scout's second step, in the direction of the move it just made.
  - Name: dash
    InputMapping:
      Internal: true
      Inputs:
        1: { VectorToDest: [ -1, 0 ] }
        2: { VectorToDest: [ 0, -1 ] }
        3: { VectorToDest: [ 1, 0 ] }
        4: { VectorToDest: [ 0, 1 ] }
    Behaviours:
      - Src:
          ObjectRules: scout
          Commands:
            - mov: _dest
        Dst:
          ObjectRules: [ _empty, bridge ]

  # Gather from an adjacent mineral / gem / forest (one load at a time), or deposit at your base.
  - Name: gather
    InputMapping:
      Inputs:
        1: { Description: "Gather / deposit left", VectorToDest: [ -1, 0 ], KeyBinding: "q+a" }
        2: { Description: "Gather / deposit up", VectorToDest: [ 0, -1 ], KeyBinding: "q+w" }
        3: { Description: "Gather / deposit right", VectorToDest: [ 1, 0 ], KeyBinding: "q+d" }
        4: { Description: "Gather / deposit down", VectorToDest: [ 0, 1 ], KeyBinding: "q+s" }
    Behaviours:
      - Src:
          ObjectRules: worker
          Preconditions:
            - eq: [ src.carrying, 0 ]
          Commands:
            - set: [ src.carrying, 1 ]
            - set_tile: 1
        Dst:
          ObjectRules: minerals
          Commands:
            - decr: dst.resources
            - lt: { Arguments: [ dst.resources, 10 ], Commands: [ { set_tile: 1 } ] }
            - lt: { Arguments: [ dst.resources, 5 ], Commands: [ { set_tile: 2 } ] }
            - lte: { Arguments: [ dst.resources, 0 ], Commands: [ { remove: true } ] }
      - Src:
          ObjectRules: worker
          Preconditions:
            - eq: [ src.carrying, 0 ]
          Commands:
            - set: [ src.carrying, 3 ]
            - set_tile: 3
        Dst:
          ObjectRules: gems
          Commands:
            - decr: dst.resources
            - lte: { Arguments: [ dst.resources, 0 ], Commands: [ { remove: true } ] }
      - Src:
          ObjectRules: worker
          Preconditions:
            - eq: [ src.carrying, 0 ]
          Commands:
            - set: [ src.carrying, 2 ]
            - set_tile: 2
        Dst:
          ObjectRules: forest
          Commands:
            - remove: true
      - Src:
          ObjectRules: worker
          Preconditions:
            - gt: [ src.carrying, 0 ]
            - eq: [ src._playerId, dst._playerId ]
          Commands:
            # carrying: 1 = mineral, 2 = wood, 3 = gem
            - eq: { Arguments: [ src.carrying, 1 ], Commands: [ { incr: player_resources } ] }
            - if:
                Conditions: { and: [ { eq: [ src.carrying, 1 ] }, { eq: [ res_mining, 2 ] } ] }
                OnTrue: [ { incr: player_resources } ]
            - eq: { Arguments: [ src.carrying, 2 ], Commands: [ { incr: player_resources } ] }
            - eq: { Arguments: [ src.carrying, 3 ], Commands: [ { add: [ player_resources, 3 ] } ] }
            - set: [ src.carrying, 0 ]
            - set_tile: 0
            - reward: 1
        Dst:
          ObjectRules: base

  # Melee attack on an adjacent enemy unit or building.
  - Name: attack
    InputMapping:
      Inputs:
        1: { Description: "Attack left", VectorToDest: [ -1, 0 ], KeyBinding: "f+a" }
        2: { Description: "Attack up", VectorToDest: [ 0, -1 ], KeyBinding: "f+w" }
        3: { Description: "Attack right", VectorToDest: [ 1, 0 ], KeyBinding: "f+d" }
        4: { Description: "Attack down", VectorToDest: [ 0, 1 ], KeyBinding: "f+s" }
    Behaviours:
      - Src:
          ObjectRules: [ worker, scout, combat, marine, medic, tank ]
          Preconditions:
            - neq: [ src._playerId, dst._playerId ]
          Commands:
            - reward: 1
        Dst:
          ObjectRules: [ worker, scout, combat, marine, medic, tank, base, barracks, lab, tower, wall ]
          Commands:
            # damage = attacker damage (+1 with the attacker's Weapons) (-1 with the defender's Armour)
            - sub: [ dst.health, src.damage ]
            - eq:
                Arguments: [ src.res_weapons, 2 ]
                Commands:
                  - sub: [ dst.health, 1 ]
            - eq:
                Arguments: [ res_armor, 2 ]
                Commands:
                  - add: [ dst.health, 1 ]
            - lte:
                Arguments: [ dst.health, 0 ]
                Commands:
                  - remove: true

  # Gunners shoot an enemy exactly 2 cells away in a straight line (over anything in between).
  - Name: shoot
    InputMapping:
      Inputs:
        1: { Description: "Shoot 2 cells left", VectorToDest: [ -2, 0 ], KeyBinding: "x+a" }
        2: { Description: "Shoot 2 cells up", VectorToDest: [ 0, -2 ], KeyBinding: "x+w" }
        3: { Description: "Shoot 2 cells right", VectorToDest: [ 2, 0 ], KeyBinding: "x+d" }
        4: { Description: "Shoot 2 cells down", VectorToDest: [ 0, 2 ], KeyBinding: "x+s" }
    Behaviours:
      - Src:
          ObjectRules: marine
          Preconditions:
            - neq: [ src._playerId, dst._playerId ]
          Commands:
            - reward: 1
        Dst:
          ObjectRules: [ worker, scout, combat, marine, medic, tank, base, barracks, lab, tower, wall ]
          Commands:
            # damage = attacker damage (+1 with the attacker's Weapons) (-1 with the defender's Armour)
            - sub: [ dst.health, src.damage ]
            - eq:
                Arguments: [ src.res_weapons, 2 ]
                Commands:
                  - sub: [ dst.health, 1 ]
            - eq:
                Arguments: [ res_armor, 2 ]
                Commands:
                  - add: [ dst.health, 1 ]
            - lte:
                Arguments: [ dst.health, 0 ]
                Commands:
                  - remove: true

  # Medics heal an adjacent friendly unit by 3 (up to its max health).
  - Name: heal
    InputMapping:
      Inputs:
        1: { Description: "Heal left", VectorToDest: [ -1, 0 ], KeyBinding: "h+a" }
        2: { Description: "Heal up", VectorToDest: [ 0, -1 ], KeyBinding: "h+w" }
        3: { Description: "Heal right", VectorToDest: [ 1, 0 ], KeyBinding: "h+d" }
        4: { Description: "Heal down", VectorToDest: [ 0, 1 ], KeyBinding: "h+s" }
    Behaviours:
      - Src:
          ObjectRules: medic
          Preconditions:
            - eq: [ src._playerId, dst._playerId ]
            - lt: [ dst.health, dst.max_health ]
        Dst:
          ObjectRules: [ worker, scout, combat, marine, medic, tank ]
          Commands:
            - add: [ dst.health, 3 ]
            - gt: { Arguments: [ dst.health, dst.max_health ], Commands: [ { set: [ dst.health, dst.max_health ] } ] }

  # Workers repair an adjacent friendly building by 2 (up to its max health).
  - Name: repair
    InputMapping:
      Inputs:
        1: { Description: "Repair left", VectorToDest: [ -1, 0 ], KeyBinding: "e+a" }
        2: { Description: "Repair up", VectorToDest: [ 0, -1 ], KeyBinding: "e+w" }
        3: { Description: "Repair right", VectorToDest: [ 1, 0 ], KeyBinding: "e+d" }
        4: { Description: "Repair down", VectorToDest: [ 0, 1 ], KeyBinding: "e+s" }
    Behaviours:
      - Src:
          ObjectRules: worker
          Preconditions:
            - eq: [ src._playerId, dst._playerId ]
            - lt: [ dst.health, dst.max_health ]
        Dst:
          ObjectRules: [ base, barracks, lab, tower, wall ]
          Commands:
            - add: [ dst.health, 2 ]
            - gt: { Arguments: [ dst.health, dst.max_health ], Commands: [ { set: [ dst.health, dst.max_health ] } ] }

  # Builds spawn into the adjacent empty cell in the chosen direction.
  - Name: build_worker
    InputMapping:
      Inputs:
        1: { Description: "Train worker (left of base)", VectorToDest: [ -1, 0 ], KeyBinding: "1+a" }
        2: { Description: "Train worker (up of base)", VectorToDest: [ 0, -1 ], KeyBinding: "1+w" }
        3: { Description: "Train worker (right of base)", VectorToDest: [ 1, 0 ], KeyBinding: "1+d" }
        4: { Description: "Train worker (down of base)", VectorToDest: [ 0, 1 ], KeyBinding: "1+s" }
    Behaviours:
      - Src:
          ObjectRules: base
          Preconditions:
            - gte: [ player_resources, 5 ]
          Commands:
            - sub: [ player_resources, 5 ]
            - spawn: worker
        Dst:
          ObjectRules: _empty

  - Name: build_scout
    InputMapping:
      Inputs:
        1: { Description: "Train scout (left of barracks)", VectorToDest: [ -1, 0 ], KeyBinding: "z+a" }
        2: { Description: "Train scout (up of barracks)", VectorToDest: [ 0, -1 ], KeyBinding: "z+w" }
        3: { Description: "Train scout (right of barracks)", VectorToDest: [ 1, 0 ], KeyBinding: "z+d" }
        4: { Description: "Train scout (down of barracks)", VectorToDest: [ 0, 1 ], KeyBinding: "z+s" }
    Behaviours:
      - Src:
          ObjectRules: barracks
          Preconditions:
            - gte: [ player_resources, 4 ]
          Commands:
            - sub: [ player_resources, 4 ]
            - spawn: scout
        Dst:
          ObjectRules: _empty

  - Name: build_combat
    InputMapping:
      Inputs:
        1: { Description: "Train trooper (left of barracks)", VectorToDest: [ -1, 0 ], KeyBinding: "c+a" }
        2: { Description: "Train trooper (up of barracks)", VectorToDest: [ 0, -1 ], KeyBinding: "c+w" }
        3: { Description: "Train trooper (right of barracks)", VectorToDest: [ 1, 0 ], KeyBinding: "c+d" }
        4: { Description: "Train trooper (down of barracks)", VectorToDest: [ 0, 1 ], KeyBinding: "c+s" }
    Behaviours:
      - Src:
          ObjectRules: barracks
          Preconditions:
            - gte: [ player_resources, 5 ]
          Commands:
            - sub: [ player_resources, 5 ]
            - spawn: combat
        Dst:
          ObjectRules: _empty

  - Name: build_marine
    InputMapping:
      Inputs:
        1: { Description: "Train gunner (left of barracks)", VectorToDest: [ -1, 0 ], KeyBinding: "g+a" }
        2: { Description: "Train gunner (up of barracks)", VectorToDest: [ 0, -1 ], KeyBinding: "g+w" }
        3: { Description: "Train gunner (right of barracks)", VectorToDest: [ 1, 0 ], KeyBinding: "g+d" }
        4: { Description: "Train gunner (down of barracks)", VectorToDest: [ 0, 1 ], KeyBinding: "g+s" }
    Behaviours:
      - Src:
          ObjectRules: barracks
          Preconditions:
            - gte: [ player_resources, 6 ]
            - eq: [ res_gunnery, 2 ]
          Commands:
            - sub: [ player_resources, 6 ]
            - spawn: marine
        Dst:
          ObjectRules: _empty

  - Name: build_medic
    InputMapping:
      Inputs:
        1: { Description: "Train medic (left of barracks)", VectorToDest: [ -1, 0 ], KeyBinding: "m+a" }
        2: { Description: "Train medic (up of barracks)", VectorToDest: [ 0, -1 ], KeyBinding: "m+w" }
        3: { Description: "Train medic (right of barracks)", VectorToDest: [ 1, 0 ], KeyBinding: "m+d" }
        4: { Description: "Train medic (down of barracks)", VectorToDest: [ 0, 1 ], KeyBinding: "m+s" }
    Behaviours:
      - Src:
          ObjectRules: barracks
          Preconditions:
            - gte: [ player_resources, 6 ]
          Commands:
            - sub: [ player_resources, 6 ]
            - spawn: medic
        Dst:
          ObjectRules: _empty

  - Name: build_tank
    InputMapping:
      Inputs:
        1: { Description: "Train tank (left of barracks)", VectorToDest: [ -1, 0 ], KeyBinding: "t+a" }
        2: { Description: "Train tank (up of barracks)", VectorToDest: [ 0, -1 ], KeyBinding: "t+w" }
        3: { Description: "Train tank (right of barracks)", VectorToDest: [ 1, 0 ], KeyBinding: "t+d" }
        4: { Description: "Train tank (down of barracks)", VectorToDest: [ 0, 1 ], KeyBinding: "t+s" }
    Behaviours:
      - Src:
          ObjectRules: barracks
          Preconditions:
            - gte: [ player_resources, 12 ]
            - eq: [ res_vehicles, 2 ]
          Commands:
            - sub: [ player_resources, 12 ]
            - spawn: tank
        Dst:
          ObjectRules: _empty

  - Name: build_barracks
    InputMapping:
      Inputs:
        1: { Description: "Build barracks left of worker", VectorToDest: [ -1, 0 ], KeyBinding: "b+a" }
        2: { Description: "Build barracks up of worker", VectorToDest: [ 0, -1 ], KeyBinding: "b+w" }
        3: { Description: "Build barracks right of worker", VectorToDest: [ 1, 0 ], KeyBinding: "b+d" }
        4: { Description: "Build barracks down of worker", VectorToDest: [ 0, 1 ], KeyBinding: "b+s" }
    Behaviours:
      - Src:
          ObjectRules: worker
          Preconditions:
            - gte: [ player_resources, 15 ]
          Commands:
            - sub: [ player_resources, 15 ]
            - spawn: barracks
        Dst:
          ObjectRules: _empty

  - Name: build_lab
    InputMapping:
      Inputs:
        1: { Description: "Build lab left of worker", VectorToDest: [ -1, 0 ], KeyBinding: "l+a" }
        2: { Description: "Build lab up of worker", VectorToDest: [ 0, -1 ], KeyBinding: "l+w" }
        3: { Description: "Build lab right of worker", VectorToDest: [ 1, 0 ], KeyBinding: "l+d" }
        4: { Description: "Build lab down of worker", VectorToDest: [ 0, 1 ], KeyBinding: "l+s" }
    Behaviours:
      - Src:
          ObjectRules: worker
          Preconditions:
            - gte: [ player_resources, 10 ]
          Commands:
            - sub: [ player_resources, 10 ]
            - spawn: lab
        Dst:
          ObjectRules: _empty

  - Name: build_tower
    InputMapping:
      Inputs:
        1: { Description: "Build tower left of worker", VectorToDest: [ -1, 0 ], KeyBinding: "o+a" }
        2: { Description: "Build tower up of worker", VectorToDest: [ 0, -1 ], KeyBinding: "o+w" }
        3: { Description: "Build tower right of worker", VectorToDest: [ 1, 0 ], KeyBinding: "o+d" }
        4: { Description: "Build tower down of worker", VectorToDest: [ 0, 1 ], KeyBinding: "o+s" }
    Behaviours:
      - Src:
          ObjectRules: worker
          Preconditions:
            - gte: [ player_resources, 12 ]
          Commands:
            - sub: [ player_resources, 12 ]
            - spawn: tower
        Dst:
          ObjectRules: _empty

  - Name: build_wall
    InputMapping:
      Inputs:
        1: { Description: "Build wall left of worker", VectorToDest: [ -1, 0 ], KeyBinding: "x+a" }
        2: { Description: "Build wall up of worker", VectorToDest: [ 0, -1 ], KeyBinding: "x+w" }
        3: { Description: "Build wall right of worker", VectorToDest: [ 1, 0 ], KeyBinding: "x+d" }
        4: { Description: "Build wall down of worker", VectorToDest: [ 0, 1 ], KeyBinding: "x+s" }
    Behaviours:
      - Src:
          ObjectRules: worker
          Preconditions:
            - gte: [ player_resources, 2 ]
          Commands:
            - sub: [ player_resources, 2 ]
            - spawn: wall
        Dst:
          ObjectRules: _empty


  # Research is issued on a lab; the tech id is passed as action metadata.
  - Name: research
    InputMapping:
      Inputs:
        1: { Description: "Research Mining (8, 8 ticks): workers deposit 2 per mineral trip", VectorToDest: [ 0, 0 ], MetaData: { tech: 1 }, KeyBinding: "r+1" }
        2: { Description: "Research Weapons (10, 8 ticks): +1 damage for all units", VectorToDest: [ 0, 0 ], MetaData: { tech: 2 }, KeyBinding: "r+2" }
        3: { Description: "Research Armour (10, 8 ticks): -1 damage taken by units and buildings", VectorToDest: [ 0, 0 ], MetaData: { tech: 3 }, KeyBinding: "r+3" }
        4: { Description: "Research Gunnery (12, 10 ticks, needs Weapons): unlocks gunners", VectorToDest: [ 0, 0 ], MetaData: { tech: 4 }, KeyBinding: "r+4" }
        5: { Description: "Research Vehicles (12, 10 ticks, needs Armor): unlocks tanks", VectorToDest: [ 0, 0 ], MetaData: { tech: 5 }, KeyBinding: "r+5" }
        6: { Description: "Research Fortify (10, 8 ticks, needs Armor): towers deal +2 damage and reload faster", VectorToDest: [ 0, 0 ], MetaData: { tech: 6 }, KeyBinding: "r+6" }
    Behaviours:
      - Src:
          ObjectRules: lab
          Preconditions:
            - eq: [ meta.tech, 1 ]
            - eq: [ src.busy, 0 ]
            - eq: [ res_mining, 0 ]
            - gte: [ player_resources, 8 ]
          Commands:
            - sub: [ player_resources, 8 ]
            - set: [ res_mining, 1 ]
            - set: [ src.busy, 1 ]
            - set_tile: 1
            - exec:
                Action: research_done
                Delay: 8
                ActionId: 1
        Dst:
          ObjectRules: lab
      - Src:
          ObjectRules: lab
          Preconditions:
            - eq: [ meta.tech, 2 ]
            - eq: [ src.busy, 0 ]
            - eq: [ res_weapons, 0 ]
            - gte: [ player_resources, 10 ]
          Commands:
            - sub: [ player_resources, 10 ]
            - set: [ res_weapons, 1 ]
            - set: [ src.busy, 2 ]
            - set_tile: 1
            - exec:
                Action: research_done
                Delay: 8
                ActionId: 1
        Dst:
          ObjectRules: lab
      - Src:
          ObjectRules: lab
          Preconditions:
            - eq: [ meta.tech, 3 ]
            - eq: [ src.busy, 0 ]
            - eq: [ res_armor, 0 ]
            - gte: [ player_resources, 10 ]
          Commands:
            - sub: [ player_resources, 10 ]
            - set: [ res_armor, 1 ]
            - set: [ src.busy, 3 ]
            - set_tile: 1
            - exec:
                Action: research_done
                Delay: 8
                ActionId: 1
        Dst:
          ObjectRules: lab
      - Src:
          ObjectRules: lab
          Preconditions:
            - eq: [ meta.tech, 4 ]
            - eq: [ src.busy, 0 ]
            - eq: [ res_gunnery, 0 ]
            - gte: [ player_resources, 12 ]
            - eq: [ res_weapons, 2 ]
          Commands:
            - sub: [ player_resources, 12 ]
            - set: [ res_gunnery, 1 ]
            - set: [ src.busy, 4 ]
            - set_tile: 1
            - exec:
                Action: research_done
                Delay: 10
                ActionId: 1
        Dst:
          ObjectRules: lab
      - Src:
          ObjectRules: lab
          Preconditions:
            - eq: [ meta.tech, 5 ]
            - eq: [ src.busy, 0 ]
            - eq: [ res_vehicles, 0 ]
            - gte: [ player_resources, 12 ]
            - eq: [ res_armor, 2 ]
          Commands:
            - sub: [ player_resources, 12 ]
            - set: [ res_vehicles, 1 ]
            - set: [ src.busy, 5 ]
            - set_tile: 1
            - exec:
                Action: research_done
                Delay: 10
                ActionId: 1
        Dst:
          ObjectRules: lab
      - Src:
          ObjectRules: lab
          Preconditions:
            - eq: [ meta.tech, 6 ]
            - eq: [ src.busy, 0 ]
            - eq: [ res_fortify, 0 ]
            - gte: [ player_resources, 10 ]
            - eq: [ res_armor, 2 ]
          Commands:
            - sub: [ player_resources, 10 ]
            - set: [ res_fortify, 1 ]
            - set: [ src.busy, 6 ]
            - set_tile: 1
            - exec:
                Action: research_done
                Delay: 8
                ActionId: 1
        Dst:
          ObjectRules: lab

  # Internal: a lab finishes its current research project.
  - Name: research_done
    InputMapping:
      Internal: true
      Inputs:
        1: { VectorToDest: [ 0, 0 ] }
    Behaviours:
      - Src:
          ObjectRules: lab
          Commands:
            - eq:
                Arguments: [ src.busy, 1 ]
                Commands:
                  - set: [ res_mining, 2 ]
            - eq:
                Arguments: [ src.busy, 2 ]
                Commands:
                  - set: [ res_weapons, 2 ]
            - eq:
                Arguments: [ src.busy, 3 ]
                Commands:
                  - set: [ res_armor, 2 ]
            - eq:
                Arguments: [ src.busy, 4 ]
                Commands:
                  - set: [ res_gunnery, 2 ]
            - eq:
                Arguments: [ src.busy, 5 ]
                Commands:
                  - set: [ res_vehicles, 2 ]
            - eq:
                Arguments: [ src.busy, 6 ]
                Commands:
                  - set: [ res_fortify, 2 ]
            - set: [ src.busy, 0 ]
            - set_tile: 0
        Dst:
          ObjectRules: lab

  # Towers fire at an enemy unit within 3 cells whenever loaded (2 damage, 4 with Fortify).
  - Name: tower_fire
    Trigger:
      Type: RANGE_BOX_AREA
      Range: 3
    Behaviours:
      - Src:
          ObjectRules: tower
          Preconditions:
            - eq: [ src.loaded, 1 ]
            - neq: [ src._playerId, dst._playerId ]
          Commands:
            - set: [ src.loaded, 0 ]
            - eq: { Arguments: [ res_fortify, 2 ], Commands: [ { exec: { Action: tower_reload, Delay: 2, ActionId: 1 } } ] }
            - neq: { Arguments: [ res_fortify, 2 ], Commands: [ { exec: { Action: tower_reload, Delay: 3, ActionId: 1 } } ] }
        Dst:
          ObjectRules: [ worker, scout, combat, marine, medic, tank ]
          Commands:
            - sub: [ dst.health, 2 ]
            - eq: { Arguments: [ src.res_fortify, 2 ], Commands: [ { sub: [ dst.health, 2 ] } ] }
            - eq:
                Arguments: [ res_armor, 2 ]
                Commands:
                  - add: [ dst.health, 1 ]
            - lte:
                Arguments: [ dst.health, 0 ]
                Commands:
                  - remove: true

  - Name: tower_reload
    InputMapping:
      Internal: true
      Inputs:
        1: { VectorToDest: [ 0, 0 ] }
    Behaviours:
      - Src:
          ObjectRules: tower
          Commands:
            - set: [ src.loaded, 1 ]
        Dst:
          ObjectRules: tower

  # Relays: any unit standing next to a neutral or enemy relay captures it for its player.
  - Name: capture
    Trigger:
      Type: RANGE_BOX_AREA
      Range: 1
    Behaviours:
      - Src:
          ObjectRules: [ worker, scout, combat, marine, medic, tank ]
          Preconditions:
            - neq: [ src._playerId, dst._playerId ]
          Commands:
            - spawn: relay_owned
            - reward: 2
        Dst:
          ObjectRules: [ relay, relay_owned ]
          Commands:
            - remove: true

  # Internal: an owned relay pays its owner every 6 ticks.
  - Name: relay_income
    InputMapping:
      Internal: true
      Inputs:
        1: { VectorToDest: [ 0, 0 ] }
    Behaviours:
      - Src:
          ObjectRules: relay_owned
          Commands:
            - exec: { Action: relay_income, ActionId: 1, Delay: 6 }
            - incr: player_resources
        Dst:
          ObjectRules: relay_owned

  # Internal: a tank may move again.
  - Name: tank_ready
    InputMapping:
      Internal: true
      Inputs:
        1: { VectorToDest: [ 0, 0 ] }
    Behaviours:
      - Src:
          ObjectRules: tank
          Commands:
            - set: [ src.cooldown, 0 ]
        Dst:
          ObjectRules: tank

  # Internal: centre each player's camera on their base at the start of the game.
  - Name: init_camera
    InputMapping:
      Internal: true
      Inputs:
        1: { VectorToDest: [ 0, 0 ] }
    Behaviours:
      - Src:
          ObjectRules: base
          Commands:
            - set: [ cam_x, _x ]
            - set: [ cam_y, _y ]
        Dst:
          ObjectRules: base

  # Internal: the map-size marker (bottom-right corner of every map) records the camera bounds.
  - Name: init_map
    InputMapping:
      Internal: true
      Inputs:
        1: { VectorToDest: [ 0, 0 ] }
    Behaviours:
      - Src:
          ObjectRules: map_size
          Commands:
            - set: [ map_w, _x ]
            - incr: map_w
            - set: [ map_h, _y ]
            - incr: map_h
        Dst:
          ObjectRules: map_size

