Actions:
  - Name: face
    InputMapping:
      Internal: true
      Inputs:
        2: {Description: Face down, VectorToDest: [0, 0], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: monk, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: monk}

  # The monk walks freely through the garden. Stepping onto a pattern tile rakes it (walked, +1);
  # raked tiles, rocks and scenery block the way.
  - Name: move
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: monk, Commands: [{set_tile: meta.facing}, {mov: _dest}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: monk, Commands: [{set_tile: meta.facing}, {mov: _dest}]}
        Dst: {Object: ground, Commands: [{change_to: walked}, {reward: 1}]}
      - Src: {Object: monk, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [walked, zen_rock, water, tree, bush, rock, hedge, stone, tombstone, torch]}

