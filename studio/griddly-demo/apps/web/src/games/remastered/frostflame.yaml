Version: "0.1"
Environment:
  Name: Frost & Flame
  Description: |
    An elemental push puzzle on a frozen mountain. Ice is slippery: you and ice blocks slide until
    something stops you. Push an ice block into open water to freeze it into an ice bridge. Push a
    fire brazier onto ice to melt that tile into water (the fire goes out), into a beacon socket to
    light it. Fire melts snowmen, frost walls and ice blocks next to it.
    Win by lighting every beacon and reaching the shrine. Lose when too few braziers remain.
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Sprite2D   whole level (global observer)
  #   FollowCam  15x11 window that follows the avatar
  #   CloseUp    9x9 window that follows the avatar (also the agent's default view)
  Observers:
    Sprite2D:
      TileSize: 24
      BackgroundTile: remastered/frostflame-snow.png
      RotateAvatarImage: false
      TrackAvatar: false
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: remastered/frostflame-snow.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 15
      Height: 11
    CloseUp:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: remastered/frostflame-snow.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 9
      Height: 9
    Block2D:
      TileSize: 24
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: false
      Width: 9
      Height: 9
    AvatarObject: avatar
  Termination:
    Win:
      - and: [{eq: [socket:count, 0]}, {eq: [shrine:count, 0]}]
    Lose:
      - lt: [brazier:count, socket:count]
  Levels:
