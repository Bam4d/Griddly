      w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w
      w   .   ,   &   i   i   i   i   @   i   i   i   i   i   i   @   i   i   i   i   i   w
      w   _   _   &   i   i   i   i   i   i   i   i   i   i   @   i   i   i   i   i   i   w
      w   _   ,   &   i   i   i   i   @   @   i   i   i   i   i   i   i   i   i   i   i   w
      w   _   ,   &   i   i   i   i   i   i   i   i   i   i   i   i   i   i   i   i   i   w
      w   _   ,   &   i   i   i   i   i   i   @   i   i   i   i   i   i   i   i   i   #   w
      w   A   .   i   i   i   i   .   i   i   i   i   .   i   .   i   i   #   i   g   i   w
