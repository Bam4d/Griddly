      W   d   t   .   .   .   .   r   r   d   W   W   W   d   d   r   r   r   d   d   d   W
      W   d   d   d   o   d   O   r   r   d   W   W   W   d   d   r   r   d   r   r   d   W
      W   d   d   d   d   d   d   r   r   n   d   r   d   n   d   |   .   d   r   d   d   W
