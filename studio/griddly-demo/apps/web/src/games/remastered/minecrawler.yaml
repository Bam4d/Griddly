Actions:
  - Name: face
    InputMapping:
      Internal: true
      Inputs:
        2: {Description: Face down, VectorToDest: [0, 0], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: miner, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: miner}

  # Ore carts count themselves into the level goal at reset.
  - Name: count_goal
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Count, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: cart, Commands: [{incr: carts_needed}]}
        Dst: {Object: cart}

  # Gravity: every boulder checks the cell south of it. With room to fall it wobbles (falling=2) for 4
  # ticks, then rolls one cell per tick (falling=1) until blocked. A rolling boulder crushes the miner.
  - Name: fall
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: South, VectorToDest: [0, 1]}
    Behaviours:
      - Src:
          Object: boulder
          Preconditions: [{eq: [src.falling, 0]}]
          Commands: [{set: [falling, 2]}, {set_tile: 1}, {exec: {Action: fall, ActionId: 1, Delay: 4}}]
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, tunnel]}
      - Src:
          Object: boulder
          Preconditions: [{gte: [src.falling, 1]}]
          Commands: [{mov: _dest}, {set: [falling, 1]}, {set_tile: 1}, {exec: {Action: fall, ActionId: 1, Delay: 1}}]
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, tunnel]}
      - Src:
          Object: boulder
          Preconditions: [{eq: [src.falling, 1]}]
          Commands: [{exec: {Action: fall, ActionId: 1, Delay: 2}}]
        Dst: {Object: miner, Commands: [{remove: true}]}
      - Src:
          Object: boulder
          Preconditions: [{neq: [src.falling, 1]}]
          Commands: [{set: [falling, 0]}, {set_tile: 0}, {exec: {Action: fall, ActionId: 1, Delay: 2}}]
        Dst: {Object: miner}
      - Src: {Object: boulder, Commands: [{set: [falling, 0]}, {set_tile: 0}, {exec: {Action: fall, ActionId: 1, Delay: 2}}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, bedrock, dirt_block, rock_block, vein, boulder, lava, ore, timber, ration, cart, cart_full, lift, beam]}

  # Lava oozes into neighbouring dug tunnels (never onto natural cave floor) and burns the miner.
  - Name: flow
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: West, VectorToDest: [-1, 0]}
        2: {Description: North, VectorToDest: [0, -1]}
        3: {Description: East, VectorToDest: [1, 0]}
        4: {Description: South, VectorToDest: [0, 1]}
    Behaviours:
      - Src: {Object: lava, Commands: [{spawn: lava}, {exec: {Action: flow, Delay: 7, Randomize: true}}]}
        Dst: {Object: tunnel}
      - Src: {Object: lava, Commands: [{exec: {Action: flow, Delay: 7, Randomize: true}}]}
        Dst: {Object: miner, Commands: [{remove: true}]}
      - Src: {Object: lava, Commands: [{exec: {Action: flow, Delay: 7, Randomize: true}}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, bedrock, dirt_block, rock_block, vein, boulder, lava, ore, timber, ration, cart, cart_full, lift, beam, grass, moss, dirt, sand, bones, mushroom, skull, bridge, _empty]}

  # The miner walks up / down / left / right. Walking into loose ore, timber or a ration picks it up,
  # into an empty cart with 3 ore fills it, into the lift (all carts full) wins, and into a boulder
  # from the east or west shoves it.
  - Name: move
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: miner, Commands: [{set_tile: meta.facing}, {mov: _dest}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, tunnel, beam]}
      - Src: {Object: miner, Commands: [{set_tile: meta.facing}, {mov: _dest}, {incr: ore}, {reward: 1}]}
        Dst: {Object: ore, Commands: [{remove: true}]}
      - Src: {Object: miner, Commands: [{set_tile: meta.facing}, {mov: _dest}, {add: [timber, 2]}]}
        Dst: {Object: timber, Commands: [{remove: true}]}
      - Src: {Object: miner, Commands: [{set_tile: meta.facing}, {mov: _dest}, {add: [stamina, 15]}]}
        Dst: {Object: ration, Commands: [{remove: true}]}
      - Src:
          Object: miner
          Preconditions: [{gte: [src.ore, 3]}]
          Commands: [{set_tile: meta.facing}, {sub: [ore, 3]}, {reward: 5}]
        Dst: {Object: cart, Commands: [{decr: carts_needed}, {change_to: cart_full}]}
      - Src:
          Object: miner
          Preconditions: [{lte: [carts_needed, 0]}]
          Commands: [{set_tile: meta.facing}, {reward: 10}]
        Dst: {Object: lift, Commands: [{remove: true}]}
      - Src:
          Object: miner
          Preconditions: [{neq: [meta.facing, 0]}, {neq: [meta.facing, 2]}]
          Commands: [{set_tile: meta.facing}, {cascade: _dest}, {mov: _dest}]
        Dst: {Object: boulder}
      - Src: {Object: boulder, Commands: [{mov: _dest}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, tunnel]}
      - Src: {Object: miner, Commands: [{remove: true}]}
        Dst: {Object: lava}
      - Src: {Object: miner, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, bedrock, dirt_block, rock_block, vein, cart, cart_full, lift]}

  # Swing the pickaxe at the block in front (the UI sends the last move direction). Costs 1 stamina.
  - Name: dig
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src:
          Object: miner
          Preconditions: [{gte: [src.stamina, 1]}]
          Commands: [{set_tile: meta.facing}, {decr: stamina}, {spawn: tunnel}]
        Dst: {Object: dirt_block, Commands: [{remove: true}]}
      - Src:
          Object: miner
          Preconditions: [{gte: [src.stamina, 1]}, {gte: [dst.hp, 2]}]
          Commands: [{set_tile: meta.facing}, {decr: stamina}]
        Dst: {Object: rock_block, Commands: [{decr: hp}, {set_tile: 1}]}
      - Src:
          Object: miner
          Preconditions: [{gte: [src.stamina, 1]}, {lte: [dst.hp, 1]}]
          Commands: [{set_tile: meta.facing}, {decr: stamina}, {spawn: tunnel}]
        Dst: {Object: rock_block, Commands: [{remove: true}]}
      - Src:
          Object: miner
          Preconditions: [{gte: [src.stamina, 1]}]
          Commands: [{set_tile: meta.facing}, {decr: stamina}, {incr: ore}, {reward: 1}, {spawn: tunnel}]
        Dst: {Object: vein, Commands: [{remove: true}]}
      - Src: {Object: miner, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, bedrock, dirt_block, rock_block, vein, boulder, lava, ore, timber, ration, cart, cart_full, lift, beam, grass, moss, dirt, sand, bones, mushroom, skull, bridge, _empty, tunnel]}

  # Put a support beam into the free cell in front (costs 1 timber).
  - Name: build
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src:
          Object: miner
          Preconditions: [{gte: [src.timber, 1]}]
          Commands: [{set_tile: meta.facing}, {decr: timber}, {spawn: beam}]
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, tunnel]}
      - Src: {Object: miner, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, bedrock, dirt_block, rock_block, vein, boulder, lava, ore, timber, ration, cart, cart_full, lift, beam]}

