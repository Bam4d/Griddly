Version: "0.1"
Environment:
  Name: Deep Delve
  Description: |
    An isometric mine. Dig through dirt and rock (`dig`, two hits for rock), mine ore veins and fill
    every ore cart (3 ore each), then ride the lift out. Digging costs stamina (rations
    restore it). The mine slopes south: undermined boulders wobble, then roll and crush you. Lava
    oozes into dug tunnels. Timber support beams (`build`) stop both.
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Isometric  whole level, isometric (the main view of this game)
  #   IsoFollow  11x11 isometric window that follows the avatar
  #   Sprite2D   whole level, top-down
  #   FollowCam  15x11 top-down window that follows the avatar
  #   CloseUp    9x9 top-down window that follows the avatar (also the agent's default view)
  Observers:
    Isometric:
      TileSize: [32, 48]
      IsoTileHeight: 16
      IsoTileDepth: 4
      BackgroundTile: remastered/minecrawler-cave-iso.png
    IsoFollow:
      Type: ISOMETRIC
      TileSize: [32, 48]
      IsoTileHeight: 16
      IsoTileDepth: 4
      BackgroundTile: remastered/minecrawler-cave-iso.png
      TrackAvatar: true
      RotateWithAvatar: false
      Width: 11
      Height: 11
    Sprite2D:
      TileSize: 24
      BackgroundTile: oryx/oryx_fantasy/floor1-0.png
      RotateAvatarImage: false
      TrackAvatar: false
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: oryx/oryx_fantasy/floor1-0.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 15
      Height: 11
    CloseUp:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: oryx/oryx_fantasy/floor1-0.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 9
      Height: 9
    Block2D:
      TileSize: 24
  Variables:
    - Name: carts_needed
      InitialValue: 0
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: false
      Width: 9
      Height: 9
    AvatarObject: miner
  Termination:
    Win:
      - eq: [lift:count, 0]
    Lose:
      - eq: [miner:count, 0]
  Levels:
    # Shallow Seam | Dig through the rock seam, fill one ore cart, ride the lift.
