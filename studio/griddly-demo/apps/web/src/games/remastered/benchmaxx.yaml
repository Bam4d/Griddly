Version: "0.1"
Environment:
  Name: Bufo vs the Benchmaxxers
  Description: |
    Leaderboard trophies spawn benchmaxx bots that rush bufo. Throw mayo (directional) - it flies until
    it hits something. Splatted bots leave sticky mayo puddles that trap other bots for a while. Each
    trophy takes 3 hits; destroy them all to win. Red hunters path-find to bufo (A*), blue bots
    wander. GPUs give rapid fire, mayo jars heal. Bufo has 3 HP; every bot that touches it costs one.
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Sprite2D   whole level (global observer)
  #   FollowCam  15x11 window that follows the avatar
  #   CloseUp    9x9 window that follows the avatar (also the agent's default view)
  Observers:
    Sprite2D:
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      TrackAvatar: false
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 15
      Height: 11
    CloseUp:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 9
      Height: 9
    Block2D:
      TileSize: 24
  Variables:
    - Name: trophies
      InitialValue: 0
    - Name: alive
      InitialValue: 0
    - Name: rage
      InitialValue: 0
    - Name: ax
      InitialValue: 0
    - Name: ay
      InitialValue: 0
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: false
      Width: 9
      Height: 9
    AvatarObject: bufo
  Termination:
    Win:
      - lte: [trophies, 0]
    Lose:
      - eq: [bufo:count, 0]
