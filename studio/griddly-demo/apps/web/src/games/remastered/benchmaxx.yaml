Actions:
  - Name: face
    InputMapping:
      Internal: true
      Inputs:
        2: {Description: Face down, VectorToDest: [0, 0], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: bufo}

  # Every bot counts itself into the global `alive` when it appears (spawn caps read it).
  - Name: count_bot
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Count, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: [hunter, wanderer], Commands: [{incr: alive}]}
        Dst: {Object: [hunter, wanderer, mayo]}
      - Src: {Object: [trophy, trophy_gold, trophy_sota], Commands: [{incr: trophies}]}
        Dst: {Object: [trophy, trophy_gold, trophy_sota, mayo]}

  # Trophies hatch a bot into a random neighbouring floor cell, faster with every trophy destroyed
  # (global `rage`), and only while fewer than the cap of bots are alive.
  - Name: hatch
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: West, VectorToDest: [-1, 0]}
        2: {Description: North, VectorToDest: [0, -1]}
        3: {Description: East, VectorToDest: [1, 0]}
        4: {Description: South, VectorToDest: [0, 1]}
    Behaviours:
      - Src:
          Object: trophy
          Preconditions: [{lt: [alive, 8]}]
          Commands: [{spawn: wanderer}, {set: [rate, 34]}, {sub: [rate, rage]}, {sub: [rate, rage]}, {sub: [rate, rage]}, {exec: {Action: hatch, Delay: rate, Randomize: true}}]
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, cable]}
      - Src:
          Object: trophy
          Commands: [{exec: {Action: hatch, Delay: 9, Randomize: true}}]
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, wall, rack, plinth, trophy, trophy_gold, trophy_sota, hunter, wanderer, puddle, gpu, jar, mayo, bufo]}
      - Src:
          Object: trophy
          Preconditions: [{gte: [alive, 8]}]
          Commands: [{exec: {Action: hatch, Delay: 9, Randomize: true}}]
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, cable]}
      - Src:
          Object: trophy_gold
          Preconditions: [{lt: [alive, 9]}]
          Commands: [{spawn: hunter}, {set: [rate, 40]}, {sub: [rate, rage]}, {sub: [rate, rage]}, {sub: [rate, rage]}, {exec: {Action: hatch, Delay: rate, Randomize: true}}]
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, cable]}
      - Src:
          Object: trophy_gold
          Commands: [{exec: {Action: hatch, Delay: 9, Randomize: true}}]
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, wall, rack, plinth, trophy, trophy_gold, trophy_sota, hunter, wanderer, puddle, gpu, jar, mayo, bufo]}
      - Src:
          Object: trophy_gold
          Preconditions: [{gte: [alive, 9]}]
          Commands: [{exec: {Action: hatch, Delay: 9, Randomize: true}}]
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, cable]}
      - Src:
          Object: trophy_sota
          Preconditions: [{lt: [alive, 12]}]
          Commands: [{spawn: hunter}, {set: [rate, 22]}, {sub: [rate, rage]}, {sub: [rate, rage]}, {sub: [rate, rage]}, {exec: {Action: hatch, Delay: rate, Randomize: true}}]
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, cable]}
      - Src:
          Object: trophy_sota
          Commands: [{exec: {Action: hatch, Delay: 9, Randomize: true}}]
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, wall, rack, plinth, trophy, trophy_gold, trophy_sota, hunter, wanderer, puddle, gpu, jar, mayo, bufo]}
      - Src:
          Object: trophy_sota
          Preconditions: [{gte: [alive, 12]}]
          Commands: [{exec: {Action: hatch, Delay: 9, Randomize: true}}]
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, cable]}

  # Wanderers roam at random. Stepping into a mayo puddle sticks them for 12 ticks.
  - Name: roam
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: West, VectorToDest: [-1, 0]}
        2: {Description: North, VectorToDest: [0, -1]}
        3: {Description: East, VectorToDest: [1, 0]}
        4: {Description: South, VectorToDest: [0, 1]}
    Behaviours:
      - Src: {Object: wanderer, Commands: [{mov: _dest}, {set_tile: 0}, {exec: {Action: roam, Delay: 4, Randomize: true}}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, cable]}
      - Src: {Object: wanderer, Commands: [{mov: _dest}, {set_tile: 2}, {exec: {Action: roam, Delay: 14, Randomize: true}}]}
        Dst: {Object: puddle}
      - Src: {Object: wanderer, Commands: [{exec: {Action: roam, Delay: 4, Randomize: true}}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, wall, rack, plinth, trophy, trophy_gold, trophy_sota, hunter, wanderer, gpu, jar]}
      - Src: {Object: wanderer, Commands: [{decr: alive}, {change_to: puddle}]}
        Dst: {Object: mayo, Commands: [{remove: true}]}
      - Src: {Object: wanderer, Commands: [{decr: alive}, {change_to: puddle}]}
        Dst: {Object: bufo, Commands: [{decr: hp}, {if: {Conditions: {lte: [hp, 0]}, OnTrue: [{remove: true}]}}]}

  # Publishes bufo's position (globals ax / ay) for the hunters' range check.
  - Name: sync
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Sync, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: bufo, Commands: [{set: [ax, _x]}, {set: [ay, _y]}]}
        Dst: {Object: [bufo, mayo]}

  # Hunter think, every `pace` ticks (3, 2 once two trophies are down) plus `slow` after a puddle:
  # within 14 tiles of bufo take one A* step towards it (`hunt` with Search), else wander.
  - Name: stalk
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Think, VectorToDest: [0, 0]}
    Behaviours:
      - Src:
          Object: hunter
          Commands:
            - set: [rx, _x]
            - sub: [rx, ax]
            - if: {Conditions: {lt: [rx, 0]}, OnTrue: [{set: [d, 0]}, {sub: [d, rx]}], OnFalse: [{set: [d, rx]}]}
            - set: [ry, _y]
            - sub: [ry, ay]
            - if: {Conditions: {lt: [ry, 0]}, OnTrue: [{sub: [d, ry]}], OnFalse: [{add: [d, ry]}]}
            - set: [pace, 3]
            - if: {Conditions: {gte: [rage, 2]}, OnTrue: [{set: [pace, 2]}]}
            - add: [pace, slow]
            - set: [slow, 0]
            - exec: {Action: stalk, ActionId: 1, Delay: pace}
            - if:
                Conditions: {lte: [d, 14]}
                OnTrue: [{exec: {Action: hunt, Search: {TargetObjectName: bufo, ImpassableObjects: [water, tree, bush, rock, hedge, stone, tombstone, torch, wall, rack, plinth, trophy, trophy_gold, trophy_sota, hunter, wanderer, gpu, jar]}}}]
                OnFalse: [{exec: {Action: hunt, Randomize: true}}]
        Dst: {Object: [hunter, mayo]}

  # One hunter step (absolute 1 W, 2 N, 3 E, 4 S), chosen by A* or at random.
  - Name: hunt
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: West, VectorToDest: [-1, 0]}
        2: {Description: North, VectorToDest: [0, -1]}
        3: {Description: East, VectorToDest: [1, 0]}
        4: {Description: South, VectorToDest: [0, 1]}
    Behaviours:
      - Src: {Object: hunter, Commands: [{mov: _dest}, {set_tile: 0}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, cable]}
      - Src: {Object: hunter, Commands: [{mov: _dest}, {set_tile: 2}, {set: [slow, 9]}]}
        Dst: {Object: puddle}
      - Src: {Object: hunter, Commands: [{decr: alive}, {change_to: puddle}]}
        Dst: {Object: mayo, Commands: [{remove: true}]}
      - Src: {Object: hunter, Commands: [{decr: alive}, {change_to: puddle}]}
        Dst: {Object: bufo, Commands: [{decr: hp}, {if: {Conditions: {lte: [hp, 0]}, OnTrue: [{remove: true}]}}]}

  # The mayo blob flies one cell per tick in the throw direction until it hits something.
  - Name: fly
    InputMapping:
      Internal: true
    Behaviours:
      - Src: {Object: mayo, Commands: [{mov: _dest}, {exec: {Action: fly, Delay: 1}}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, cable, puddle, gpu, jar, bufo]}
      - Src: {Object: mayo, Commands: [{remove: true}]}
        Dst: {Object: [hunter, wanderer], Commands: [{decr: alive}, {change_to: puddle}]}
      - Src: {Object: mayo, Commands: [{remove: true}]}
        Dst: {Object: [trophy, trophy_gold, trophy_sota], Commands: [{decr: hp}, {incr: dmg}, {set_tile: dmg}, {if: {Conditions: {lte: [hp, 0]}, OnTrue: [{incr: rage}, {decr: trophies}, {remove: true}]}}]}
      - Src: {Object: mayo, Commands: [{remove: true}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, wall, rack, plinth, mayo]}

  # Re-arm after a throw; rapid fire (GPU) wears off.
  - Name: reload
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Reload, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: bufo, Commands: [{set: [ready, 1]}]}
        Dst: {Object: [bufo, mayo]}
  - Name: rapid_off
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Cool down, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: bufo, Commands: [{decr: rapid}]}
        Dst: {Object: [bufo, mayo]}

  # Bufo walks up / down / left / right; GPUs give rapid fire, mayo jars heal.
  - Name: move
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}, {mov: _dest}, {exec: {Action: sync, ActionId: 1}}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, cable, puddle, mayo]}
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}, {mov: _dest}, {exec: {Action: sync, ActionId: 1}}, {incr: rapid}, {reward: 1}, {exec: {Action: rapid_off, ActionId: 1, Delay: 40}}]}
        Dst: {Object: gpu, Commands: [{remove: true}]}
      - Src:
          Object: bufo
          Preconditions: [{lt: [src.hp, 3]}]
          Commands: [{set_tile: meta.facing}, {mov: _dest}, {exec: {Action: sync, ActionId: 1}}, {incr: hp}, {reward: 1}]
        Dst: {Object: jar, Commands: [{remove: true}]}
      - Src:
          Object: bufo
          Preconditions: [{gte: [src.hp, 3]}]
          Commands: [{set_tile: meta.facing}]
        Dst: {Object: jar}
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}, {decr: hp}, {if: {Conditions: {lte: [hp, 0]}, OnTrue: [{remove: true}]}}]}
        Dst: {Object: [hunter, wanderer], Commands: [{decr: alive}, {change_to: puddle}]}
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, wall, rack, plinth, trophy, trophy_gold, trophy_sota]}

  # Throw mayo in a direction (the UI sends the last move direction). Needs `ready`.
  - Name: throw
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src:
          Object: bufo
          Preconditions: [{eq: [src.ready, 1]}]
          Commands: [{set_tile: meta.facing}, {set: [ready, 0]}, {if: {Conditions: {gt: [rapid, 0]}, OnTrue: [{exec: {Action: reload, ActionId: 1, Delay: 1}}], OnFalse: [{exec: {Action: reload, ActionId: 1, Delay: 5}}]}}, {spawn: mayo}]
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, cable, puddle, gpu, jar]}
      - Src:
          Object: bufo
          Preconditions: [{eq: [src.ready, 1]}]
          Commands: [{set_tile: meta.facing}, {set: [ready, 0]}, {if: {Conditions: {gt: [rapid, 0]}, OnTrue: [{exec: {Action: reload, ActionId: 1, Delay: 1}}], OnFalse: [{exec: {Action: reload, ActionId: 1, Delay: 5}}]}}, {reward: 1}]
        Dst: {Object: [hunter, wanderer], Commands: [{decr: alive}, {change_to: puddle}]}
      - Src:
          Object: bufo
          Preconditions: [{eq: [src.ready, 1]}]
          Commands: [{set_tile: meta.facing}, {set: [ready, 0]}, {if: {Conditions: {gt: [rapid, 0]}, OnTrue: [{exec: {Action: reload, ActionId: 1, Delay: 1}}], OnFalse: [{exec: {Action: reload, ActionId: 1, Delay: 5}}]}}, {reward: 2}]
        Dst: {Object: [trophy, trophy_gold, trophy_sota], Commands: [{decr: hp}, {incr: dmg}, {set_tile: dmg}, {if: {Conditions: {lte: [hp, 0]}, OnTrue: [{incr: rage}, {decr: trophies}, {remove: true}]}}]}
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, wall, rack, plinth, mayo]}
      - Src:
          Object: bufo
          Preconditions: [{eq: [src.ready, 0]}]
          Commands: [{set_tile: meta.facing}]
        Dst: {Object: [grass, moss, dirt, sand, bones, mushroom, skull, bridge, cable, trophy, trophy_gold, trophy_sota, hunter, wanderer, puddle, gpu, jar]}
  - Name: rack_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 1}}
    Behaviours:
      - Src:
          Object: rack
          Commands:
            - set_tile: meta.tile
            - exec: {Action: rack_anim, ActionId: meta.next, Delay: 3}
        Dst: {Object: [rack]}

