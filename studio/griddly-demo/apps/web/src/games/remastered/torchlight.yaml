Version: "0.1"
Environment:
  Name: Torchlight
  Description: |
    Dark caverns seen over your shoulder (egocentric, rotating view). Your torch burns down every tick;
    walk into torch sconces and braziers to refuel. Collect every crystal. Bats flee your flame;
    cave spiders only move while you are not looking at them.
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Sprite2D   whole level (global observer); oriented objects are drawn rotated
  #   EgoView    9x9 first-person window: follows AND rotates with the avatar (forward = up), avatar 2 rows below centre
  #   EgoClose   7x7 first-person window
  #   FollowCam  15x11 window that follows the avatar without rotating
  # The agent's default observation (Player.Observer) is the 9x9 egocentric window.
  Observers:
    Sprite2D:
      TileSize: 24
      BackgroundTile: oryx/oryx_fantasy/floor1-0.png
      RotateAvatarImage: true
      TrackAvatar: false
    EgoView:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: oryx/oryx_fantasy/floor1-0.png
      TrackAvatar: true
      RotateWithAvatar: true
      RotateAvatarImage: true
      Width: 9
      Height: 9
      OffsetY: 2
    EgoClose:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: oryx/oryx_fantasy/floor1-0.png
      TrackAvatar: true
      RotateWithAvatar: true
      RotateAvatarImage: true
      Width: 7
      Height: 7
      OffsetY: 0
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: oryx/oryx_fantasy/floor1-0.png
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: true
      Width: 15
      Height: 11
      OffsetY: 0
    Block2D:
      TileSize: 24
  Variables:
    - Name: ax
      InitialValue: 0
    - Name: ay
      InitialValue: 0
    - Name: adx
      InitialValue: 0
    - Name: ady
      InitialValue: 0
    - Name: fuel
      InitialValue: 80
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: true
      RotateAvatarImage: true
      Width: 9
      Height: 9
      OffsetY: 2
    AvatarObject: avatar
  Termination:
    Win:
      - eq: [crystal:count, 0]
    Lose:
      - eq: [avatar:count, 0]
      - lte: [fuel, 0]
