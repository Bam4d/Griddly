Version: "0.1"
Environment:
  Name: Cook Me Pasta Remastered
  Description: |
    Help the chef cook pasta! Push boiling water into raw pasta to cook it, push tomato into tuna for
    the sauce, then push the cooked pasta and the sauce together to serve the meal. Mixing a pasta
    ingredient with a sauce ingredient ruins the dish. Keys open locked doors (one key per lock).
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Sprite2D   whole level (global observer)
  #   FollowCam  15x11 window that follows the avatar
  #   CloseUp    9x9 window that follows the avatar (also the agent's default view)
  Observers:
    Sprite2D:
      TileSize: 24
      BackgroundTile: gvgai/newset/floor6.png
      RotateAvatarImage: false
      TrackAvatar: false
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: gvgai/newset/floor6.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 15
      Height: 11
    CloseUp:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: gvgai/newset/floor6.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 9
      Height: 9
    Block2D:
      TileSize: 24
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: false
      Width: 9
      Height: 9
    AvatarObject: chef
  Termination:
    Win:
      - eq: [complete_meal:count, 1]
    Lose:
      - eq: [wrong_place:count, 1]
