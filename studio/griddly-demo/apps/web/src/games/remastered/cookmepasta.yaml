Actions:
  - Name: face
    InputMapping:
      Internal: true
      Inputs:
        2: {Description: Face down, VectorToDest: [0, 0], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: chef, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: chef}

  # The chef walks and pushes ingredients (cascade). Ingredients slide over floor and ground
  # decoration; pushed into each other they combine (or ruin the dish).
  - Name: move
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: chef, Commands: [{set_tile: meta.facing}, {mov: _dest}]}
        Dst: {Object: [boiling_water, raw_pasta, tomato, tuna, cooked_pasta, pasta_sauce], Commands: [{cascade: _dest}]}
      - Src: {Object: chef, Commands: [{set_tile: meta.facing}, {mov: _dest}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: [boiling_water, raw_pasta, tomato, tuna, cooked_pasta, pasta_sauce], Commands: [{mov: _dest}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      # Right combinations
      - Src: {Object: boiling_water, Commands: [{remove: true}, {reward: 4}]}
        Dst: {Object: raw_pasta, Commands: [{change_to: cooked_pasta}]}
      - Src: {Object: raw_pasta, Commands: [{remove: true}, {reward: 4}]}
        Dst: {Object: boiling_water, Commands: [{change_to: cooked_pasta}]}
      - Src: {Object: tomato, Commands: [{remove: true}, {reward: 4}]}
        Dst: {Object: tuna, Commands: [{change_to: pasta_sauce}]}
      - Src: {Object: tuna, Commands: [{remove: true}, {reward: 4}]}
        Dst: {Object: tomato, Commands: [{change_to: pasta_sauce}]}
      - Src: {Object: cooked_pasta, Commands: [{remove: true}, {reward: 17}]}
        Dst: {Object: pasta_sauce, Commands: [{change_to: complete_meal}]}
      - Src: {Object: pasta_sauce, Commands: [{remove: true}, {reward: 17}]}
        Dst: {Object: cooked_pasta, Commands: [{change_to: complete_meal}]}
      # Wrong combinations ruin the dish
      - Src: {Object: [raw_pasta, boiling_water], Commands: [{remove: true}, {reward: -1}]}
        Dst: {Object: [tuna, tomato, pasta_sauce], Commands: [{change_to: wrong_place}]}
      - Src: {Object: [tuna, tomato, pasta_sauce], Commands: [{remove: true}, {reward: -1}]}
        Dst: {Object: [boiling_water, raw_pasta], Commands: [{change_to: wrong_place}]}
      # Keys and locks: a key opens one lock
      - Src: {Object: chef, Commands: [{set_tile: meta.facing}, {mov: _dest}, {incr: has_key}, {reward: 1}]}
        Dst: {Object: key, Commands: [{remove: true}]}
      - Src:
          Object: chef
          Preconditions: [{gte: [src.has_key, 1]}]
          Commands: [{set_tile: meta.facing}, {mov: _dest}, {decr: has_key}]
        Dst: {Object: lock, Commands: [{remove: true}]}
      - Src: {Object: chef, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [wall, table, barrel, lock, complete_meal, wrong_place, water, tree, bush, rock, hedge, stone, tombstone, torch]}

