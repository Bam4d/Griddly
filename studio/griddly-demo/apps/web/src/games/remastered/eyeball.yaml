Actions:
  - Name: face
    InputMapping:
      Internal: true
      Inputs:
        2: {Description: Face down, VectorToDest: [0, 0], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: eyeball, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: eyeball}

  # The eyeball rolls up / down / left / right; bumping the eye drops picks them up.
  - Name: move
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: eyeball, Commands: [{set_tile: meta.facing}, {mov: _dest}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: eyeball, Commands: [{set_tile: meta.facing}, {reward: 1}]}
        Dst: {Object: eye_drops, Commands: [{remove: true}]}
      - Src: {Object: eyeball, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [wall, water, tree, bush, rock, hedge, stone, tombstone, torch]}

