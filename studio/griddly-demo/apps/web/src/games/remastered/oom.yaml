Actions:
  - Name: face
    InputMapping:
      Internal: true
      Inputs:
        2: {Description: Face down, VectorToDest: [0, 0], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: bufo}

  # Jobs grow: every job cell tries each neighbour every 5 ticks (colour k on ticks = k mod 5) and fills
  # free VRAM; reaching the OOM line is an out-of-memory crash. Growth stops 1 tick before the job ends.
  - Name: grow
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: West, VectorToDest: [-1, 0]}
        2: {Description: North, VectorToDest: [0, -1]}
        3: {Description: East, VectorToDest: [1, 0]}
        4: {Description: South, VectorToDest: [0, 1]}
    Behaviours:
      - Src: {Object: [job1, core1], Preconditions: [{lt: [_steps, 59]}], Commands: [{exec: {Action: grow, Delay: 5}}, {spawn: job1}]}
        Dst: {Object: [_empty, cable]}
      - Src: {Object: [job1, core1], Preconditions: [{lt: [_steps, 59]}], Commands: [{exec: {Action: grow, Delay: 5}}, {incr: oom}]}
        Dst: {Object: oomline, Commands: [{change_to: oomhit}]}
      - Src: {Object: [job1, core1], Preconditions: [{lt: [_steps, 59]}], Commands: [{exec: {Action: grow, Delay: 5}}]}
        Dst: {Object: [wall, rack, checkpoint, floppy, oomhit, job1, job2, job3, job4, core1, core2, core3, core4, bufo]}
      - Src: {Object: [job2, core2], Preconditions: [{lt: [_steps, 99]}], Commands: [{exec: {Action: grow, Delay: 5}}, {spawn: job2}]}
        Dst: {Object: [_empty, cable]}
      - Src: {Object: [job2, core2], Preconditions: [{lt: [_steps, 99]}], Commands: [{exec: {Action: grow, Delay: 5}}, {incr: oom}]}
        Dst: {Object: oomline, Commands: [{change_to: oomhit}]}
      - Src: {Object: [job2, core2], Preconditions: [{lt: [_steps, 99]}], Commands: [{exec: {Action: grow, Delay: 5}}]}
        Dst: {Object: [wall, rack, checkpoint, floppy, oomhit, job1, job2, job3, job4, core1, core2, core3, core4, bufo]}
      - Src: {Object: [job3, core3], Preconditions: [{lt: [_steps, 139]}], Commands: [{exec: {Action: grow, Delay: 5}}, {spawn: job3}]}
        Dst: {Object: [_empty, cable]}
      - Src: {Object: [job3, core3], Preconditions: [{lt: [_steps, 139]}], Commands: [{exec: {Action: grow, Delay: 5}}, {incr: oom}]}
        Dst: {Object: oomline, Commands: [{change_to: oomhit}]}
      - Src: {Object: [job3, core3], Preconditions: [{lt: [_steps, 139]}], Commands: [{exec: {Action: grow, Delay: 5}}]}
        Dst: {Object: [wall, rack, checkpoint, floppy, oomhit, job1, job2, job3, job4, core1, core2, core3, core4, bufo]}
      - Src: {Object: [job4, core4], Preconditions: [{lt: [_steps, 179]}], Commands: [{exec: {Action: grow, Delay: 5}}, {spawn: job4}]}
        Dst: {Object: [_empty, cable]}
      - Src: {Object: [job4, core4], Preconditions: [{lt: [_steps, 179]}], Commands: [{exec: {Action: grow, Delay: 5}}, {incr: oom}]}
        Dst: {Object: oomline, Commands: [{change_to: oomhit}]}
      - Src: {Object: [job4, core4], Preconditions: [{lt: [_steps, 179]}], Commands: [{exec: {Action: grow, Delay: 5}}]}
        Dst: {Object: [wall, rack, checkpoint, floppy, oomhit, job1, job2, job3, job4, core1, core2, core3, core4, bufo]}

  # A new job cell schedules its own end: the job's lifetime is absolute (all its cells end together).
  - Name: born
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Born, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: job1, Commands: [{set: [ttl, 60]}, {sub: [ttl, _steps]}, {exec: {Action: finish, ActionId: 1, Delay: ttl}}]}
        Dst: {Object: job1}
      - Src: {Object: job2, Commands: [{set: [ttl, 100]}, {sub: [ttl, _steps]}, {exec: {Action: finish, ActionId: 1, Delay: ttl}}]}
        Dst: {Object: job2}
      - Src: {Object: job3, Commands: [{set: [ttl, 140]}, {sub: [ttl, _steps]}, {exec: {Action: finish, ActionId: 1, Delay: ttl}}]}
        Dst: {Object: job3}
      - Src: {Object: job4, Commands: [{set: [ttl, 180]}, {sub: [ttl, _steps]}, {exec: {Action: finish, ActionId: 1, Delay: ttl}}]}
        Dst: {Object: job4}

  - Name: finish
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Finish, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: core1, Commands: [{decr: cores}, {remove: true}]}
        Dst: {Object: core1}
      - Src: {Object: job1, Commands: [{remove: true}]}
        Dst: {Object: job1}
      - Src: {Object: core2, Commands: [{decr: cores}, {remove: true}]}
        Dst: {Object: core2}
      - Src: {Object: job2, Commands: [{remove: true}]}
        Dst: {Object: job2}
      - Src: {Object: core3, Commands: [{decr: cores}, {remove: true}]}
        Dst: {Object: core3}
      - Src: {Object: job3, Commands: [{remove: true}]}
        Dst: {Object: job3}
      - Src: {Object: core4, Commands: [{decr: cores}, {remove: true}]}
        Dst: {Object: core4}
      - Src: {Object: job4, Commands: [{remove: true}]}
        Dst: {Object: job4}

  - Name: count_core
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Count, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: [core1, core2, core3, core4], Commands: [{incr: cores}]}
        Dst: {Object: [core1, core2, core3, core4]}

  # Bufo walks on free VRAM and the OOM line; walking into a floppy stack picks up a checkpoint.
  - Name: move
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}, {mov: _dest}]}
        Dst: {Object: [_empty, cable, oomline]}
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}, {incr: ckpts}, {mov: _dest}]}
        Dst: {Object: floppy, Commands: [{remove: true}]}
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [wall, rack, checkpoint, oomhit, job1, job2, job3, job4, core1, core2, core3, core4]}

  # kill -9: free one job cell (cores can't be killed).
  - Name: kill
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}, {reward: 1}]}
        Dst: {Object: [job1, job2, job3, job4], Commands: [{remove: true}]}
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [cable, oomline, wall, rack, checkpoint, floppy, oomhit, core1, core2, core3, core4, _empty]}

  # Drop a checkpoint on free VRAM: jobs can't grow through it.
  - Name: checkpoint
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src:
          Object: bufo
          Preconditions: [{gt: [src.ckpts, 0]}]
          Commands: [{set_tile: meta.facing}, {decr: ckpts}, {spawn: checkpoint}]
        Dst: {Object: [_empty, cable]}
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [oomline, wall, rack, checkpoint, floppy, oomhit, job1, job2, job3, job4, core1, core2, core3, core4]}

  - Name: nap
    InputMapping:
      Inputs:
        1: {Description: Nap, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: bufo, Commands: [{nop: true}]}
        Dst: {Object: bufo}

Objects:
  - Name: wall
    MapCharacter: "W"
    Z: 1
    Observers:
      Sprite2D: &wall_sprite
        - TilingMode: WALL_16
          Image:
            - memes/dcwall-0.png
            - memes/dcwall-1.png
            - memes/dcwall-2.png
            - memes/dcwall-3.png
            - memes/dcwall-4.png
            - memes/dcwall-5.png
            - memes/dcwall-6.png
            - memes/dcwall-7.png
            - memes/dcwall-8.png
            - memes/dcwall-9.png
            - memes/dcwall-10.png
            - memes/dcwall-11.png
            - memes/dcwall-12.png
            - memes/dcwall-13.png
            - memes/dcwall-14.png
            - memes/dcwall-15.png
