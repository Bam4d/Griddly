Version: "0.1"
Environment:
  Name: OOM Killer
  Description: |
    VRAM is mayo and the training jobs are hungry. Every job grows into free memory every 5 ticks.
    Bufo, the scheduler, kills job cells (cores are unkillable) and drops checkpoints (walls) to
    contain them. Jobs finish after their lifetime (orange 60, violet 100, teal 140,
    pink 180 ticks). Win when every job has finished; lose if any job reaches the red OOM line.
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Sprite2D   whole level (global observer)
  #   FollowCam  15x11 window that follows the avatar
  #   CloseUp    9x9 window that follows the avatar (also the agent's default view)
  Observers:
    Sprite2D:
      TileSize: 24
      BackgroundTile: memes/oom-vram.png
      RotateAvatarImage: false
      TrackAvatar: false
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: memes/oom-vram.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 15
      Height: 11
    CloseUp:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: memes/oom-vram.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 9
      Height: 9
    Block2D:
      TileSize: 24
  Variables:
    - Name: cores
      InitialValue: 0
    - Name: oom
      InitialValue: 0
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: false
      Width: 9
      Height: 9
    AvatarObject: bufo
  Termination:
    Win:
      - eq: [cores, 0]
    Lose:
      - gt: [oom, 0]
  Levels:
    # Hello World Job | One job is growing toward the OOM line. Grab a floppy and checkpoint the corridor (E).
    - |
      W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W
      W   .   .   .   .   .   .   .   .   W   .   .   .   .   .   .   .   .   .   W
      W   .   .   .   .   1   .   .   .   W   .   .   .   F   .   .   .   .   .   W
      W   .   .   .   .   .   .   .   .   W   .   .   .   .   .   .   .   .   .   W
      W   .   .   .   .   .   .   .   .   W   .   .   .   .   A   .   .   .   .   W
      W   W   W   W   W   .   W   W   W   W   .   .   .   .   .   .   .   .   .   W
      W   .   .   .   .   x   .   .   .   .   .   .   .   .   .   .   .   .   .   W
      W   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   W
      W   L   L   L   L   L   L   L   L   L   L   L   L   L   L   L   L   L   L   W
      W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W
    # kill -9 | No floppies. Block the 2-wide door with your body and kill -9 (Space) whatever squeezes past.
    - |
      W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W
      W   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   W
      W   .   .   .   .   .   .   .   .   .   2   .   .   .   .   .   .   .   .   .   .   W
      W   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   W
      W   W   W   W   W   W   W   W   W   .   .   W   W   W   W   W   W   W   W   W   W   W
      W   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   .   W
      W   .   .   A   .   .   .   .   .   .   .   x   .   .   .   .   .   .   .   .   .   W
      W   .   .   .   .   .   .   .   .   .   .   x   .   .   .   .   .   .   .   .   .   W
      W   L   L   L   L   L   L   L   L   L   L   L   L   L   L   L   L   L   L   L   L   W
      W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W
    # Checkpoint Every Epoch | Three jobs, three doors, three floppies. Seal the doors before the jobs get there.
    - |
