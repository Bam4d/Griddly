  - Name: oomline
    MapCharacter: "L"
    Z: 0
    Observers:
      Sprite2D: &oomline_sprite
        - Image: memes/oom-line.png
      FollowCam: *oomline_sprite
      CloseUp: *oomline_sprite
      Block2D:
        - Shape: square
          Color: [0.9, 0.1, 0.1]
          Scale: 0.9
  - Name: oomhit
    Z: 1
    Observers:
      Sprite2D: &oomhit_sprite
        - Image: memes/oom-hit.png
      FollowCam: *oomhit_sprite
      CloseUp: *oomhit_sprite
      Block2D:
        - Shape: circle
          Color: [1.0, 0.3, 0.0]
          Scale: 1.0
  - Name: floppy
    MapCharacter: "F"
    Z: 1
    Observers:
      Sprite2D: &floppy_sprite
        - Image: memes/oom-floppies.png
      FollowCam: *floppy_sprite
      CloseUp: *floppy_sprite
      Block2D:
        - Shape: square
          Color: [0.2, 0.3, 0.8]
          Scale: 0.7
  - Name: checkpoint
    MapCharacter: "K"
    Z: 1
    Observers:
      Sprite2D: &checkpoint_sprite
        - Image: memes/oom-checkpoint.png
      FollowCam: *checkpoint_sprite
      CloseUp: *checkpoint_sprite
      Block2D:
