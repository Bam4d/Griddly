    # OOM Killer | Four jobs, OOM lines above and below, four floppies. Survive until every job finishes.
    - |
      W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W   W
