Version: "0.1"
Environment:
  Name: Zelda Remastered
  Description: |
    Grab keys, unlock doors and reach the exit door with a key in hand. Spiders and bats wander at
    random and kill on contact; swing your sword (attack) at the cell in front of you to slay them (hunters take 2 strikes).
    Nests hatch more spiders; red-eyed hunters track you down with pathfinding and brood nests hatch
    more of them. Walls, water, trees, bushes, tombstones and torches block the way.
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Sprite2D   whole level (global observer)
  #   FollowCam  15x11 window that follows the avatar
  #   CloseUp    9x9 window that follows the avatar (also the agent's default view)
  Observers:
    Sprite2D:
      TileSize: 24
      BackgroundTile: gvgai/newset/floor2.png
      RotateAvatarImage: false
      TrackAvatar: false
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: gvgai/newset/floor2.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 15
      Height: 11
    CloseUp:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: gvgai/newset/floor2.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 9
      Height: 9
    Block2D:
      TileSize: 24
  Variables:
    - Name: ax
      InitialValue: 0
    - Name: ay
      InitialValue: 0
    - Name: opened
      InitialValue: 0
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: false
      Width: 9
      Height: 9
    AvatarObject: avatar
  Termination:
    Win:
      - eq: [exit:count, 0]
    Lose:
      - eq: [avatar:count, 0]
  Levels:
