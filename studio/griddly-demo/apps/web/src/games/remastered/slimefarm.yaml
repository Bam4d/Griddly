Version: "0.1"
Environment:
  Name: Slime Ranch
  Description: |
    An isometric slime ranch. Push two slimes of the same colour and size together to merge them
    into a bigger slime; two jellies make a King. Harvest crops and `feed` slimes to grow them, or
    feed a jelly for a gem. Jellies and Kings also produce gems over time. Fill every gem order
    pedestal and breed as many Kings as there are thrones. Beasts steal the food you carry.
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Isometric  whole level, isometric (the main view of this game)
  #   IsoFollow  11x11 isometric window that follows the avatar
  #   Sprite2D   whole level, top-down
  #   FollowCam  15x11 top-down window that follows the avatar
  #   CloseUp    9x9 top-down window that follows the avatar (also the agent's default view)
  Observers:
    Isometric:
      TileSize: [32, 48]
      IsoTileHeight: 16
      IsoTileDepth: 4
      BackgroundTile: oryx/oryx_iso_dungeon/grass-1.png
    IsoFollow:
      Type: ISOMETRIC
      TileSize: [32, 48]
      IsoTileHeight: 16
      IsoTileDepth: 4
      BackgroundTile: oryx/oryx_iso_dungeon/grass-1.png
      TrackAvatar: true
      RotateWithAvatar: false
      Width: 11
      Height: 11
    Sprite2D:
      TileSize: 24
      BackgroundTile: gvgai/oryx/grass_15.png
      RotateAvatarImage: false
      TrackAvatar: false
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: gvgai/oryx/grass_15.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 15
      Height: 11
    CloseUp:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: gvgai/oryx/grass_15.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 9
      Height: 9
    Block2D:
      TileSize: 24
  Variables:
    - Name: gems_needed
      InitialValue: 0
    - Name: kings_needed
      InitialValue: 0
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: false
      Width: 9
      Height: 9
    AvatarObject: rancher
  Termination:
    Win:
      - and: [{lte: [gems_needed, 0]}, {lte: [kings_needed, 0]}]
  Levels:
