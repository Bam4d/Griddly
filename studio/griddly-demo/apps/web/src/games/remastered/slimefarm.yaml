Actions:
  - Name: face
    InputMapping:
      Internal: true
      Inputs:
        2: {Description: Face down, VectorToDest: [0, 0], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: rancher, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: rancher}

  # Order pedestals and thrones count themselves into the level's goals at reset.
  - Name: count_goal
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Count, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: pedestal, Commands: [{incr: gems_needed}]}
        Dst: {Object: pedestal}
      - Src: {Object: throne, Commands: [{incr: kings_needed}]}
        Dst: {Object: throne}

  # Crops ripen (render tile 1) some time after being harvested.
  - Name: ripen
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: Ripen, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: crop, Commands: [{set: [ripe, 1]}, {set_tile: 1}]}
        Dst: {Object: crop}

  # Slimes wander slowly (idle inputs make half the tries a pause) and never step onto gates.
  - Name: wander
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: West, VectorToDest: [-1, 0]}
        2: {Description: North, VectorToDest: [0, -1]}
        3: {Description: East, VectorToDest: [1, 0]}
        4: {Description: South, VectorToDest: [0, 1]}
        5: {Description: Rest, VectorToDest: [0, 0]}
        6: {Description: Rest, VectorToDest: [0, 0]}
        7: {Description: Rest, VectorToDest: [0, 0]}
        8: {Description: Rest, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: [slime_green, slime_blue, slime_pink], Commands: [{mov: _dest}, {exec: {Action: wander, Delay: 8, Randomize: true}}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: [slime_green, slime_blue, slime_pink], Commands: [{exec: {Action: wander, Delay: 8, Randomize: true}}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, fence, gate, crate, crop, pedestal, pedestal_full, throne, gem, king, beast, rancher, slime_green, slime_blue, slime_pink]}

  # Beasts prowl outside the pens; bumping into the rancher they gobble its food.
  - Name: prowl
    InputMapping:
      Internal: true
    Behaviours:
      - Src: {Object: beast, Commands: [{mov: _dest}, {exec: {Action: prowl, Delay: 3, Randomize: true}}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: beast, Commands: [{exec: {Action: prowl, Delay: 3, Randomize: true}}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, fence, gate, crate, crop, pedestal, pedestal_full, throne, gem, king, beast, slime_green, slime_blue, slime_pink]}
      - Src: {Object: beast, Commands: [{exec: {Action: prowl, Delay: 3, Randomize: true}}]}
        Dst: {Object: rancher, Commands: [{set: [food, 0]}]}

  # Jellies (tier 2) produce a gem every ~30 ticks into a random free neighbour, Kings every ~12.
  - Name: produce
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: West, VectorToDest: [-1, 0]}
        2: {Description: North, VectorToDest: [0, -1]}
        3: {Description: East, VectorToDest: [1, 0]}
        4: {Description: South, VectorToDest: [0, 1]}
    Behaviours:
      - Src:
          Object: [slime_green, slime_blue, slime_pink]
          Preconditions: [{eq: [src.tier, 2]}]
          Commands: [{spawn: gem}, {exec: {Action: produce, Delay: 30, Randomize: true}}]
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src:
          Object: [slime_green, slime_blue, slime_pink]
          Preconditions: [{eq: [src.tier, 2]}]
          Commands: [{exec: {Action: produce, Delay: 4, Randomize: true}}]
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, fence, gate, crate, crop, pedestal, pedestal_full, throne, gem, king, beast, rancher, slime_green, slime_blue, slime_pink]}
      - Src:
          Object: [slime_green, slime_blue, slime_pink]
          Preconditions: [{lt: [src.tier, 2]}]
          Commands: [{exec: {Action: produce, Delay: 30, Randomize: true}}]
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, water, tree, bush, rock, hedge, stone, tombstone, torch, fence, gate, crate, crop, pedestal, pedestal_full, throne, gem, king, beast, rancher, slime_green, slime_blue, slime_pink]}
      - Src: {Object: king, Commands: [{spawn: gem}, {exec: {Action: produce, Delay: 12, Randomize: true}}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: king, Commands: [{exec: {Action: produce, Delay: 3, Randomize: true}}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, fence, gate, crate, crop, pedestal, pedestal_full, throne, gem, king, beast, rancher, slime_green, slime_blue, slime_pink]}

  # The rancher walks up / down / left / right. Walking into a slime pushes it (merging it into a
  # same-colour same-tier slime behind it), into a ripe crop harvests it, into a gem picks it up and
  # into an empty pedestal (carrying a gem) fills the order.
  - Name: move
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: rancher, Commands: [{set_tile: meta.facing}, {mov: _dest}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, gate]}
      - Src: {Object: rancher, Commands: [{set_tile: meta.facing}, {mov: _dest}, {incr: gems}, {reward: 1}]}
        Dst: {Object: gem, Commands: [{remove: true}]}
      - Src: {Object: rancher, Commands: [{set_tile: meta.facing}, {cascade: _dest}, {mov: _dest}]}
        Dst: {Object: [slime_green, slime_blue, slime_pink]}
      - Src:
          Object: rancher
          Preconditions: [{eq: [dst.ripe, 1]}, {lt: [src.food, 3]}]
          Commands: [{set_tile: meta.facing}, {incr: food}, {reward: 1}]
        Dst: {Object: crop, Commands: [{set: [ripe, 0]}, {set_tile: 0}, {exec: {Action: ripen, ActionId: 1, Delay: 40}}]}
      - Src:
          Object: rancher
