  # Give one food to the slime in front (directional; the UI sends the last move direction).
  - Name: feed
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src:
          Object: rancher
          Preconditions: [{gte: [src.food, 1]}, {lt: [dst.tier, 2]}]
          Commands: [{set_tile: meta.facing}, {decr: food}, {reward: 1}]
        Dst: {Object: [slime_green, slime_blue, slime_pink], Commands: [{incr: tier}, {set_tile: tier}]}
      - Src:
          Object: rancher
          Preconditions: [{gte: [src.food, 1]}, {eq: [dst.tier, 2]}]
          Commands: [{set_tile: meta.facing}, {decr: food}, {incr: gems}, {reward: 1}]
        Dst: {Object: [slime_green, slime_blue, slime_pink]}
      - Src:
          Object: rancher
          Preconditions: [{gte: [src.food, 1]}]
          Commands: [{set_tile: meta.facing}, {decr: food}, {add: [gems, 2]}, {reward: 2}]
        Dst: {Object: king}
      - Src: {Object: rancher, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge, water, tree, bush, rock, hedge, stone, tombstone, torch, fence, gate, crate, crop, pedestal, pedestal_full, throne, gem, king, beast, slime_green, slime_blue, slime_pink]}

