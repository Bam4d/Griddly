Actions:
  - Name: face
    InputMapping:
      Internal: true
      Inputs:
        2: {Description: Face down, VectorToDest: [0, 0], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: catcher, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: catcher}

  # Butterflies flutter at random (absolute steps); flying into the catcher gets them caught.
  - Name: butterfly_move
    InputMapping:
      Internal: true
    Behaviours:
      - Src: {Object: butterfly, Commands: [{mov: _dest}, {exec: {Action: butterfly_move, Delay: 3, Randomize: true}}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: butterfly, Commands: [{exec: {Action: butterfly_move, Delay: 3, Randomize: true}}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, cocoon, butterfly, spider]}
      - Src: {Object: butterfly, Commands: [{remove: true}]}
        Dst: {Object: catcher, Commands: [{reward: 1}]}

  # Spiders wander (rotate or step forwards at random), eat butterflies and kill the catcher.
  - Name: spider_move
    InputMapping:
      Inputs:
        1: {Description: Rotate left, OrientationVector: [-1, 0]}
        2: {Description: Move forwards, OrientationVector: [0, -1], VectorToDest: [0, -1]}
        3: {Description: Rotate right, OrientationVector: [1, 0]}
      Relative: true
      Internal: true
    Behaviours:
      - Src: {Object: spider, Commands: [{rot: _dir}, {exec: {Action: spider_move, Delay: 3, Randomize: true}}]}
        Dst: {Object: spider}
      - Src: {Object: spider, Commands: [{mov: _dest}, {exec: {Action: spider_move, Delay: 3, Randomize: true}}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: spider, Commands: [{exec: {Action: spider_move, Delay: 3, Randomize: true}}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, cocoon]}
      - Src: {Object: spider, Commands: [{mov: _dest}, {exec: {Action: spider_move, Delay: 3, Randomize: true}}]}
        Dst: {Object: butterfly, Commands: [{remove: true}]}
      - Src: {Object: spider}
        Dst: {Object: catcher, Commands: [{remove: true}, {reward: -1}]}

  # Each cocoon hatches one butterfly into a free neighbouring cell at a random time.
  - Name: hatch
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: West, VectorToDest: [-1, 0]}
        2: {Description: North, VectorToDest: [0, -1]}
        3: {Description: East, VectorToDest: [1, 0]}
        4: {Description: South, VectorToDest: [0, 1]}
        5: {Description: Wait, VectorToDest: [0, 0]}
        6: {Description: Wait, VectorToDest: [0, 0]}
        7: {Description: Wait, VectorToDest: [0, 0]}
        8: {Description: Wait, VectorToDest: [0, 0]}
        9: {Description: Wait, VectorToDest: [0, 0]}
        10: {Description: Wait, VectorToDest: [0, 0]}
        11: {Description: Wait, VectorToDest: [0, 0]}
        12: {Description: Wait, VectorToDest: [0, 0]}
        13: {Description: Wait, VectorToDest: [0, 0]}
        14: {Description: Wait, VectorToDest: [0, 0]}
        15: {Description: Wait, VectorToDest: [0, 0]}
        16: {Description: Wait, VectorToDest: [0, 0]}
        17: {Description: Wait, VectorToDest: [0, 0]}
        18: {Description: Wait, VectorToDest: [0, 0]}
        19: {Description: Wait, VectorToDest: [0, 0]}
        20: {Description: Wait, VectorToDest: [0, 0]}
    Behaviours:
      - Src:
          Object: cocoon
          Commands: [{spawn: butterfly}, {remove: true}]
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src:
          Object: cocoon
          Commands: [{exec: {Action: hatch, Delay: 10, Randomize: true}}]
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, cocoon, butterfly, spider, catcher]}

  # The catcher runs up / down / left / right; running into a butterfly catches it.
  - Name: move
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: catcher, Commands: [{set_tile: meta.facing}, {mov: _dest}]}
        Dst: {Object: [_empty, grass, moss, dirt, sand, bones, mushroom, skull, bridge]}
      - Src: {Object: catcher, Commands: [{set_tile: meta.facing}, {mov: _dest}, {reward: 1}]}
        Dst: {Object: butterfly, Commands: [{remove: true}]}
      - Src: {Object: catcher, Commands: [{remove: true}, {reward: -1}]}
        Dst: {Object: spider}
      - Src: {Object: catcher, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: [water, tree, bush, rock, hedge, stone, tombstone, torch, cocoon]}

