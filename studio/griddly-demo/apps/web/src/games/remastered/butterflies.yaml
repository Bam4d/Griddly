Version: "0.1"
Environment:
  Name: Butterflies Remastered
  Description: |
    Catch every butterfly! Butterflies flutter at random and cocoons hatch new ones; spiders wander
    the gardens eating butterflies - and catchers. You win when no butterflies or cocoons are left.
    Hedges, trees, bushes and water block the way; lawns, paths and bridges are walkable.
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Sprite2D   whole level (global observer)
  #   FollowCam  15x11 window that follows the avatar
  #   CloseUp    9x9 window that follows the avatar (also the agent's default view)
  Observers:
    Sprite2D:
      TileSize: 24
      BackgroundTile: gvgai/oryx/grass_15.png
      RotateAvatarImage: false
      TrackAvatar: false
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: gvgai/oryx/grass_15.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 15
      Height: 11
    CloseUp:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: gvgai/oryx/grass_15.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 9
      Height: 9
    Block2D:
      TileSize: 24
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: false
      Width: 9
      Height: 9
    AvatarObject: catcher
  Termination:
    Win:
      - and: [{eq: [butterfly:count, 0]}, {eq: [cocoon:count, 0]}]
    Lose:
      - eq: [catcher:count, 0]
