Version: "0.1"
Environment:
  Name: Le Chat Express
  Description: |
    Le Chat Express: le chat delivers envelopes across the open-plan office. Bump a mailbox to take
    its envelope (you carry 2 at most), bump a desk of the matching colour to deliver it. Office
    chairs roll away when pushed, spilled coffee makes you slide, and meeting-room doors open and
    close on the office clock. Deliver every envelope to win.
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Sprite2D   whole level (global observer)
  #   FollowCam  15x11 window that follows the avatar
  #   CloseUp    9x9 window that follows the avatar (also the agent's default view)
  Observers:
    Sprite2D:
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      TrackAvatar: false
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 15
      Height: 11
    CloseUp:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 9
      Height: 9
    Block2D:
      TileSize: 24
  Variables:
    - Name: left
      InitialValue: 0
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: false
      Width: 9
      Height: 9
    AvatarObject: chat
  Termination:
    Win:
      - eq: [left, 0]
    Lose:
      - eq: [_steps, 1500]
