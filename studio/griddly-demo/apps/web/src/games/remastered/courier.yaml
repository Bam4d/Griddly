Actions:
  - Name: face
    InputMapping:
      Internal: true
      Inputs:
        2: {Description: Face down, VectorToDest: [0, 0], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: chat, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: chat}
  # Walk; bump mailboxes (take an envelope) and desks (deliver); push chairs; slip on coffee.
  - Name: move
