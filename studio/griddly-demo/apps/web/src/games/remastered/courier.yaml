      - Src: {Object: chair, Commands: [{mov: _dest}, {exec: {Action: roll}}]}
        Dst: {Object: [_empty, carpet, spill]}
      - Src: {Object: chair, Preconditions: [{eq: [dst.open, 1]}], Commands: [{mov: _dest}, {exec: {Action: roll}}]}
        Dst: {Object: door}
  # Chairs keep rolling (exec without ActionId reuses the push direction).
  - Name: roll
    InputMapping:
      Internal: true
    Behaviours:
      - Src: {Object: chair, Commands: [{mov: _dest}, {exec: {Action: roll}}]}
        Dst: {Object: [_empty, carpet, spill]}
      - Src: {Object: chair, Preconditions: [{eq: [dst.open, 1]}], Commands: [{mov: _dest}, {exec: {Action: roll}}]}
        Dst: {Object: door}
  # Sliding on coffee: keep going while on a spill.
  - Name: slide
    InputMapping:
      Internal: true
    Behaviours:
      - Src: {Object: chat, Commands: [{mov: _dest}]}
        Dst: {Object: [_empty, carpet]}
      - Src: {Object: chat, Commands: [{mov: _dest}, {exec: {Action: slide}}]}
        Dst: {Object: spill}
      - Src: {Object: chat, Preconditions: [{eq: [dst.open, 1]}], Commands: [{mov: _dest}]}
        Dst: {Object: door}
  # Meeting doors: closed 6 ticks, open 5 ticks (the top object of the door cell may be
  # le chat or a chair standing in the doorway).
  - Name: meet
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: open, VectorToDest: [0, 0], MetaData: {o: 1, nx: 2, dl: 5}}
        2: {Description: close, VectorToDest: [0, 0], MetaData: {o: 0, nx: 1, dl: 6}}
    Behaviours:
      - Src: {Object: door, Commands: [{set: [open, meta.o]}, {set_tile: meta.o}, {exec: {Action: meet, ActionId: meta.nx, Delay: meta.dl}}]}
        Dst: {Object: [door, chat, chair]}
  - Name: count_mail
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: count, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: [mailbox_red, mailbox_blue, mailbox_green, mailbox_yellow], Commands: [{incr: left}]}
        Dst: {Object: [mailbox_red, mailbox_blue, mailbox_green, mailbox_yellow]}
  - Name: rack_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 1, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 2, next: 1}}
    Behaviours:
      - Src:
          Object: rack
          Commands:
            - set_tile: meta.tile
            - exec: {Action: rack_anim, ActionId: meta.next, Delay: 3}
        Dst: {Object: [rack]}
  - Name: logo_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 3}}
        3: {Description: frame 2, VectorToDest: [0, 0], MetaData: {tile: 2, next: 4}}
        4: {Description: frame 3, VectorToDest: [0, 0], MetaData: {tile: 3, next: 1}}
    Behaviours:
      - Src:
          Object: logo
          Commands:
            - set_tile: meta.tile
            - exec: {Action: logo_anim, ActionId: meta.next, Delay: 2}
        Dst: {Object: [logo]}

