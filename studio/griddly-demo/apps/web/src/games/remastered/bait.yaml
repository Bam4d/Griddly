Version: "0.1"
Environment:
  Name: Bait Remastered
  Description: |
    Get the key and unlock the door. Pits block the way: push boxes into them to fill them in, and
    never step into one yourself. Toadstools are a tasty bonus. Walls, water, hedges, trees, rocks
    and tombstones block boxes; grass, sand, moss and dirt don't.
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Sprite2D   whole level (global observer)
  #   FollowCam  15x11 window that follows the avatar
  #   CloseUp    9x9 window that follows the avatar (also the agent's default view)
  Observers:
    Sprite2D:
      TileSize: 24
      BackgroundTile: gvgai/oryx/backLBrown.png
      RotateAvatarImage: false
      TrackAvatar: false
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: gvgai/oryx/backLBrown.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 15
      Height: 11
    CloseUp:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: gvgai/oryx/backLBrown.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 9
      Height: 9
    Block2D:
      TileSize: 24
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: false
      Width: 9
      Height: 9
    AvatarObject: avatar
  Termination:
    Win:
      - eq: [goal:count, 0]
    Lose:
      - eq: [avatar:count, 0]
