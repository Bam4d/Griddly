Version: "0.1"
Environment:
  Name: Mayo Rush
  Description: |
    Bufo eats mayo. Every jar makes bufo one tier bigger (0..3) and leaves a mayo splat. At tier 2+
    splats are slippery as ice; at tier 3 bufo can push heavy server racks; but fat toads don't fit
    through narrow doors (narrow: tier <= 1, regular: tier <= 2). Eat in the right order and reach the
    giant golden mayo jar.
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Sprite2D   whole level (global observer)
  #   FollowCam  15x11 window that follows the avatar
  #   CloseUp    9x9 window that follows the avatar (also the agent's default view)
  Observers:
    Sprite2D:
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      TrackAvatar: false
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 15
      Height: 11
    CloseUp:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 9
      Height: 9
    Block2D:
      TileSize: 24
  Variables:
    - Name: won
      InitialValue: 0
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: false
      Width: 9
      Height: 9
    AvatarObject: bufo
  Termination:
    Win:
      - eq: [won, 1]
  Levels:
    # First Bite | Every jar makes bufo bigger. Slim toads fit the narrow door; only an absolute unit (tier 3) can shove a rack.
