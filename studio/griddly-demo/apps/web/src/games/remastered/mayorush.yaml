Actions:
  - Name: face
    InputMapping:
      Internal: true
      Inputs:
        2: {Description: Face down, VectorToDest: [0, 0], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: bufo}

  # Bufo: absolute 4-way move. Render tile = facing + 4 * tier (tb = 4 * tier).
  - Name: move
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: bufo, Commands: [{set: [facing, meta.facing]}, {set: [tile, facing]}, {add: [tile, tb]}, {set_tile: tile}, {mov: _dest}]}
        Dst: {Object: [_empty, cable, logo_floor, vent]}
      - Src: {Object: bufo, Preconditions: [{lt: [src.tier, 2]}], Commands: [{set: [facing, meta.facing]}, {set: [tile, facing]}, {add: [tile, tb]}, {set_tile: tile}, {mov: _dest}]}
        Dst: {Object: splat}
      - Src: {Object: bufo, Preconditions: [{gte: [src.tier, 2]}], Commands: [{set: [facing, meta.facing]}, {set: [tile, facing]}, {add: [tile, tb]}, {set_tile: tile}, {mov: _dest}, {exec: {Action: slide}}]}
        Dst: {Object: splat}
      # eating: the jar turns into a splat, bufo steps onto it and grows (no slide)
      - Src: {Object: bufo, Commands: [{set: [facing, meta.facing]}, {set: [tile, facing]}, {add: [tile, tb]}, {set_tile: tile}, {mov: _dest}, {incr: eaten}, {if: {Conditions: {lt: [tier, 3]}, OnTrue: [{incr: tier}, {add: [tb, 4]}]}}, {set: [tile, facing]}, {add: [tile, tb]}, {set_tile: tile}, {reward: 1}]}
        Dst: {Object: jar, Commands: [{change_to: splat}]}
      - Src: {Object: bufo, Commands: [{set: [facing, meta.facing]}, {set: [tile, facing]}, {add: [tile, tb]}, {set_tile: tile}, {set: [won, 1]}, {reward: 10}]}
        Dst: {Object: golden}
      - Src: {Object: bufo, Preconditions: [{lte: [src.tier, 1]}], Commands: [{set: [facing, meta.facing]}, {set: [tile, facing]}, {add: [tile, tb]}, {set_tile: tile}, {mov: _dest}]}
        Dst: {Object: door_narrow}
      - Src: {Object: bufo, Preconditions: [{gt: [src.tier, 1]}], Commands: [{set: [facing, meta.facing]}, {set: [tile, facing]}, {add: [tile, tb]}, {set_tile: tile}]}
        Dst: {Object: door_narrow}
      - Src: {Object: bufo, Preconditions: [{lte: [src.tier, 2]}], Commands: [{set: [facing, meta.facing]}, {set: [tile, facing]}, {add: [tile, tb]}, {set_tile: tile}, {mov: _dest}]}
        Dst: {Object: door_wide}
      - Src: {Object: bufo, Preconditions: [{gt: [src.tier, 2]}], Commands: [{set: [facing, meta.facing]}, {set: [tile, facing]}, {add: [tile, tb]}, {set_tile: tile}]}
        Dst: {Object: door_wide}
      # pushing a heavy rack needs tier 3 (the rack moves one cell; pushing never slides)
      - Src: {Object: bufo, Preconditions: [{gte: [src.tier, 3]}], Commands: [{set: [facing, meta.facing]}, {set: [tile, facing]}, {add: [tile, tb]}, {set_tile: tile}, {mov: _dest}]}
        Dst: {Object: rack, Commands: [{cascade: _dest}]}
      - Src: {Object: bufo, Preconditions: [{lt: [src.tier, 3]}], Commands: [{set: [facing, meta.facing]}, {set: [tile, facing]}, {add: [tile, tb]}, {set_tile: tile}]}
        Dst: {Object: rack}
      - Src: {Object: bufo, Commands: [{set: [facing, meta.facing]}, {set: [tile, facing]}, {add: [tile, tb]}, {set_tile: tile}]}
        Dst: {Object: [wall, bolted, coolant, plant, logo_sign]}
      - Src: {Object: rack, Commands: [{mov: _dest}]}
        Dst: {Object: [_empty, cable, logo_floor, vent, splat]}

  # Internal: keep sliding in the same direction (exec without ActionId reuses the move's vector).
  - Name: slide
    InputMapping:
      Internal: true
    Behaviours:
      - Src: {Object: bufo, Commands: [{mov: _dest}]}
        Dst: {Object: [_empty, cable, logo_floor, vent]}
      - Src: {Object: bufo, Commands: [{mov: _dest}, {exec: {Action: slide}}]}
        Dst: {Object: splat}
      - Src: {Object: bufo, Commands: [{mov: _dest}, {incr: eaten}, {if: {Conditions: {lt: [tier, 3]}, OnTrue: [{incr: tier}, {add: [tb, 4]}]}}, {set: [tile, facing]}, {add: [tile, tb]}, {set_tile: tile}, {reward: 1}]}
        Dst: {Object: jar, Commands: [{change_to: splat}]}
      - Src: {Object: bufo, Commands: [{set: [won, 1]}, {reward: 10}]}
        Dst: {Object: golden}
      - Src: {Object: bufo, Preconditions: [{lte: [src.tier, 1]}], Commands: [{mov: _dest}]}
        Dst: {Object: door_narrow}
      - Src: {Object: bufo, Preconditions: [{lte: [src.tier, 2]}], Commands: [{mov: _dest}]}
        Dst: {Object: door_wide}

  - Name: golden_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 1}}
    Behaviours:
      - Src:
          Object: golden
          Commands:
            - set_tile: meta.tile
            - exec: {Action: golden_anim, ActionId: meta.next, Delay: 4}
        Dst: {Object: [golden]}
  - Name: jar_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 1}}
    Behaviours:
      - Src:
          Object: jar
          Commands:
            - set_tile: meta.tile
            - exec: {Action: jar_anim, ActionId: meta.next, Delay: 5}
        Dst: {Object: [jar]}
  - Name: rack_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 1}}
    Behaviours:
      - Src:
          Object: rack
          Commands:
            - set_tile: meta.tile
            - exec: {Action: rack_anim, ActionId: meta.next, Delay: 3}
        Dst: {Object: [rack]}
  - Name: logo_sign_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 3}}
        3: {Description: frame 2, VectorToDest: [0, 0], MetaData: {tile: 2, next: 4}}
        4: {Description: frame 3, VectorToDest: [0, 0], MetaData: {tile: 3, next: 1}}
    Behaviours:
      - Src:
          Object: logo_sign
          Commands:
            - set_tile: meta.tile
            - exec: {Action: logo_sign_anim, ActionId: meta.next, Delay: 3}
        Dst: {Object: [logo_sign]}

Objects:
  - Name: wall
    MapCharacter: "w"
    Z: 1
    Observers:
      Sprite2D: &wall_sprite
        - TilingMode: WALL_16
          Image:
            - memes/dcwall-0.png
            - memes/dcwall-1.png
            - memes/dcwall-2.png
            - memes/dcwall-3.png
            - memes/dcwall-4.png
            - memes/dcwall-5.png
            - memes/dcwall-6.png
            - memes/dcwall-7.png
            - memes/dcwall-8.png
            - memes/dcwall-9.png
            - memes/dcwall-10.png
            - memes/dcwall-11.png
            - memes/dcwall-12.png
            - memes/dcwall-13.png
            - memes/dcwall-14.png
            - memes/dcwall-15.png
      FollowCam: *wall_sprite
      CloseUp: *wall_sprite
      Block2D:
        - Shape: square
          Color: [0.3, 0.32, 0.4]
