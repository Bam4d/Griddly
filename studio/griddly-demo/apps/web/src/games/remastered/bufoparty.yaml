Version: "0.1"
Environment:
  Name: Bufo Party
  Description: |
    Bufo Party: every party bufo on the dance floor copies your moves - same direction, same time,
    each blocked by walls, decor and bufos that can't get out of the way. Sleepy bufos join the
    dance when a dancing bufo bumps into them; speakers can be pushed. Win when every bufo
    (you included) stands on a party pad at the same time.
    Generated by studio/griddly-demo/tools/remaster — edit the generator, not this file.
  # Cameras are observers. The demo picks one by name and the engine renders it.
  #   Sprite2D   whole level (global observer)
  #   FollowCam  15x11 window that follows the avatar
  #   CloseUp    9x9 window that follows the avatar (also the agent's default view)
  Observers:
    Sprite2D:
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      TrackAvatar: false
    FollowCam:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 15
      Height: 11
    CloseUp:
      Type: SPRITE_2D
      TileSize: 24
      BackgroundTile: memes/dcfloor.png
      RotateAvatarImage: false
      RotateWithAvatar: false
      TrackAvatar: true
      Width: 9
      Height: 9
    Block2D:
      TileSize: 24
  Variables:
    - Name: cmd
      InitialValue: 0
    - Name: turn
      InitialValue: 0
    - Name: placed
      InitialValue: 0
    - Name: crowd
      InitialValue: 0
  Player:
    Observer:
      TrackAvatar: true
      RotateWithAvatar: false
      RotateAvatarImage: false
      Width: 9
      Height: 9
    AvatarObject: bufo
  Termination:
    Win:
      - eq: [placed, crowd]
    Lose:
      - eq: [_steps, 600]
  Levels:
    # First Dance | Your buddy copies every move. Use the walls to line you both up on the pads.
    - |
      w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w
      w   Q   Q   .   .   .   .   .   L   .   .   .   .   .   P   P   w
      w   o   .   .   :   :   :   :   :   :   :   :   :   .   .   .   w
      w   o   .   .   :   :   :   :   :   :   :   :   :   .   .   .   w
      w   P   .   .   :   :   :   w   w   w   :   :   :   .   .   P   w
      w   .   .   .   :   :   :   :   :   :   :   :   :   .   .   .   w
      w   .   .   .   :   :   :   :   :   :   b   :   :   .   .   .   w
      w   Q   Q   .   .   .   .   .   L   .   .   .   .   A   Q   Q   w
      w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w
    # Conga Line | Two party bufos copy you. Bump a wall to let them catch up.
    - |
      w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w
      w   Q   Q   .   .   .   .   .   .   L   .   .   .   .   .   .   P   P   w
      w   .   .   :   :   :   :   :   :   :   :   :   :   :   :   :   .   .   w
      w   o   .   :   :   w   :   :   :   :   :   o   b   :   w   :   .   .   w
      w   .   .   :   :   :   :   :   w   w   w   :   :   :   :   :   :   .   w
      w   P   .   :   :   :   :   :   :   :   :   :   :   :   :   :   b   P   w
      w   o   .   :   :   :   w   :   :   :   :   :   w   :   :   :   :   A   w
      w   .   .   :   :   :   :   :   :   :   :   :   :   :   :   :   .   .   w
      w   Q   Q   .   .   .   .   .   P   L   P   .   .   .   .   .   Q   Q   w
      w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w
    # Wake-up Call | Sleepy bufos (zzz) join the dance when a dancing bufo bumps into them.
    - |
      w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w
      w   Q   Q   Q   .   .   .   .   .   L   L   L   .   .   .   .   o   P   P   P   w
      w   A   .   .   :   :   :   :   :   :   :   :   :   :   :   o   :   .   o   .   w
      w   .   .   .   :   :   :   :   w   :   :   :   :   w   :   :   :   :   .   .   w
      w   P   .   .   :   :   :   :   o   :   :   w   :   :   :   :   z   .   .   P   w
      w   .   .   .   :   :   w   :   :   :   :   :   :   :   :   z   w   :   .   .   w
      w   .   .   .   :   :   :   :   :   w   w   w   :   :   :   :   :   :   .   .   w
      w   P   .   .   :   :   :   :   :   :   :   :   :   :   :   :   :   .   .   P   w
      w   .   .   .   :   :   :   :   w   b   :   :   :   :   w   :   :   :   .   .   w
      w   Q   Q   Q   .   .   .   .   .   L   L   L   .   .   .   .   .   Q   Q   Q   w
      w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w
    # Bass Drop | Speakers can be pushed by any dancing bufo. Everyone onto a pad!
    - |
      w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w
      w   P   P   o   o   .   .   .   .   Q   Q   Q   Q   Q   .   .   .   .   .   .   P   P   w
      w   o   .   :   :   s   :   :   :   :   :   :   :   :   :   :   :   :   :   :   .   .   w
      w   o   .   :   :   :   :   w   :   :   :   :   :   :   :   w   :   :   :   :   .   .   w
      w   .   .   :   b   :   :   :   :   :   :   w   :   :   :   :   :   :   :   :   .   .   w
      w   L   .   :   :   z   w   :   :   :   :   :   :   :   :   :   w   :   :   :   :   L   w
      w   .   .   :   :   :   :   :   :   :   :   w   :   :   b   :   :   :   :   :   .   .   w
      w   .   .   :   :   :   :   w   :   :   :   :   :   :   :   w   :   :   :   :   A   .   w
      w   .   .   :   :   :   :   :   :   :   :   :   :   :   :   :   :   :   :   :   .   .   w
      w   P   P   .   .   .   .   .   .   Q   Q   Q   Q   Q   .   .   .   .   .   .   P   P   w
      w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w
    # Afterparty | The whole office is dancing. Five bufos, five pads, one speaker.
    - |
      w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w
      w   Q   Q   Q   .   .   .   .   .   .   L   L   L   L   L   .   .   .   .   .   .   Q   Q   Q   w
      w   .   .   .   .   :   :   :   :   :   :   :   :   :   :   :   :   :   :   :   .   A   .   .   w
      w   .   .   .   :   :   :   :   w   :   :   :   :   :   :   :   :   :   w   :   :   :   .   o   w
      w   P   .   .   :   :   :   :   :   :   :   :   :   w   :   :   :   :   :   :   :   .   .   P   w
      w   .   .   .   :   :   :   w   w   :   :   :   :   :   :   :   :   :   w   w   :   :   .   .   w
      w   L   .   .   :   :   :   :   :   :   :   :   :   :   :   :   :   :   :   :   :   .   .   L   w
      w   .   .   .   :   :   :   w   w   :   :   :   z   :   :   :   :   :   w   w   :   :   .   .   w
      w   P   .   .   :   :   :   :   :   :   :   :   :   w   :   :   :   :   :   :   :   .   .   P   w
      w   .   .   .   :   :   :   :   w   :   :   :   :   :   :   :   :   :   w   :   :   :   o   o   w
      w   .   .   .   .   :   :   :   z   :   b   s   :   :   :   :   :   :   b   :   .   .   o   o   w
      w   Q   Q   Q   .   .   .   .   .   .   L   L   L   L   L   .   .   .   .   .   .   Q   Q   Q   w
      w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w   w

Actions:
  - Name: face
    InputMapping:
      Internal: true
      Inputs:
        2: {Description: Face down, VectorToDest: [0, 0], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}]}
        Dst: {Object: bufo}
  # You step; every party bufo copies the step this tick (see `step`).
  - Name: move
    InputMapping:
      Inputs:
        1: {Description: Left, VectorToDest: [-1, 0], MetaData: {facing: 3, d: 1}}
        2: {Description: Up, VectorToDest: [0, -1], MetaData: {facing: 0, d: 2}}
        3: {Description: Right, VectorToDest: [1, 0], MetaData: {facing: 1, d: 3}}
        4: {Description: Down, VectorToDest: [0, 1], MetaData: {facing: 2, d: 4}}
    Behaviours:
      - Src: {Object: bufo, Commands: [{set_tile: meta.facing}, {set: [cmd, meta.d]}, {incr: turn}, {exec: {Action: step, ActionId: meta.d}}]}
        Dst: {Object: [disco, pad, speaker, sleepy, bufo, party, woke, wall, rack, logo, plant, _boundary, _empty]}
  # One simultaneous dance step. A bufo walking into a dancing bufo first lets it move (cascade), so
  # lines of bufos move together; `last`/`turn` makes every bufo step at most once per turn.
  - Name: step
    InputMapping:
      Internal: true
      Inputs:
        1: {VectorToDest: [-1, 0], MetaData: {facing: 3}}
        2: {VectorToDest: [0, -1], MetaData: {facing: 0}}
        3: {VectorToDest: [1, 0], MetaData: {facing: 1}}
        4: {VectorToDest: [0, 1], MetaData: {facing: 2}}
    Behaviours:
      - Src: {Object: bufo, Preconditions: [{neq: [src.last, turn]}], Commands: [{set: [last, turn]}, {set_tile: meta.facing}, {mov: _dest}, {if: {Conditions: {eq: [onp, 1]}, OnTrue: [{decr: placed}, {set: [onp, 0]}]}}]}
        Dst: {Object: [_empty, disco]}
      - Src: {Object: bufo, Preconditions: [{neq: [src.last, turn]}], Commands: [{set: [last, turn]}, {set_tile: meta.facing}, {mov: _dest}, {if: {Conditions: {eq: [onp, 0]}, OnTrue: [{incr: placed}, {set: [onp, 1]}]}}]}
        Dst: {Object: pad}
      - Src: {Object: bufo, Preconditions: [{neq: [src.last, turn]}], Commands: [{set: [last, turn]}, {set_tile: meta.facing}, {exec: {Action: step2}}]}
        Dst: {Object: [bufo, party, woke, speaker], Commands: [{cascade: _dest}]}
      - Src: {Object: bufo, Preconditions: [{neq: [src.last, turn]}], Commands: [{set: [last, turn]}, {set_tile: meta.facing}]}
        Dst: {Object: sleepy, Commands: [{change_to: woke}]}
      - Src: {Object: bufo, Preconditions: [{neq: [src.last, turn]}], Commands: [{set: [last, turn]}, {set_tile: meta.facing}]}
        Dst: {Object: [wall, rack, logo, plant, _boundary]}
      - Src: {Object: party, Preconditions: [{neq: [src.last, turn]}], Commands: [{set: [last, turn]}, {mov: _dest}, {if: {Conditions: {eq: [onp, 1]}, OnTrue: [{decr: placed}, {set: [onp, 0]}]}}]}
        Dst: {Object: [_empty, disco]}
      - Src: {Object: party, Preconditions: [{neq: [src.last, turn]}], Commands: [{set: [last, turn]}, {mov: _dest}, {if: {Conditions: {eq: [onp, 0]}, OnTrue: [{incr: placed}, {set: [onp, 1]}]}}]}
        Dst: {Object: pad}
      - Src: {Object: party, Preconditions: [{neq: [src.last, turn]}], Commands: [{set: [last, turn]}, {exec: {Action: step2}}]}
        Dst: {Object: [bufo, party, woke, speaker], Commands: [{cascade: _dest}]}
      - Src: {Object: party, Preconditions: [{neq: [src.last, turn]}], Commands: [{set: [last, turn]}]}
        Dst: {Object: sleepy, Commands: [{change_to: woke}]}
      - Src: {Object: party, Preconditions: [{neq: [src.last, turn]}], Commands: [{set: [last, turn]}]}
        Dst: {Object: [wall, rack, logo, plant, _boundary]}
      - Src: {Object: woke, Preconditions: [{neq: [src.last, turn]}], Commands: [{set: [last, turn]}, {mov: _dest}, {if: {Conditions: {eq: [onp, 1]}, OnTrue: [{decr: placed}, {set: [onp, 0]}]}}]}
        Dst: {Object: [_empty, disco]}
      - Src: {Object: woke, Preconditions: [{neq: [src.last, turn]}], Commands: [{set: [last, turn]}, {mov: _dest}, {if: {Conditions: {eq: [onp, 0]}, OnTrue: [{incr: placed}, {set: [onp, 1]}]}}]}
        Dst: {Object: pad}
      - Src: {Object: woke, Preconditions: [{neq: [src.last, turn]}], Commands: [{set: [last, turn]}, {exec: {Action: step2}}]}
        Dst: {Object: [bufo, party, woke, speaker], Commands: [{cascade: _dest}]}
      - Src: {Object: woke, Preconditions: [{neq: [src.last, turn]}], Commands: [{set: [last, turn]}]}
        Dst: {Object: sleepy, Commands: [{change_to: woke}]}
      - Src: {Object: woke, Preconditions: [{neq: [src.last, turn]}], Commands: [{set: [last, turn]}]}
        Dst: {Object: [wall, rack, logo, plant, _boundary]}
      - Src: {Object: speaker, Commands: [{mov: _dest}]}
        Dst: {Object: [_empty, disco, pad]}
      - Src: {Object: speaker, Commands: [{exec: {Action: step2}}]}
        Dst: {Object: [bufo, party, woke], Commands: [{cascade: _dest}]}
  # Second half of a step into a cell that was occupied: after the occupant moved (or not), try
  # again against whatever is there now (exec without ActionId reuses the step's direction).
  - Name: step2
    InputMapping:
      Internal: true
    Behaviours:
      - Src: {Object: bufo, Commands: [{mov: _dest}, {if: {Conditions: {eq: [onp, 1]}, OnTrue: [{decr: placed}, {set: [onp, 0]}]}}]}
        Dst: {Object: [_empty, disco]}
      - Src: {Object: bufo, Commands: [{mov: _dest}, {if: {Conditions: {eq: [onp, 0]}, OnTrue: [{incr: placed}, {set: [onp, 1]}]}}]}
        Dst: {Object: pad}
      - Src: {Object: party, Commands: [{mov: _dest}, {if: {Conditions: {eq: [onp, 1]}, OnTrue: [{decr: placed}, {set: [onp, 0]}]}}]}
        Dst: {Object: [_empty, disco]}
      - Src: {Object: party, Commands: [{mov: _dest}, {if: {Conditions: {eq: [onp, 0]}, OnTrue: [{incr: placed}, {set: [onp, 1]}]}}]}
        Dst: {Object: pad}
      - Src: {Object: woke, Commands: [{mov: _dest}, {if: {Conditions: {eq: [onp, 1]}, OnTrue: [{decr: placed}, {set: [onp, 0]}]}}]}
        Dst: {Object: [_empty, disco]}
      - Src: {Object: woke, Commands: [{mov: _dest}, {if: {Conditions: {eq: [onp, 0]}, OnTrue: [{incr: placed}, {set: [onp, 1]}]}}]}
        Dst: {Object: pad}
      - Src: {Object: speaker, Commands: [{mov: _dest}]}
        Dst: {Object: [_empty, disco, pad]}
  # Party bufos copy the last move every tick.
  - Name: tick
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: tick, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: [party, woke], Commands: [{exec: {Action: step, ActionId: cmd}}, {exec: {Action: tick, ActionId: 1, Delay: 1}}]}
        Dst: {Object: [party, woke]}
  # A woken bufo starts dancing next turn.
  - Name: wake
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: wake, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: woke, Commands: [{set: [last, turn]}, {exec: {Action: tick, ActionId: 1, Delay: 1}}]}
        Dst: {Object: woke}
  - Name: count_crowd
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: count, VectorToDest: [0, 0]}
    Behaviours:
      - Src: {Object: [bufo, party, sleepy], Commands: [{incr: crowd}]}
        Dst: {Object: [bufo, party, sleepy]}
  - Name: rack_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 1, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 2, next: 1}}
    Behaviours:
      - Src:
          Object: rack
          Commands:
            - set_tile: meta.tile
            - exec: {Action: rack_anim, ActionId: meta.next, Delay: 3}
        Dst: {Object: [rack]}
  - Name: logo_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 3}}
        3: {Description: frame 2, VectorToDest: [0, 0], MetaData: {tile: 2, next: 4}}
        4: {Description: frame 3, VectorToDest: [0, 0], MetaData: {tile: 3, next: 1}}
    Behaviours:
      - Src:
          Object: logo
          Commands:
            - set_tile: meta.tile
            - exec: {Action: logo_anim, ActionId: meta.next, Delay: 2}
        Dst: {Object: [logo]}
  - Name: pad_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 3}}
        3: {Description: frame 2, VectorToDest: [0, 0], MetaData: {tile: 2, next: 1}}
    Behaviours:
      - Src:
          Object: pad
          Commands:
            - set_tile: meta.tile
            - exec: {Action: pad_anim, ActionId: meta.next, Delay: 2}
        Dst: {Object: [pad, bufo, party, woke, speaker]}
  - Name: disco_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 3}}
        3: {Description: frame 2, VectorToDest: [0, 0], MetaData: {tile: 2, next: 1}}
    Behaviours:
      - Src:
          Object: disco
          Commands:
            - set_tile: meta.tile
            - exec: {Action: disco_anim, ActionId: meta.next, Delay: 3}
        Dst: {Object: [disco, bufo, party, woke, speaker, sleepy]}
  - Name: party_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 1}}
    Behaviours:
      - Src:
          Object: party
          Commands:
            - set_tile: meta.tile
            - exec: {Action: party_anim, ActionId: meta.next, Delay: 3}
        Dst: {Object: [party]}
  - Name: woke_anim
    InputMapping:
      Internal: true
      Inputs:
        1: {Description: frame 0, VectorToDest: [0, 0], MetaData: {tile: 0, next: 2}}
        2: {Description: frame 1, VectorToDest: [0, 0], MetaData: {tile: 1, next: 1}}
    Behaviours:
      - Src:
          Object: woke
          Commands:
            - set_tile: meta.tile
            - exec: {Action: woke_anim, ActionId: meta.next, Delay: 3}
        Dst: {Object: [woke]}

