Actions:
  # Spiders wander: rotate left/right or step forwards, at random.
  - Name: random_movement
    InputMapping:
      Inputs:
        1:
          Description: Rotate left
          OrientationVector: [-1, 0]
        2:
          Description: Move forwards
          OrientationVector: [0, -1]
          VectorToDest: [0, -1]
        3:
          Description: Rotate right
          OrientationVector: [1, 0]
      Relative: true
      Internal: true
    Behaviours:
      - Src:
          Object: spider
          Commands:
            - rot: _dir
            - exec: {Action: random_movement, Delay: 3, Randomize: true}
        Dst:
          Object: spider
      - Src:
          Object: spider
          Commands:
            - mov: _dest
            - exec: {Action: random_movement, Delay: 3, Randomize: true}
        Dst:
          Object: _empty
      - Src:
          Object: spider
          Commands:
            - mov: _dest
            - exec: {Action: random_movement, Delay: 3, Randomize: true}
        Dst:
          Object: [grass, moss, dirt, bones, mushroom, skull, bridge]
      - Src:
          Object: spider
          Commands:
            - exec: {Action: random_movement, Delay: 3, Randomize: true}
        Dst:
          Object: [wall, hedge, water, bush, tree, tombstone, gem]
      - Src:
          Object: spider
        Dst:
          Object: gnome
          Commands:
            - remove: true
            - reward: -1

  # The gnome moves up / down / left / right (default absolute mapping: 1 left, 2 up, 3 right, 4 down).
  - Name: move
    Behaviours:
      - Src:
          Object: gnome
          Commands:
            - remove: true
            - reward: -1
        Dst:
          Object: spider
      - Src:
          Object: gnome
          Commands:
            - mov: _dest
        Dst:
          Object: _empty
      - Src:
          Object: gnome
          Commands:
            - mov: _dest
        Dst:
          Object: [grass, moss, dirt, bones, mushroom, skull, bridge]
      - Src:
          Object: gnome
          Commands:
            - reward: 1
        Dst:
          Object: gem
          Commands:
            - remove: true

